<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>APLIKASI DIGITAL RT 06 RANTAU KEMINTING</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    
    body { 
        background-color: #f3f4f6; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
        width: 100%;
    }
    
    .app-container { 
        max-width: 480px; 
        margin: 0 auto; 
        background: white; 
        min-height: 100vh; 
        position: relative; 
        padding-bottom: 70px; 
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        overflow-x: hidden;
        width: 100%;
    }
    
    /* Mencegah scroll horizontal */
    html, body {
        overflow-x: hidden !important;
        width: 100%;
        position: relative;
    }
    
    /* Container utama */
    #root {
        width: 100%;
        overflow-x: hidden;
    }
    
    /* Perbaikan untuk grid */
    .grid {
        display: grid;
        gap: 0.75rem;
    }
    
    .grid-cols-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    
    /* Loading Screen */
    #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(to bottom right, #3b82f6, #4f46e5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s;
    }
    
    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .loading-text {
        text-align: center;
        color: white;
    }
    
    /* Scroll halus */
    .overflow-y-auto {
        -webkit-overflow-scrolling: touch;
    }
    
    /* Perbaikan input di mobile (mencegah zoom) */
    input, select, textarea {
        font-size: 16px !important;
        -webkit-appearance: none;
        border-radius: 12px;
    }
    
    /* Perbaikan bottom navigation dengan safe area */
    .bottom-nav {
        padding-bottom: env(safe-area-inset-bottom, 0.75rem);
    }
    
    /* Semua gambar responsif */
    img {
        max-width: 100%;
        height: auto;
    }
    
    /* Responsive untuk mobile */
    @media (max-width: 480px) {
        .grid-cols-4 {
            gap: 0.5rem;
        }
        .grid-cols-2 {
            gap: 0.5rem;
        }
        .p-4 {
            padding: 0.75rem !important;
        }
        .text-xl {
            font-size: 1.125rem !important;
        }
    }
</style>
</head>
<body>
    <div id="root" style="width:100%; overflow-x:hidden;">
    <div id="loading-screen">
        <div class="loading-text">
            <div class="loading-spinner"></div>
            <p>Memuat Aplikasi Digital RT 06...</p>
            <p style="font-size: 12px; margin-top: 10px; opacity: 0.8;">Mohon tunggu sebentar</p>
        </div>
    </div>
</div>

    <script type="text/babel">
    // Hilangkan loading screen setelah React siap
    setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                if (loadingScreen) loadingScreen.remove();
            }, 500);
        }
    }, 100);
    
    const { useState, useEffect, useMemo, useCallback } = React;

    // ==========================================
    // UTILITAS KEAMANAN (HASHING)
    // ==========================================
    const hashPassword = async (password) => {
        const msgUint8 = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    };

    // ==========================================
    // API INTEGRASI (GOOGLE APPS SCRIPT)
    // ==========================================
    const callAPI = async (action, payload) => {
        let processedPayload = { ...payload };
        
        if (action === 'login') {
            processedPayload.hashedPassword = await hashPassword(payload.password);
        } else if (action === 'changePassword') {
            processedPayload.hashedOld = await hashPassword(payload.oldPassword);
            processedPayload.hashedNew = await hashPassword(payload.newPassword);
        } else if (action === 'adminResetPassword') {
            processedPayload.hashedNew = await hashPassword(payload.newPassword);
        }

        return new Promise((resolve) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((responseStr) => {
                        try { resolve(JSON.parse(responseStr)); }
                        catch (e) { resolve({ status: 'error', message: 'Gagal membaca respon server.' }); }
                    })
                    .withFailureHandler((error) => { resolve({ status: 'error', message: error.message }); })
                    .apiHandler(action, JSON.stringify(processedPayload));
            } else {
                resolve({ status: 'error', message: 'Aplikasi harus dijalankan dari link Google Apps Script (Web App)!' });
            }
        });
    };

    // ==========================================
    // KOMPONEN UI GLOBAL & HELPER
    // ==========================================
    // Tambahkan di dalam SuratView atau di global
const formatRp = (value) => {
    if (!value && value !== 0) return '-';
    return new Intl.NumberFormat('id-ID', { 
        style: 'currency', 
        currency: 'IDR', 
        minimumFractionDigits: 0 
    }).format(value);
};

    const Topbar = ({ title, user, unreadCount, onBellClick }) => (
    <div className="bg-blue-600 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-md w-full">
        <h1 className="text-base font-bold tracking-wider truncate flex-1">
            <i className="fas fa-building mr-2"></i> 
            <span className="hidden sm:inline">{title}</span>
            <span className="sm:hidden">RT 06</span>
        </h1>
        {user && (
            <div className="flex items-center gap-2 shrink-0">
                <button onClick={onBellClick} className="relative text-white hover:text-blue-200 transition p-1">
                    <i className="fas fa-bell text-lg"></i>
                    {unreadCount > 0 && (
                        <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white shadow-sm min-w-[16px] text-center">
                            {unreadCount > 9 ? '9+' : unreadCount}
                        </span>
                    )}
                </button>
            </div>
        )}
    </div>
);

    const BottomNav = ({ currentView, setCurrentView }) => {
    const navs = [
        { id: 'dashboard', icon: 'fa-home', label: 'Home' },
        { id: 'panic', icon: 'fa-exclamation-triangle', label: 'Darurat', color: 'text-red-500' },
        { id: 'pengaturan', icon: 'fa-cog', label: 'Setting' }
    ];
    
    return (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2 pb-3 px-2 z-50 max-w-[480px] mx-auto">
            {navs.map(n => (
                <button 
                    key={n.id} 
                    onClick={() => setCurrentView(n.id)}
                    className={`flex flex-col items-center justify-center py-1 px-2 rounded-lg transition-all flex-1 ${
                        currentView === n.id ? 'text-blue-600 bg-blue-50' : 'text-gray-400'
                    }`}
                >
                    <i className={`fas ${n.icon} text-base sm:text-lg ${n.color || ''} ${currentView === n.id ? 'scale-110' : ''} transition-transform`}></i>
                    <span className="text-[9px] sm:text-[10px] font-semibold mt-0.5">{n.label}</span>
                </button>
            ))}
        </div>
    );
};

    const Loader = () => <div className="flex justify-center items-center py-10"><i className="fas fa-circle-notch fa-spin text-3xl text-blue-500"></i></div>;

    const SearchBar = ({ searchTerm, setSearchTerm, placeholder }) => (
        <div className="relative mb-4">
            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-search text-gray-400"></i></div>
            <input type="text" className="block w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 sm:text-sm shadow-sm" placeholder={placeholder || "Cari data..."} value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
        </div>
    );

    const BottomSheet = ({ isOpen, onClose, title, children }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-[100] flex justify-center items-end bg-black bg-opacity-50 transition-opacity">
                <div className="bg-white w-full max-w-[480px] mx-auto rounded-t-3xl shadow-2xl transform transition-transform animate-slide-up flex flex-col max-h-[85vh]">
                    <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-white rounded-t-3xl sticky top-0 z-10">
                        <h3 className="font-bold text-base text-gray-800 truncate flex-1">{title}</h3>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-800 p-2 rounded-full bg-gray-50 hover:bg-gray-100 transition w-8 h-8 flex items-center justify-center shrink-0"><i className="fas fa-times text-sm"></i></button>
                    </div>
                    <div className="p-4 overflow-y-auto flex-1">{children}</div>
                </div>
            </div>
        );
    };

    const DetailViewer = ({ data, onEdit, canEdit, onClose }) => {
        if (!data) return null;
        return (
            <div className="space-y-4">
                {(data.Foto || data.Bukti) && (
                    <div className="w-full h-48 bg-gray-100 rounded-xl overflow-hidden mb-4 shadow-sm border border-gray-200">
                        <img src={data.Foto || data.Bukti} className="w-full h-full object-contain bg-white" alt="Lampiran" />
                    </div>
                )}
                <div className="space-y-3">
                    {Object.entries(data).filter(([k]) => k !== 'id' && k !== 'Foto' && k !== 'Bukti' && k !== 'source' && k !== 'isIncome' && k !== 'PasswordHash' && k !== 'PasswordPlain').map(([k, v]) => (
                        <div key={k} className="bg-gray-50 p-3 rounded-lg border border-gray-100">
                            <p className="text-[10px] text-gray-400 font-bold uppercase mb-1 tracking-wider">{k}</p>
                            <p className="text-sm text-gray-800 font-medium whitespace-pre-wrap">{v || '-'}</p>
                        </div>
                    ))}
                </div>
                {canEdit && (
                    <button onClick={() => { onClose(); onEdit(data); }} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl mt-4 flex justify-center items-center gap-2 shadow-md">
                        <i className="fas fa-edit"></i> Edit Data Ini
                    </button>
                )}
            </div>
        );
    };

    // ==========================================
    // LOGIN VIEW (DIPERBAIKI - HAPUS KODE YANG SALAH)
    // ==========================================
    const LoginView = ({ onLogin }) => {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [loading, setLoading] = useState(false);

        const handleLogin = async (e) => {
            e.preventDefault(); 
            setLoading(true);
            const res = await callAPI('login', { username, password });
            setLoading(false);
            if (res.status === 'success') {
                onLogin(res.data);
            } else {
                Swal.fire({ 
                    icon: 'error', 
                    title: 'Login Gagal', 
                    text: res.message + '\n\nHubungi Ketua RT untuk mendapatkan akun.' 
                });
            }
        };

        return (
            <div className="flex flex-col justify-center items-center h-screen p-6 bg-gradient-to-br from-blue-500 to-indigo-600">
                <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
                    <div className="bg-blue-100 text-blue-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i className="fas fa-users-cog text-4xl"></i>
                    </div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2 text-center">APLIKASI DIGITAL RT 06</h2>
                    <p className="text-gray-500 mb-6 text-center text-sm">RANTAU KEMINTING</p>
                    
                    <form onSubmit={handleLogin} className="space-y-4">
                        <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-user text-gray-400"></i></div>
                            <input type="text" placeholder="Username (No KTP)" required className="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition" value={username} onChange={e => setUsername(e.target.value)} />
                        </div>
                        <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-lock text-gray-400"></i></div>
                            <input type="password" placeholder="Password (6 digit terakhir KTP)" required className="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white transition" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200 mt-2 shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2">
                            {loading ? <><i className="fas fa-spinner fa-spin"></i> Memproses...</> : 'Masuk'}
                        </button>
                        <div className="mt-4 pt-4 border-t border-gray-100 text-center">
                            <p className="text-xs text-gray-400"><i className="fas fa-info-circle mr-1"></i> @SobatRanting2026</p>
                        </div>
                    </form>
                </div>
            </div>
        );
    };

    // ==========================================
    // DARURAT ALERT (UNTUK ADMIN)
    // ==========================================
    const DaruratAlert = ({ onResolve }) => {
        const [activePanics, setActivePanics] = useState([]);
        const [alarmPlaying, setAlarmPlaying] = useState(false);
        let alarmInterval = null;
        let audioContext = null;

        const loadActivePanics = async () => {
            const res = await callAPI('read', { sheetName: 'Panic' });
            if (res.status === 'success') {
                const active = res.data.filter(p => p.Status === 'AKTIF');
                setActivePanics(active);
                if (active.length > 0 && !alarmPlaying) {
                    startSirenAlarm();
                } else if (active.length === 0 && alarmPlaying) {
                    stopAlarm();
                }
            }
        };

        const playSiren = () => {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioContext.currentTime;
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.type = 'sine';
                gainNode.gain.value = 0.4;
                oscillator.frequency.setValueAtTime(600, now);
                oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
                oscillator.frequency.exponentialRampToValueAtTime(600, now + 1);
                oscillator.frequency.exponentialRampToValueAtTime(1200, now + 1.5);
                oscillator.start();
                oscillator.stop(now + 2);
                if (audioContext.state === 'suspended') audioContext.resume();
            } catch(e) { console.log('Siren error:', e); }
        };

        const startSirenAlarm = () => {
            if (alarmInterval) clearInterval(alarmInterval);
            setAlarmPlaying(true);
            playSiren();
            alarmInterval = setInterval(playSiren, 3000);
        };

        const stopAlarm = () => {
            if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
            setAlarmPlaying(false);
        };

        const handleResolve = async (id, pelapor) => {
            const res = await callAPI('update', { sheetName: 'Panic', id: id, data: { Status: 'SELESAI' } });
            if (res.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Darurat Tertangani', text: `Status darurat dari ${pelapor} telah ditandai selesai.`, timer: 2000 });
                loadActivePanics();
                if (onResolve) onResolve();
            }
        };

        useEffect(() => {
            loadActivePanics();
            const interval = setInterval(loadActivePanics, 10000);
            return () => { clearInterval(interval); stopAlarm(); if (audioContext) audioContext.close(); };
        }, []);

        if (activePanics.length === 0) return null;

        const getJenisLabel = (jenis) => {
            const options = { 'kebakaran': '🔥 Kebakaran', 'kriminal': '🔫 Kejahatan', 'kecelakaan': '🚑 Kecelakaan', 'bencana': '🌊 Bencana Alam', 'keamanan': '👮 Gangguan Keamanan', 'lainnya': '📢 Lainnya' };
            return options[jenis] || jenis || 'Tidak diketahui';
        };

        return (
            <div className="fixed top-0 left-0 right-0 z-[100] max-w-[480px] mx-auto">
                {activePanics.map((panic, idx) => (
                    <div key={idx} className="bg-red-600 text-white p-4 m-2 rounded-xl shadow-lg animate-pulse">
                        <div className="flex items-center gap-3 mb-3"><i className="fas fa-bell text-2xl animate-bounce"></i><div><h3 className="font-bold text-base">🚨 DARURAT AKTIF! 🚨</h3><p className="text-xs opacity-90">Dari: {panic.Pelapor}</p></div></div>
                        <div className="bg-red-700 bg-opacity-50 rounded-lg p-2 mb-3 text-xs space-y-1">
                            <p><strong>📋 Jenis:</strong> {getJenisLabel(panic.JenisDarurat)}</p>
                            <p><strong>📍 Lokasi:</strong> {panic.Lokasi}</p>
                            {panic.DetailKejadian && <p><strong>📝 Detail:</strong> {panic.DetailKejadian}</p>}
                            <p><strong>⏰ Waktu:</strong> {panic.Waktu}</p>
                            {panic.NoHP && <p><strong>📞 Kontak:</strong> {panic.NoHP}</p>}
                        </div>
                        <button onClick={() => handleResolve(panic.id, panic.Pelapor)} className="w-full bg-white text-red-600 font-bold py-2.5 rounded-lg text-sm mt-2"><i className="fas fa-check-circle mr-1"></i> Tandai Selesai & Matikan Alarm</button>
                    </div>
                ))}
            </div>
        );
    };

    // ==========================================
    // DASHBOARD VIEW
    // ==========================================
    const DashboardView = ({ user, setCurrentView }) => {
        const isAdmin = user && user.role === 'Pengurus';
        const [latestInfo, setLatestInfo] = useState(null);
        const [infoLoading, setInfoLoading] = useState(true);

        const getGreeting = () => {
            const hours = new Date().getHours();
            if (hours >= 3 && hours < 10) return { text: 'Selamat Pagi', icon: 'fa-sun', color: 'text-yellow-300' };
            if (hours >= 10 && hours < 15) return { text: 'Selamat Siang', icon: 'fa-cloud-sun', color: 'text-yellow-300' };
            if (hours >= 15 && hours < 18) return { text: 'Selamat Sore', icon: 'fa-cloud', color: 'text-orange-300' };
            return { text: 'Selamat Malam', icon: 'fa-moon', color: 'text-blue-200' };
        };

        useEffect(() => {
            const fetchInfo = async () => {
                const res = await callAPI('read', { sheetName: 'Pengumuman' });
                if (res.status === 'success' && res.data.length > 0) setLatestInfo(res.data[res.data.length - 1]);
                setInfoLoading(false);
            };
            fetchInfo();
        }, []);

        const allMenus = [
            { id: 'warga', icon: 'fa-users', title: 'Data Warga', color: 'bg-green-500', adminOnly: true },
            { id: 'kontrakan', icon: 'fa-house-user', title: 'Kontrakan', color: 'bg-cyan-500', adminOnly: true },
            { id: 'pengumuman', icon: 'fa-newspaper', title: 'Info RT', color: 'bg-indigo-500' },
            { id: 'yatim', icon: 'fa-child', title: 'Data Yatim', color: 'bg-teal-500' },
            { id: 'bansos', icon: 'fa-hand-holding-heart', title: 'Bansos', color: 'bg-red-500' },
            { id: 'tamu', icon: 'fa-id-badge', title: 'Buku Tamu', color: 'bg-purple-500' },
            { id: 'inventaris', icon: 'fa-boxes', title: 'Inventaris', color: 'bg-blue-500' },
            { id: 'laporankeuangan', icon: 'fa-chart-line', title: 'Lap. Keuangan', color: 'bg-cyan-600' },
            { id: 'keuangan', icon: 'fa-wallet', title: 'Kelola Kas', color: 'bg-yellow-500', adminOnly: true },
            { id: 'umkm', icon: 'fa-store', title: 'UMKM', color: 'bg-pink-500' },
            { id: 'lapor', icon: 'fa-bullhorn', title: 'Laporan', color: 'bg-orange-500' },
            { id: 'cctv', icon: 'fa-video', title: 'CCTV', color: 'bg-blue-500' },
            { id: 'surat', icon: 'fa-envelope', title: 'Administrasi Surat', color: 'bg-indigo-500', adminOnly: true },
            { id: 'users', icon: 'fa-user-shield', title: 'Manajemen Akun', color: 'bg-slate-700', adminOnly: true },
            { id: 'pengaturan', icon: 'fa-cog', title: 'Setting', color: 'bg-gray-500' }
        ];
        const menus = isAdmin ? allMenus : allMenus.filter(m => !m.adminOnly);
        const greeting = getGreeting();

        return (
            <div className="p-4 space-y-6">
                {isAdmin && <DaruratAlert />}
                <div className="bg-gradient-to-r from-blue-500 to-blue-700 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                    <i className="fas fa-building absolute -right-4 -bottom-4 text-7xl opacity-20"></i>
                    <div className="flex items-center gap-2 mb-3"><i className={`fas ${greeting.icon} text-2xl ${greeting.color} animate-pulse`}></i><h2 className="text-lg font-medium">{greeting.text}</h2></div>
                    <h1 className="text-3xl font-bold mt-1">{user.nama || user.username}</h1>
                    <div className="mt-3 inline-block bg-white/20 backdrop-blur-sm rounded-full px-3 py-1"><p className="text-xs font-semibold tracking-wide"><i className="fas fa-shield-alt mr-1"></i> {user.role || 'Warga'}</p></div>
                    <div className="mt-3 text-xs opacity-80"><i className="fas fa-clock mr-1"></i>{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                </div>
                <div><h3 className="font-bold text-gray-800 mb-4 ml-1 text-lg">Menu Utama</h3>
                   
<div className="grid grid-cols-4 gap-2 sm:gap-3">
    {menus.map(menu => (
        <button 
            key={menu.id} 
            onClick={() => setCurrentView(menu.id)}
            className="flex flex-col items-center bg-white p-2 sm:p-3 rounded-xl shadow-sm border border-gray-100 hover:shadow-md active:scale-95 transition-all"
        >
            <div className={`${menu.color} text-white w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center mb-1 shadow-md`}>
                <i className={`fas ${menu.icon} text-sm sm:text-lg`}></i>
            </div>
            <span className="text-[9px] sm:text-[10px] font-bold text-gray-700 text-center leading-tight break-words max-w-full px-1">
                {menu.title}
            </span>
        </button>
    ))}
</div>
                </div>
                <div className="mt-2">
                    <h3 className="font-bold text-gray-800 mb-3 ml-1 text-lg">Sorotan Info</h3>
                    {infoLoading ? <div className="bg-gray-100 rounded-2xl p-5 flex justify-center text-gray-400"><i className="fas fa-circle-notch fa-spin"></i></div> : latestInfo ? (
                        <div className="bg-gradient-to-br from-orange-400 to-red-500 rounded-2xl p-5 text-white shadow-md relative overflow-hidden flex flex-col justify-between">
                            <div className="absolute right-[-15px] bottom-[-10px] opacity-20 transform rotate-[-15deg]"><i className="fas fa-bullhorn text-8xl"></i></div>
                            <div className="relative z-10">
                                <div className="flex justify-between items-center mb-3"><span className="bg-white/30 backdrop-blur-sm text-[10px] font-bold px-2.5 py-1 rounded-md shadow-sm">{latestInfo.Kategori?.toUpperCase() || 'INFO'}</span><span className="text-[10px] font-medium opacity-90">{latestInfo.Tanggal}</span></div>
                                <h4 className="font-bold text-base mb-1.5 leading-tight">{latestInfo.Judul}</h4>
                                <p className="text-xs opacity-90 line-clamp-2 leading-relaxed mb-4">{latestInfo.Isi}</p>
                                <button onClick={() => setCurrentView('pengumuman')} className="text-[10px] font-bold bg-white text-red-600 px-4 py-2 rounded-full shadow hover:bg-gray-50 transition active:scale-95">Lihat Semua Info <i className="fas fa-arrow-right ml-1"></i></button>
                            </div>
                        </div>
                    ) : <div className="bg-white border rounded-2xl p-5 text-center text-gray-500 text-xs shadow-sm">Belum ada pengumuman / info terbaru saat ini.</div>}
                </div>
            </div>
        );
    };

    // ==========================================
    // GENERIC CRUD VIEW (DENGAN PERBAIKAN FOTO)
    // ==========================================
    const getInputConfig = (colName) => {
        const name = colName.toLowerCase(); 
        let type = 'text'; 
        let icon = 'fa-pen';
        if (name.includes('tanggal')) { type = 'date'; icon = 'fa-calendar-alt'; }
        else if (name.includes('foto') || name.includes('photo') || name.includes('bukti')) { type = 'file'; icon = 'fa-camera'; }
        else if (name.includes('nohp') || name.includes('telepon')) { type = 'number'; icon = 'fa-phone'; }
        else if (name.includes('nama') || name.includes('warga')) { icon = 'fa-user'; }
        else if (name.includes('alamat')) { icon = 'fa-map-marker-alt'; }
        else if (name.includes('hubungan')) { icon = 'fa-handshake'; }
        else if (name.includes('tujuan')) { icon = 'fa-bullseye'; }
        return { type, icon };
    };

    const GenericCrudView = ({ sheetName, title, columns, user, wargaCanAdd = false, wargaCanDelete = false, limit = null }) => {
        const [data, setData] = useState([]);
        const [allData, setAllData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [isDetailOpen, setIsDetailOpen] = useState(false);
        const [formData, setFormData] = useState({});
        const [detailData, setDetailData] = useState(null);
        const [editId, setEditId] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');

        const isAdmin = user && user.role === 'Pengurus';
        const canAdd = isAdmin || wargaCanAdd;
        const canDelete = isAdmin || wargaCanDelete;
        const fotoColumns = columns.filter(c => c.toLowerCase().includes('foto'));
        const textColumns = columns.filter(c => !fotoColumns.includes(c));
        const titleCol = textColumns[0] || columns[0];
        const subCols = textColumns.slice(1, 4);

        const getPhotoUrl = (row) => {
            for (let col of fotoColumns) {
                const url = row[col];
                if (url && typeof url === 'string' && (url.startsWith('http://') || url.startsWith('https://'))) {
                    if (url.includes('drive.google.com')) {
                        const match = url.match(/(?:\/d\/|id=)([-\w]{25,})/);
                        if (match && match[1]) return `https://drive.google.com/thumbnail?sz=w800&id=${match[1]}`;
                    }
                    return url;
                }
            }
            return null;
        };

        useEffect(() => { loadData(); }, [sheetName]);
        const loadData = async () => { 
            setLoading(true); 
            const res = await callAPI('read', { sheetName }); 
            if(res.status === 'success') {
                const sortedAllData = res.data.sort((a, b) => b.id.localeCompare(a.id));
                setAllData(sortedAllData);
                if (limit && limit > 0) setData(sortedAllData.slice(0, limit));
                else setData(sortedAllData);
            }
            setLoading(false); 
        };

        const handleSearch = (term) => {
            setSearchTerm(term);
            if (!term.trim()) { setData(limit ? allData.slice(0, limit) : allData); return; }
            const searchLower = term.toLowerCase();
            const filtered = allData.filter(row => Object.values(row).some(val => val && String(val).toLowerCase().includes(searchLower)));
            setData(filtered);
        };

        const handleOpenForm = (row = null) => { 
            if (row && row.id) { setFormData({...row}); setEditId(row.id); }
            else { let initialData = {}; columns.forEach(col => initialData[col] = ''); setFormData(initialData); setEditId(null); }
            setIsFormOpen(true); 
        };
        const handleDetail = (row) => { setDetailData(row); setIsDetailOpen(true); };
        const handleSubmit = async (e) => { e.preventDefault(); setSubmitting(true); let res; if (editId) res = await callAPI('update', { sheetName, id: editId, data: formData }); else res = await callAPI('create', { sheetName, data: formData }); setSubmitting(false); if(res.status === 'success') { setIsFormOpen(false); setEditId(null); Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false }); loadData(); } else { Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); } };
        const handleDelete = (id) => { Swal.fire({ title: 'Hapus Data?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya' }).then(async (result) => { if (result.isConfirmed) { Swal.fire({title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); await callAPI('delete', { sheetName, id: id }); loadData(); Swal.close(); } }); };

        return (
            <div className="p-4 pb-10">
                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-gray-800">{title}</h2>{canAdd && <button onClick={() => handleOpenForm()} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md"><i className="fas fa-plus mr-1"></i> Baru</button>}</div>
                {limit && limit > 0 && !searchTerm && <div className="mb-3 px-3 py-2 bg-blue-50 rounded-lg text-xs text-blue-600"><i className="fas fa-info-circle mr-1"></i> Menampilkan {data.length} data terbaru. Gunakan pencarian untuk melihat semua data.</div>}
                <SearchBar searchTerm={searchTerm} setSearchTerm={setSearchTerm} placeholder={`Cari di ${title}...`} />
                {loading ? <Loader /> : (
                    <div className="space-y-4 mt-2">
                        {data.length === 0 ? <div className="text-center py-8 text-gray-400 bg-white rounded-2xl shadow-sm border border-gray-100">Data Kosong</div> : data.map((row, idx) => {
                            const photoUrl = getPhotoUrl(row);
                            return (
                                <div key={row.id || idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                                    <div className="flex gap-4 items-start">
                                        {fotoColumns.length > 0 && <div className="w-16 h-16 rounded-xl overflow-hidden shrink-0 bg-gray-100 border border-gray-200 flex items-center justify-center">{photoUrl ? <img src={photoUrl} className="w-full h-full object-cover" alt="Foto" /> : <i className="fas fa-user text-2xl text-gray-400"></i>}</div>}
                                        <div className="flex-1 min-w-0">
                                            <h3 className="font-bold text-base text-gray-800 truncate mb-1">{row[titleCol] || '-'}</h3>
                                            {subCols.map(c => { let value = row[c]; if (c === 'NoKTP' && value && value.length > 8) value = value.substring(0, 4) + '****' + value.substring(value.length - 4); return value ? <p key={c} className="text-xs text-gray-500 truncate mb-0.5"><span className="font-semibold">{c}:</span> {value}</p> : null; })}
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 border-t border-gray-50 pt-3 mt-3">
                                        <button onClick={() => handleDetail(row)} className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg font-bold transition"><i className="fas fa-eye"></i> Detail</button>
                                        {canAdd && <button onClick={() => handleOpenForm(row)} className="text-xs bg-yellow-50 hover:bg-yellow-100 text-yellow-600 px-3 py-1.5 rounded-lg font-bold transition"><i className="fas fa-edit"></i> Edit</button>}
                                        {canDelete && <button onClick={() => handleDelete(row.id)} className="text-xs bg-red-50 hover:bg-red-100 text-red-500 px-3 py-1.5 rounded-lg font-bold transition"><i className="fas fa-trash"></i> Hapus</button>}
                                    </div>
                                </div>
                            );
                        })}
                        {searchTerm && allData.length > 0 && <div className="text-center text-xs text-gray-400 py-2">Menampilkan {data.length} dari {allData.length} data <button onClick={() => handleSearch('')} className="ml-2 text-blue-500 hover:underline">Reset</button></div>}
                    </div>
                )}
                <BottomSheet isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title={`Detail ${title}`}>
                    {detailData && (
                        <div className="space-y-4">
                            {fotoColumns.map(col => { const fotoUrl = getPhotoUrl(detailData); if (fotoUrl) return <div key={col} className="w-full bg-gray-100 rounded-xl overflow-hidden"><img src={fotoUrl} className="w-full h-64 object-contain bg-white" alt={col} /></div>; return null; })}
                            <div className="space-y-3">
                                {Object.entries(detailData).filter(([k]) => k !== 'id' && !fotoColumns.includes(k) && k !== 'source' && k !== 'isIncome' && k !== 'PasswordHash').map(([k, v]) => (
                                    <div key={k} className="bg-gray-50 p-3 rounded-lg border border-gray-100">
                                        <p className="text-[10px] text-gray-400 font-bold uppercase mb-1 tracking-wider">{k}</p>
                                        <p className="text-sm text-gray-800 font-medium whitespace-pre-wrap">{k === 'NoKTP' && v && v.length > 8 ? v.substring(0, 4) + '****' + v.substring(v.length - 4) : (v || '-')}</p>
                                    </div>
                                ))}
                            </div>
                            {canAdd && <button onClick={() => { setIsDetailOpen(false); handleOpenForm(detailData); }} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl mt-4 flex justify-center items-center gap-2 shadow-md"><i className="fas fa-edit"></i> Edit Data Ini</button>}
                        </div>
                    )}
                </BottomSheet>
                {canAdd && (
                    <BottomSheet isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={`${editId ? 'Edit' : 'Tambah'} ${title}`}>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {columns.map(col => {
                                const { type, icon } = getInputConfig(col);
                                const isFoto = col.toLowerCase().includes('foto');
                                const isNoKTP = col === 'NoKTP';
                                return (
                                    <div key={col}>
                                        <label className="block text-xs font-bold text-gray-700 mb-1.5 ml-1 uppercase">{col} {isNoKTP && <span className="text-red-500">*</span>}</label>
                                        <div className="relative">
                                            {type === 'file' || isFoto ? (
                                                <div className="flex flex-col gap-3 p-4 border-2 border-dashed rounded-xl bg-gray-50 items-center justify-center">
                                                    {formData[col] && (<div className="relative w-28 h-28 rounded-xl overflow-hidden border-2 border-white shadow-md"><img src={formData[col]} className="w-full h-full object-cover" alt="Preview" /><button type="button" onClick={() => setFormData({...formData, [col]: ''})} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-xs"><i className="fas fa-times"></i></button></div>)}
                                                    <label className="cursor-pointer bg-white hover:bg-gray-100 text-gray-600 font-medium py-2 px-4 rounded-lg border shadow-sm text-sm transition"><i className="fas fa-upload mr-2"></i> {formData[col] ? 'Ganti Foto' : 'Pilih Foto'}<input type="file" accept="image/*" className="hidden" onChange={e => { const file = e.target.files[0]; if(file) { const reader = new FileReader(); reader.onloadend = () => setFormData({...formData, [col]: reader.result}); reader.readAsDataURL(file); } }} /></label>
                                                    <p className="text-[10px] text-gray-400">Format: JPG, PNG. Maks 2MB</p>
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className={`fas ${icon} text-gray-400`}></i></div>
                                                    <input type={type} className={`w-full pl-10 pr-3 py-3 border rounded-xl text-sm ${isNoKTP ? 'bg-blue-50' : ''}`} placeholder={`Masukkan ${col}...`} value={formData[col] || ''} onChange={e => setFormData({...formData, [col]: e.target.value})} required={isNoKTP} />
                                                    {isNoKTP && <p className="text-[10px] text-blue-500 mt-1"><i className="fas fa-info-circle mr-1"></i> No KTP (16 digit) akan menjadi Username login</p>}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            <button type="submit" disabled={submitting} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl mt-2 transition shadow-md">{submitting ? 'Menyimpan...' : 'Simpan Data'}</button>
                        </form>
                    </BottomSheet>
                )}
            </div>
        );
    };

    // ==========================================
    // KEUANGAN VIEW
    // ==========================================
    const KeuanganView = ({ user }) => {
        const [activeTab, setActiveTab] = useState('kas');
        const [transaksi, setTransaksi] = useState([]);
        const [allTransaksi, setAllTransaksi] = useState([]);
        const [iuran, setIuran] = useState([]);
        const [wargaList, setWargaList] = useState([]);
        const [loading, setLoading] = useState(true);
        const [showModal, setShowModal] = useState(false);
        const [modalType, setModalType] = useState('kas');
        const [submitting, setSubmitting] = useState(false);
        const [filterTanggal, setFilterTanggal] = useState('');
        const [filterBulan, setFilterBulan] = useState('');
        const [filterTahun, setFilterTahun] = useState(new Date().getFullYear());
        const isAdmin = user && user.role === 'Pengurus';

        const [formKas, setFormKas] = useState({ Jenis: 'Masuk', Kategori: 'Sumbangan', Keterangan: '', Nominal: '' });
        const [formIuran, setFormIuran] = useState({ noKTP: '', NamaWarga: '', Bulan: new Date().toLocaleString('id-ID', { month: 'long' }), Tahun: new Date().getFullYear(), Nominal: '', Bukti: '', Status: 'LUNAS' });
        const [showWargaDropdown, setShowWargaDropdown] = useState(false);
        const [filteredWarga, setFilteredWarga] = useState([]);

        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const years = [2023, 2024, 2025, 2026];
        const kategoriPemasukan = ['Sumbangan', 'Hibah', 'Donasi', 'Bantuan Sosial', 'Lainnya'];
        const kategoriPengeluaran = ['Keperluan RT', 'Sosial / Santunan', 'Pembangunan / Fisik', 'ATK & Administrasi', 'Kebersihan', 'Keamanan', 'Lainnya'];

        const loadData = async () => {
            setLoading(true);
            const [resKeu, resIur, resWarga] = await Promise.all([
                callAPI('read', { sheetName: 'Keuangan' }),
                callAPI('read', { sheetName: 'Iuran' }),
                callAPI('read', { sheetName: 'Warga' })
            ]);
            if (resKeu.status === 'success') {
                const sorted = resKeu.data.sort((a, b) => b.id.localeCompare(a.id));
                setAllTransaksi(sorted);
                setTransaksi(sorted.slice(0, 5));
            }
            if (resIur.status === 'success') setIuran(resIur.data);
            if (resWarga.status === 'success') setWargaList(resWarga.data);
            setLoading(false);
        };

        useEffect(() => { loadData(); }, []);

        const applyFilter = () => {
            let filtered = [...allTransaksi];
            if (filterTanggal) filtered = filtered.filter(t => t.Tanggal === filterTanggal);
            if (filterBulan && filterTahun) {
                filtered = filtered.filter(t => {
                    const [day, month, year] = t.Tanggal.split('/');
                    const bulanNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                    const monthNum = bulanNames.indexOf(month) + 1;
                    return monthNum === parseInt(filterBulan) && parseInt(year) === filterTahun;
                });
            }
            setTransaksi(filtered.slice(0, 5));
        };

        const resetFilter = () => {
            setFilterTanggal('');
            setFilterBulan('');
            setFilterTahun(new Date().getFullYear());
            setTransaksi(allTransaksi.slice(0, 5));
        };

        const handleNoKTPChange = (value) => {
            setFormIuran({ ...formIuran, noKTP: value, NamaWarga: '' });
            if (value.length >= 4) {
                const filtered = wargaList.filter(w => w.NoKTP && w.NoKTP.toLowerCase().includes(value.toLowerCase()));
                setFilteredWarga(filtered);
                setShowWargaDropdown(true);
                if (value.length === 16) {
                    const warga = wargaList.find(w => w.NoKTP === value);
                    if (warga) { setFormIuran(prev => ({ ...prev, noKTP: warga.NoKTP, NamaWarga: warga.Nama })); setShowWargaDropdown(false); }
                }
            } else { setFilteredWarga([]); setShowWargaDropdown(false); }
        };

        const selectWarga = (warga) => { setFormIuran({ ...formIuran, noKTP: warga.NoKTP, NamaWarga: warga.Nama }); setShowWargaDropdown(false); };

        const totalMasuk = allTransaksi.filter(t => t.Tipe === 'Pemasukan').reduce((sum, t) => sum + Number(t.Nominal || 0), 0);
        const totalKeluar = allTransaksi.filter(t => t.Tipe === 'Pengeluaran').reduce((sum, t) => sum + Number(t.Nominal || 0), 0);
        const saldoAkhir = totalMasuk - totalKeluar;
        const totalIuran = iuran.filter(i => i.Status === 'LUNAS').reduce((sum, i) => sum + Number(i.Nominal || 0), 0);
        const iuranPending = iuran.filter(i => i.Status === 'PENDING');

        const handleSubmitKas = async (e) => {
            e.preventDefault();
            if (!formKas.Nominal) { Swal.fire('Error', 'Nominal wajib diisi!', 'error'); return; }
            setSubmitting(true);
            const dataBaru = { Tanggal: new Date().toLocaleDateString('id-ID'), Tipe: formKas.Jenis === 'Masuk' ? 'Pemasukan' : 'Pengeluaran', Nominal: Number(formKas.Nominal), Keterangan: `${formKas.Kategori} - ${formKas.Keterangan || '-'}`, Operator: user.nama || user.username };
            const res = await callAPI('create', { sheetName: 'Keuangan', data: dataBaru });
            setSubmitting(false);
            if (res.status === 'success') { Swal.fire('Berhasil', 'Transaksi keuangan berhasil dicatat', 'success'); setShowModal(false); setFormKas({ Jenis: 'Masuk', Kategori: 'Sumbangan', Keterangan: '', Nominal: '' }); loadData(); }
            else { Swal.fire('Gagal', res.message, 'error'); }
        };

        const handleSubmitIuran = async (e) => {
            e.preventDefault();
            if (!formIuran.noKTP || formIuran.noKTP.length !== 16) { Swal.fire('Error', 'No KTP harus 16 digit!', 'error'); return; }
            if (!formIuran.NamaWarga) { Swal.fire('Error', 'Data warga tidak ditemukan!', 'error'); return; }
            if (!formIuran.Nominal) { Swal.fire('Error', 'Nominal iuran wajib diisi!', 'error'); return; }
            setSubmitting(true);
            const iuranData = { NamaWarga: formIuran.NamaWarga, Bulan: formIuran.Bulan, Tahun: formIuran.Tahun, Nominal: Number(formIuran.Nominal), Status: formIuran.Status, Bukti: formIuran.Bukti || '' };
            const resIuran = await callAPI('create', { sheetName: 'Iuran', data: iuranData });
            if (resIuran.status === 'success') {
                const keuanganData = { Tanggal: new Date().toLocaleDateString('id-ID'), Tipe: 'Pemasukan', Nominal: Number(formIuran.Nominal), Keterangan: `Iuran Warga - ${formIuran.NamaWarga} (${formIuran.Bulan} ${formIuran.Tahun})`, Operator: user.nama || user.username };
                await callAPI('create', { sheetName: 'Keuangan', data: keuanganData });
                await callAPI('create', { sheetName: 'Notifikasi', data: { Judul: '✅ Pembayaran Iuran Diterima', Pesan: `Pembayaran iuran bulan ${formIuran.Bulan} ${formIuran.Tahun} sebesar ${formatRp(formIuran.Nominal)} telah diterima. Terima kasih.`, Kategori: 'KEUANGAN', Tanggal: new Date().toLocaleString(), Target: formIuran.noKTP, Pelapor: user.username } });
                Swal.fire('Berhasil', `Pembayaran iuran atas nama ${formIuran.NamaWarga} telah dicatat`, 'success');
                setShowModal(false);
                setFormIuran({ noKTP: '', NamaWarga: '', Bulan: new Date().toLocaleString('id-ID', { month: 'long' }), Tahun: new Date().getFullYear(), Nominal: '', Bukti: '', Status: 'LUNAS' });
                loadData();
            } else { Swal.fire('Gagal', resIuran.message, 'error'); }
            setSubmitting(false);
        };

        const openModal = (type) => { setModalType(type); setShowModal(true); };

        return (
            <div className="p-4 pb-10">
                <div className="grid grid-cols-3 gap-2 mb-4">
                    <div className="bg-green-50 border border-green-200 p-3 rounded-xl text-green-800"><div className="text-[10px] font-medium">Total Kas Masuk</div><div className="text-sm font-bold">{formatRp(totalMasuk)}</div></div>
                    <div className="bg-red-50 border border-red-200 p-3 rounded-xl text-red-800"><div className="text-[10px] font-medium">Total Kas Keluar</div><div className="text-sm font-bold">{formatRp(totalKeluar)}</div></div>
                    <div className="bg-blue-600 p-3 rounded-xl text-white"><div className="text-[10px] font-medium">Saldo Kas Saat Ini</div><div className="text-sm font-bold">{formatRp(saldoAkhir)}</div></div>
                </div>

                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 mb-4 flex justify-between items-center">
                    <div><div className="text-[10px] font-medium text-emerald-700">Total Iuran Terkumpul</div><div className="text-lg font-bold text-emerald-800">{formatRp(totalIuran)}</div></div>
                    {iuranPending.length > 0 && <div className="bg-yellow-100 px-2 py-1 rounded-lg"><span className="text-[10px] font-bold text-yellow-700">{iuranPending.length} Pending</span></div>}
                </div>

                <div className="flex gap-2 mb-4">
                    <button onClick={() => openModal('kas')} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700 transition"><i className="fas fa-money-bill-wave mr-1"></i> Catat Kas</button>
                    <button onClick={() => openModal('iuran')} className="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-emerald-700 transition"><i className="fas fa-users mr-1"></i> Bayar Iuran</button>
                </div>

                <div className="flex gap-2 mb-4 border-b">
                    <button onClick={() => setActiveTab('kas')} className={`px-4 py-2 font-bold text-sm transition ${activeTab === 'kas' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-400'}`}><i className="fas fa-money-bill-wave mr-1"></i> Kas RT</button>
                    <button onClick={() => setActiveTab('iuran')} className={`px-4 py-2 font-bold text-sm transition ${activeTab === 'iuran' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-400'}`}><i className="fas fa-users mr-1"></i> Iuran Warga</button>
                </div>

                {activeTab === 'kas' && (
                    <div className="bg-white rounded-2xl shadow-sm border p-4">
                        <div className="flex justify-between items-center mb-3 flex-wrap gap-2"><h3 className="font-bold text-gray-700 text-sm">Riwayat Kas RT</h3><div className="text-[10px] text-gray-400"><i className="fas fa-info-circle mr-1"></i> Menampilkan 5 transaksi terakhir</div></div>
                        <div className="mb-4 p-3 bg-gray-50 rounded-lg">
                            <p className="text-xs font-bold text-gray-600 mb-2">Filter Transaksi</p>
                            <div className="flex flex-wrap gap-2">
                                <input type="date" className="border rounded-lg px-3 py-1.5 text-xs flex-1" value={filterTanggal} onChange={(e) => { setFilterTanggal(e.target.value); setFilterBulan(''); }} />
                                <select className="border rounded-lg px-3 py-1.5 text-xs" value={filterBulan} onChange={(e) => setFilterBulan(e.target.value)}><option value="">Pilih Bulan</option>{months.map((m, idx) => <option key={idx} value={idx + 1}>{m}</option>)}</select>
                                <select className="border rounded-lg px-3 py-1.5 text-xs" value={filterTahun} onChange={(e) => setFilterTahun(parseInt(e.target.value))}>{years.map(y => <option key={y} value={y}>{y}</option>)}</select>
                                <button onClick={applyFilter} className="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i className="fas fa-search mr-1"></i> Filter</button>
                                <button onClick={resetFilter} className="bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold"><i className="fas fa-undo mr-1"></i> Reset</button>
                            </div>
                        </div>
                        {loading ? <Loader /> : transaksi.length === 0 ? <div className="text-center py-8 text-gray-400 text-xs">Belum ada transaksi kas</div> : <div className="space-y-2">{transaksi.map((t, idx) => (<div key={idx} className="flex justify-between items-center p-2.5 border-b hover:bg-gray-50 rounded-lg transition"><div><div className="text-xs font-bold">{t.Keterangan}</div><div className="text-[10px] text-gray-400">{t.Tanggal}</div><div className="text-[9px] text-gray-400 italic">Oleh: {t.Operator || 'Admin'}</div></div><div className={`text-xs font-bold ${t.Tipe === 'Pemasukan' ? 'text-green-600' : 'text-red-500'}`}>{t.Tipe === 'Pemasukan' ? '+' : '-'} {formatRp(t.Nominal)}</div></div>))}</div>}
                        {allTransaksi.length > 5 && !filterTanggal && !filterBulan && <div className="text-center text-[10px] text-gray-400 mt-3 pt-2 border-t">Menampilkan 5 dari {allTransaksi.length} transaksi</div>}
                    </div>
                )}

                {activeTab === 'iuran' && (
                    <div className="bg-white rounded-2xl shadow-sm border p-4">
                        <h3 className="font-bold text-gray-700 text-sm mb-3 border-b pb-2">Riwayat Pembayaran Iuran</h3>
                        {loading ? <Loader /> : iuran.length === 0 ? <div className="text-center py-8 text-gray-400 text-xs">Belum ada data iuran</div> : <div className="space-y-2 max-h-[380px] overflow-y-auto">{[...iuran].reverse().map((i, idx) => (<div key={idx} className="flex justify-between items-center p-2.5 border-b"><div><div className="text-xs font-bold">{i.NamaWarga}</div><div className="text-[10px] text-gray-400">{i.Bulan} {i.Tahun}</div></div><div className="text-right"><div className={`text-xs font-bold ${i.Status === 'LUNAS' ? 'text-green-600' : 'text-yellow-600'}`}>{formatRp(i.Nominal)}</div><div className="text-[9px] text-gray-400">{i.Status}</div></div></div>))}</div>}
                    </div>
                )}

                {showModal && modalType === 'kas' && (
                    <div className="fixed inset-0 bg-black bg-opacity-50 z-[200] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl p-5 w-full max-w-[400px] max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg text-blue-600"><i className="fas fa-money-bill-wave mr-2"></i> Catat Transaksi Kas</h3><button onClick={() => setShowModal(false)} className="text-gray-400"><i className="fas fa-times text-xl"></i></button></div>
                            <form onSubmit={handleSubmitKas} className="space-y-4">
                                <div><label className="block text-xs font-semibold text-gray-500 mb-1">Jenis Transaksi</label><select className="w-full border rounded-lg p-2 text-sm" value={formKas.Jenis} onChange={e => setFormKas({...formKas, Jenis: e.target.value})}><option value="Masuk">Pemasukan (+)</option><option value="Keluar">Pengeluaran (-)</option></select></div>
                                <div><label className="block text-xs font-semibold text-gray-500 mb-1">Kategori</label>{formKas.Jenis === 'Masuk' ? <select className="w-full border rounded-lg p-2 text-sm" value={formKas.Kategori} onChange={e => setFormKas({...formKas, Kategori: e.target.value})}>{kategoriPemasukan.map(k => <option key={k} value={k}>{k}</option>)}</select> : <select className="w-full border rounded-lg p-2 text-sm" value={formKas.Kategori} onChange={e => setFormKas({...formKas, Kategori: e.target.value})}>{kategoriPengeluaran.map(k => <option key={k} value={k}>{k}</option>)}</select>}</div>
                                <div><label className="block text-xs font-semibold text-gray-500 mb-1">Nominal (Rp)</label><input type="number" placeholder="0" className="w-full border rounded-lg p-2 text-sm font-bold" value={formKas.Nominal} onChange={e => setFormKas({...formKas, Nominal: e.target.value})} required /></div>
                                <div><label className="block text-xs font-semibold text-gray-500 mb-1">Keterangan</label><textarea className="w-full border rounded-lg p-2 text-sm h-20" placeholder="Contoh: Pembelian ATK, Perbaikan lampu, dll" value={formKas.Keterangan} onChange={e => setFormKas({...formKas, Keterangan: e.target.value})} /></div>
                                <div className="bg-yellow-50 p-2 rounded-lg"><p className="text-[10px] text-yellow-700"><i className="fas fa-info-circle mr-1"></i> Untuk Iuran Warga, silakan gunakan tombol "Bayar Iuran" terpisah</p></div>
                                <button type="submit" disabled={submitting} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">{submitting ? <i className="fas fa-spinner fa-spin"></i> : 'Simpan Transaksi'}</button>
                            </form>
                        </div>
                    </div>
                )}

                {showModal && modalType === 'iuran' && (
                    <div className="fixed inset-0 bg-black bg-opacity-50 z-[200] flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl p-5 w-full max-w-[400px] max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg text-emerald-600"><i className="fas fa-users mr-2"></i> Pembayaran Iuran</h3><button onClick={() => setShowModal(false)} className="text-gray-400"><i className="fas fa-times text-xl"></i></button></div>
                            <form onSubmit={handleSubmitIuran} className="space-y-4">
                                <div className="relative"><label className="block text-xs font-semibold text-gray-500 mb-1"><i className="fas fa-id-card mr-1 text-emerald-600"></i> No KTP <span className="text-red-500">*</span></label><div className="relative"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-qrcode text-gray-400"></i></div><input type="text" className="w-full pl-10 pr-3 py-2.5 border rounded-xl text-sm" placeholder="Masukkan 16 digit No KTP" value={formIuran.noKTP} onChange={e => handleNoKTPChange(e.target.value)} maxLength="16" required /></div>{showWargaDropdown && filteredWarga.length > 0 && (<div className="absolute z-10 w-full mt-1 bg-white border rounded-xl shadow-lg max-h-48 overflow-y-auto">{filteredWarga.map((w, idx) => (<div key={idx} className="px-4 py-2 hover:bg-emerald-50 cursor-pointer border-b last:border-b-0" onClick={() => selectWarga(w)}><p className="text-sm font-medium">{w.Nama}</p><p className="text-[10px] text-gray-400">No KTP: {w.NoKTP}</p></div>))}</div>)}</div>
                                <div><label className="block text-xs font-semibold text-gray-500 mb-1"><i className="fas fa-user mr-1 text-emerald-600"></i> Nama Warga</label><div className="relative"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-user text-gray-400"></i></div><input type="text" className="w-full pl-10 pr-3 py-2.5 border rounded-xl text-sm bg-gray-50 font-medium" value={formIuran.NamaWarga} readOnly placeholder="Akan terisi otomatis" /></div></div>
                                <div className="grid grid-cols-2 gap-3"><div><label className="block text-xs font-semibold text-gray-500 mb-1">Bulan</label><select className="w-full border rounded-xl p-2.5 text-sm" value={formIuran.Bulan} onChange={e => setFormIuran({...formIuran, Bulan: e.target.value})} required>{months.map(m => <option key={m} value={m}>{m}</option>)}</select></div><div><label className="block text-xs font-semibold text-gray-500 mb-1">Tahun</label><select className="w-full border rounded-xl p-2.5 text-sm" value={formIuran.Tahun} onChange={e => setFormIuran({...formIuran, Tahun: e.target.value})} required>{years.map(y => <option key={y} value={y}>{y}</option>)}</select></div></div>
                                <div><label className="block text-xs font-semibold text-gray-500 mb-1"><i className="fas fa-money-bill-wave mr-1 text-emerald-600"></i> Nominal Iuran (Rp)</label><input type="number" className="w-full border rounded-xl p-2.5 text-sm font-bold" placeholder="Contoh: 50000" value={formIuran.Nominal} onChange={e => setFormIuran({...formIuran, Nominal: e.target.value})} required /></div>
                                <div><label className="block text-xs font-semibold text-gray-500 mb-1"><i className="fas fa-camera mr-1 text-emerald-600"></i> Bukti Transfer (Opsional)</label><div className="border-2 border-dashed rounded-xl p-3 text-center">{formIuran.Bukti ? (<div className="relative inline-block"><img src={formIuran.Bukti} className="w-24 h-24 object-cover rounded-lg" alt="Bukti" /><button type="button" onClick={() => setFormIuran({...formIuran, Bukti: ''})} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs"><i className="fas fa-times"></i></button></div>) : (<label className="cursor-pointer"><i className="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-1 block"></i><span className="text-xs text-gray-500">Klik untuk upload bukti</span><input type="file" accept="image/*" className="hidden" onChange={e => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onloadend = () => setFormIuran({...formIuran, Bukti: reader.result}); reader.readAsDataURL(file); } }} /></label>)}</div></div>
                                <button type="submit" disabled={submitting || !formIuran.NamaWarga} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition disabled:bg-gray-400">{submitting ? <i className="fas fa-spinner fa-spin mr-2"></i> : null}{submitting ? 'Memproses...' : 'Simpan Pembayaran Iuran'}</button>
                            </form>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // ==========================================
    // LAPORAN WARGA VIEW
    // ==========================================
    const LaporanWargaView = ({ user }) => {
        const [data, setData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [isDetailOpen, setIsDetailOpen] = useState(false);
        const [formData, setFormData] = useState({ Judul: '', Deskripsi: '', Foto: '', Status: 'Menunggu' });
        const [detailData, setDetailData] = useState(null);
        const [editId, setEditId] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [imagePreview, setImagePreview] = useState(null);
        const isAdmin = user && user.role === 'Pengurus';
        const canAdd = true;

        const getPhotoUrl = (url) => {
            if (url && typeof url === 'string') {
                if (url.startsWith('http://') || url.startsWith('https://')) {
                    if (url.includes('drive.google.com')) {
                        const match = url.match(/(?:\/d\/|id=)([-\w]{25,})/);
                        if (match && match[1]) return `https://drive.google.com/thumbnail?sz=w800&id=${match[1]}`;
                    }
                    return url;
                }
            }
            return null;
        };

        useEffect(() => { loadData(); }, []);
        const loadData = async () => { 
            setLoading(true); 
            const res = await callAPI('read', { sheetName: 'Lapor' }); 
            if(res.status === 'success') {
                let sortedData = res.data.reverse();
                if (!isAdmin) sortedData = sortedData.filter(l => l.Pelapor === (user.nama || user.username));
                setData(sortedData);
            }
            setLoading(false); 
        };

        const handleOpenForm = (row = null) => { 
            setImagePreview(null);
            if (row && row.id) {
                setFormData({ Judul: row.Judul || '', Deskripsi: row.Deskripsi || '', Foto: row.Foto || '', Status: row.Status || 'Menunggu' });
                setEditId(row.id);
                if (row.Foto && row.Foto.startsWith('http')) setImagePreview(row.Foto);
            } else {
                setFormData({ Judul: '', Deskripsi: '', Foto: '', Status: 'Menunggu' });
                setEditId(null);
            }
            setIsFormOpen(true); 
        };

        const handleDetail = (row) => { setDetailData(row); setIsDetailOpen(true); };
        
        const handleFileChange = (file) => {
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    Swal.fire({ icon: 'warning', title: 'Ukuran file terlalu besar', text: 'Maksimal ukuran file adalah 2MB!' });
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        const maxSize = 800;
                        if (width > maxSize || height > maxSize) {
                            if (width > height) {
                                height = (height * maxSize) / width;
                                width = maxSize;
                            } else {
                                width = (width * maxSize) / height;
                                height = maxSize;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        setFormData({...formData, Foto: compressedDataUrl});
                        setImagePreview(compressedDataUrl);
                        Swal.fire({ icon: 'success', title: 'Foto berhasil diupload', timer: 1500, showConfirmButton: false });
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            }
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!formData.Judul) { Swal.fire({ icon: 'error', title: 'Error', text: 'Judul laporan wajib diisi!' }); return; }
            if (!formData.Deskripsi) { Swal.fire({ icon: 'error', title: 'Error', text: 'Deskripsi laporan wajib diisi!' }); return; }
            setSubmitting(true);
            const payload = { ...formData, Pelapor: user.nama || user.username, Tanggal: editId ? formData.Tanggal : new Date().toLocaleDateString('id-ID') };
            let res;
            if (editId) {
                res = await callAPI('update', { sheetName: 'Lapor', id: editId, data: payload });
                if (res.status === 'success' && isAdmin && formData.Status !== detailData?.Status) {
                    await callAPI('create', { sheetName: 'Notifikasi', data: { Judul: `Update Status Laporan: ${formData.Judul}`, Pesan: `Laporan Anda telah diupdate menjadi "${formData.Status}" oleh admin.`, Kategori: 'LAPOR_RT', Tanggal: new Date().toLocaleString(), Target: payload.Pelapor, Pelapor: user.username } });
                }
            } else {
                res = await callAPI('create', { sheetName: 'Lapor', data: payload });
                if (res.status === 'success') {
                    await callAPI('create', { sheetName: 'Notifikasi', data: { Judul: `📢 Laporan Baru: ${formData.Judul}`, Pesan: `${payload.Pelapor} melaporkan: ${formData.Deskripsi.substring(0, 100)}...`, Kategori: 'LAPOR_RT', Tanggal: new Date().toLocaleString(), Target: 'ADMIN_ONLY', Pelapor: payload.Pelapor } });
                    await callAPI('create', { sheetName: 'Notifikasi', data: { Judul: `✅ Laporan Terkirim: ${formData.Judul}`, Pesan: `Laporan Anda telah kami terima. Status: Menunggu diproses.`, Kategori: 'LAPOR_RT', Tanggal: new Date().toLocaleString(), Target: payload.Pelapor, Pelapor: payload.Pelapor } });
                }
            }
            setSubmitting(false); setIsFormOpen(false); setImagePreview(null);
            if(res.status === 'success') { Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false }); loadData(); }
            else { Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); }
        };

        const handleDelete = (id) => {
            Swal.fire({ title: 'Hapus Laporan?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya' }).then(async (result) => {
                if (result.isConfirmed) { Swal.fire({title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); await callAPI('delete', { sheetName: 'Lapor', id: id }); loadData(); Swal.close(); }
            });
        };

        const filteredData = data.filter(row => {
            if (!searchTerm) return true;
            const searchLower = searchTerm.toLowerCase();
            return (row.Judul || '').toLowerCase().includes(searchLower) || (row.Deskripsi || '').toLowerCase().includes(searchLower) || (row.Pelapor || '').toLowerCase().includes(searchLower);
        });

        const getStatusBadge = (status) => {
            switch(status) {
                case 'Selesai': return 'bg-green-100 text-green-700 border-green-200';
                case 'Diproses': return 'bg-yellow-100 text-yellow-700 border-yellow-200';
                default: return 'bg-gray-100 text-gray-600 border-gray-200';
            }
        };

        return (
            <div className="p-4 pb-10">
                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-gray-800"><i className="fas fa-bullhorn mr-2 text-orange-500"></i> Laporan Warga</h2>{canAdd && <button onClick={() => handleOpenForm()} className="bg-orange-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md"><i className="fas fa-plus mr-1"></i> Buat Laporan</button>}</div>
                <SearchBar searchTerm={searchTerm} setSearchTerm={setSearchTerm} placeholder="Cari laporan..." />
                {loading ? <Loader /> : (
                    <div className="space-y-4 mt-2">
                        {filteredData.length === 0 ? <div className="text-center py-8 text-gray-400 bg-white rounded-2xl shadow-sm border"><i className="fas fa-file-alt text-3xl mb-2 opacity-50 block"></i>{isAdmin ? 'Belum ada laporan' : 'Anda belum membuat laporan'}</div>
                        : filteredData.map((row, idx) => {
                            const statusClass = getStatusBadge(row.Status);
                            const fotoUrl = getPhotoUrl(row.Foto);
                            return (
                                <div key={row.id || idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                                    {fotoUrl && <div className="mb-3"><img src={fotoUrl} className="w-full h-40 object-cover rounded-lg" alt="Lampiran" onError={(e) => e.target.style.display = 'none'} /></div>}
                                    <div className="flex justify-between items-start mb-2"><h3 className="font-bold text-base text-gray-800 flex-1">{row.Judul}</h3><span className={`text-[10px] px-2.5 py-1 rounded-full font-bold border ${statusClass}`}>{row.Status}</span></div>
                                    <p className="text-sm text-gray-600 mb-3 line-clamp-2">{row.Deskripsi}</p>
                                    <div className="flex justify-between items-center text-[10px] text-gray-400 border-t border-gray-50 pt-2"><span><i className="fas fa-user mr-1"></i> {row.Pelapor} • {row.Tanggal}</span><div className="flex gap-2"><button onClick={() => handleDetail(row)} className="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg font-bold transition"><i className="fas fa-eye"></i> Detail</button>{isAdmin && (<><button onClick={() => handleOpenForm(row)} className="bg-yellow-50 hover:bg-yellow-100 text-yellow-600 px-3 py-1.5 rounded-lg font-bold transition"><i className="fas fa-edit"></i> Edit</button><button onClick={() => handleDelete(row.id)} className="bg-red-50 hover:bg-red-100 text-red-500 px-3 py-1.5 rounded-lg font-bold transition"><i className="fas fa-trash"></i></button></>)}</div></div>
                                </div>
                            );
                        })}
                    </div>
                )}
                <BottomSheet isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title="Detail Laporan">
                    {detailData && (
                        <div className="space-y-4">
                            {getPhotoUrl(detailData.Foto) && <div className="w-full bg-gray-100 rounded-xl overflow-hidden"><img src={getPhotoUrl(detailData.Foto)} className="w-full h-64 object-contain bg-white" alt="Lampiran" /></div>}
                            <div className="space-y-3">
                                <div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Judul</p><p className="text-sm text-gray-800 font-medium">{detailData.Judul || '-'}</p></div>
                                <div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Deskripsi</p><p className="text-sm text-gray-800 font-medium">{detailData.Deskripsi || '-'}</p></div>
                                <div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Pelapor</p><p className="text-sm text-gray-800 font-medium">{detailData.Pelapor || '-'}</p></div>
                                <div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Tanggal</p><p className="text-sm text-gray-800 font-medium">{detailData.Tanggal || '-'}</p></div>
                                <div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Status</p><p className="text-sm text-gray-800 font-medium">{detailData.Status || '-'}</p></div>
                            </div>
                            {isAdmin && <button onClick={() => { setIsDetailOpen(false); handleOpenForm(detailData); }} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl mt-4"><i className="fas fa-edit"></i> Edit Laporan</button>}
                        </div>
                    )}
                </BottomSheet>
                {canAdd && (
                    <BottomSheet isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={`${editId ? 'Edit' : 'Buat'} Laporan`}>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="bg-blue-50 p-3 rounded-xl"><label className="block text-xs font-bold text-blue-700 mb-1 uppercase"><i className="fas fa-user mr-1"></i> Pelapor</label><p className="text-sm font-medium text-blue-800">{user.nama || user.username}</p><p className="text-[10px] text-blue-500 mt-1">Nama pelapor otomatis menggunakan akun login</p></div>
                            <div className="relative"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fas fa-heading text-gray-400"></i></div><input type="text" placeholder="Judul Laporan" className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm" value={formData.Judul} onChange={e => setFormData({...formData, Judul: e.target.value})} required /></div>
