                    {/* Bukti Upload */}
                    <div>
                        <label className="block text-xs font-bold text-gray-700 mb-2">Bukti Transaksi (Opsional)</label>
                        <div className="border-2 border-dashed rounded-xl p-4 text-center">
                            {buktiPreview ? (
                                <div className="relative inline-block">
                                    {buktiPreview.startsWith('data:image') ? (
                                        <img src={buktiPreview} className="w-32 h-32 object-cover rounded-lg" alt="Bukti" />
                                    ) : (
                                        <iframe src={buktiPreview} className="w-64 h-32 rounded-lg" title="Bukti" />
                                    )}
                                    <button 
                                        type="button"
                                        onClick={() => { setFormData({...formData, BuktiUrl: ''}); setBuktiPreview(null); }}
                                        className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs"
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                            ) : (
                                <label className="cursor-pointer">
                                    <i className="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2 block"></i>
                                    <span className="text-xs text-gray-500">Klik untuk upload bukti</span>
                                    <input 
                                        type="file" 
                                        accept=".pdf,.jpg,.jpeg,.png" 
                                        className="hidden"
                                        onChange={e => {
                                            const file = e.target.files[0];
                                            if (file) handleFileChange(file);
                                        }}
                                    />
                                </label>
                            )}
                        </div>
                    </div>

                    {/* Tombol */}
                    <div className="flex gap-3 pt-2">
                        <button type="button" onClick={onClose} className="flex-1 bg-gray-100 py-3 rounded-xl font-bold">Batal</button>
                        <button type="submit" disabled={submitting} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md">
                            {submitting ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div> : 'Simpan'}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    );
};

// Ekspor komponen untuk digunakan di App
// Assumsikan komponen-komponen ini akan digunakan bersama dengan Loader, SearchBar, BottomSheet, dan callAPI yang sudah didefinisikan sebelumnya

    // ==========================================
    // CCTV VIEW
    // ==========================================
    const CctvView = ({ user }) => {
        const [data, setData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [isDetailOpen, setIsDetailOpen] = useState(false);
        const [formData, setFormData] = useState({ NamaLokasi: '', LinkEmbed: '', Jenis: 'EZVIZ', Status: 'AKTIF', Keterangan: '' });
        const [detailData, setDetailData] = useState(null);
        const [editId, setEditId] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedCctv, setSelectedCctv] = useState(null);

        const isAdmin = user && user.role === 'Pengurus';
        const canAdd = isAdmin;
        const canDelete = isAdmin;

        const jenisOptions = [
            { value: 'EZVIZ', label: 'EZVIZ Cloud', placeholder: 'https://ezviz.com/share/...' },
            { value: 'YOUTUBE', label: 'YouTube Live', placeholder: 'https://www.youtube.com/embed/...' },
            { value: 'M3U8', label: 'M3U8 Stream', placeholder: 'https://example.com/stream.m3u8' },
            { value: 'JPEG', label: 'JPEG Snapshot', placeholder: 'https://example.com/snapshot.jpg' },
            { value: 'OTHER', label: 'Lainnya', placeholder: 'Masukkan link embed / iframe' }
        ];

        useEffect(() => { loadData(); }, []);
        const loadData = async () => { 
            setLoading(true); 
            const res = await callAPI('read', { sheetName: 'CCTV' }); 
            if(res.status === 'success') {
                const sortedData = res.data.sort((a, b) => b.id.localeCompare(a.id));
                setData(sortedData);
                if (sortedData.length > 0 && !selectedCctv) setSelectedCctv(sortedData[0]);
            }
            setLoading(false); 
        };

        const handleOpenForm = (row = null) => { 
            if (row && row.id) {
                setFormData({ NamaLokasi: row.NamaLokasi || '', LinkEmbed: row.LinkEmbed || '', Jenis: row.Jenis || 'EZVIZ', Status: row.Status || 'AKTIF', Keterangan: row.Keterangan || '' });
                setEditId(row.id);
            } else {
                setFormData({ NamaLokasi: '', LinkEmbed: '', Jenis: 'EZVIZ', Status: 'AKTIF', Keterangan: '' });
                setEditId(null);
            }
            setIsFormOpen(true); 
        };

        const handleDetail = (row) => { setDetailData(row); setIsDetailOpen(true); };
        const handleSubmit = async (e) => { e.preventDefault(); setSubmitting(true); const dataToSend = { ...formData, TanggalInput: new Date().toLocaleDateString('id-ID') }; let res; if (editId) res = await callAPI('update', { sheetName: 'CCTV', id: editId, data: dataToSend }); else res = await callAPI('create', { sheetName: 'CCTV', data: dataToSend }); setSubmitting(false); if(res.status === 'success') { setIsFormOpen(false); setEditId(null); Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false }); loadData(); } else { Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); } };
        const handleDelete = (id) => { Swal.fire({ title: 'Hapus CCTV?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya' }).then(async (result) => { if (result.isConfirmed) { Swal.fire({title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); await callAPI('delete', { sheetName: 'CCTV', id: id }); loadData(); Swal.close(); if (selectedCctv?.id === id) setSelectedCctv(null); } }); };
        const filteredData = data.filter(row => { if (!searchTerm) return true; const searchLower = searchTerm.toLowerCase(); return (row.NamaLokasi || '').toLowerCase().includes(searchLower) || (row.Jenis || '').toLowerCase().includes(searchLower); });

        const renderVideoEmbed = (cctv) => {
            if (!cctv || !cctv.LinkEmbed) return (<div className="bg-gray-800 rounded-xl flex items-center justify-center h-64"><div className="text-center text-gray-400"><i className="fas fa-video-slash text-5xl mb-3"></i><p className="text-sm">Tidak ada link CCTV</p></div></div>);
            let link = cctv.LinkEmbed;
            let embedUrl = null;
            const jenis = cctv.Jenis || 'OTHER';
            if (jenis === 'YOUTUBE' || link.includes('youtube.com') || link.includes('youtu.be')) {
                let videoId = null;
                if (link.includes('youtube.com/live/')) videoId = link.split('/live/')[1]?.split('?')[0];
                else if (link.includes('watch?v=')) videoId = link.split('v=')[1]?.split('&')[0];
                else if (link.includes('youtu.be/')) videoId = link.split('youtu.be/')[1]?.split('?')[0];
                else if (link.includes('/embed/')) videoId = link.split('/embed/')[1]?.split('?')[0];
                if (videoId) embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=0&rel=0&modestbranding=1`;
            } else if (jenis === 'EZVIZ' && link.includes('ezviz.com')) {
                if (link.includes('/share/')) { const shareId = link.split('/share/')[1]?.split('?')[0]; if (shareId) embedUrl = `https://ezviz.com/share/embed/${shareId}`; }
                else embedUrl = link;
            } else { embedUrl = link; }
            if (embedUrl) return (<div className="relative pt-[56.25%] bg-black rounded-xl overflow-hidden"><iframe src={embedUrl} className="absolute top-0 left-0 w-full h-full border-0" allowFullScreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" title={cctv.NamaLokasi} /></div>);
            return (<div className="bg-gray-800 rounded-xl flex items-center justify-center h-64"><div className="text-center text-gray-400"><i className="fas fa-exclamation-triangle text-4xl mb-3"></i><p className="text-sm">Tidak dapat memuat video</p><p className="text-xs text-gray-500 break-all mt-2">{link}</p></div></div>);
        };

        const getJenisIcon = (jenis) => { switch(jenis) { case 'EZVIZ': return 'fa-camera'; case 'YOUTUBE': return 'fa-youtube'; default: return 'fa-eye'; } };

        return (
            <div className="p-4 pb-10">
                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-gray-800"><i className="fas fa-video mr-2 text-blue-500"></i> Monitoring CCTV</h2>{canAdd && <button onClick={() => handleOpenForm()} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md"><i className="fas fa-plus mr-1"></i> Tambah CCTV</button>}</div>
                <SearchBar searchTerm={searchTerm} setSearchTerm={setSearchTerm} placeholder="Cari lokasi CCTV..." />
                {loading ? <Loader /> : (
                    <>
                        {selectedCctv && (
                            <div className="mb-6">
                                <div className="bg-gradient-to-r from-blue-500 to-blue-700 rounded-t-2xl p-4 text-white">
                                    <div className="flex justify-between items-center"><div><h3 className="font-bold text-lg"><i className={`fas ${getJenisIcon(selectedCctv.Jenis)} mr-2`}></i>{selectedCctv.NamaLokasi}</h3><p className="text-xs opacity-80 mt-1">{selectedCctv.Jenis} • Status: {selectedCctv.Status}</p></div>{selectedCctv.Keterangan && <span className="text-xs bg-white/20 px-2 py-1 rounded-full">{selectedCctv.Keterangan}</span>}</div>
                                </div>
                                <div className="bg-gray-900 rounded-b-2xl overflow-hidden shadow-lg">{selectedCctv.Status === 'AKTIF' ? renderVideoEmbed(selectedCctv) : <div className="bg-gray-800 rounded-xl flex items-center justify-center h-64"><div className="text-center text-gray-400"><i className="fas fa-eye-slash text-5xl mb-3"></i><p className="text-sm">CCTV Tidak Aktif</p></div></div>}</div>
                            </div>
                        )}
                        <div className="grid grid-cols-2 gap-3 mt-4">{filteredData.map((row) => (<div key={row.id} onClick={() => setSelectedCctv(row)} className={`p-3 rounded-xl border cursor-pointer transition-all ${selectedCctv?.id === row.id ? 'bg-blue-50 border-blue-500' : 'bg-white border-gray-200 hover:shadow-md'}`}><div className="flex items-start gap-2"><div className={`w-2 h-2 rounded-full mt-2 ${row.Status === 'AKTIF' ? 'bg-green-500' : 'bg-red-500'}`}></div><div className="flex-1"><p className="text-sm font-bold truncate">{row.NamaLokasi}</p><p className="text-[10px] text-gray-400">{row.Jenis}</p></div>{canAdd && <div className="flex gap-1" onClick={(e) => e.stopPropagation()}><button onClick={() => handleOpenForm(row)} className="text-yellow-600 text-xs p-1"><i className="fas fa-edit"></i></button><button onClick={() => handleDelete(row.id)} className="text-red-500 text-xs p-1"><i className="fas fa-trash"></i></button></div>}</div></div>))}</div>
                    </>
                )}
                {canAdd && (
                    <BottomSheet isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={`${editId ? 'Edit' : 'Tambah'} CCTV`}>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-xs font-bold text-gray-700 mb-1.5">Nama Lokasi *</label><input type="text" className="w-full p-3 border rounded-xl text-sm" placeholder="Contoh: Pos Utama" value={formData.NamaLokasi} onChange={e => setFormData({...formData, NamaLokasi: e.target.value})} required /></div>
                            <div><label className="block text-xs font-bold text-gray-700 mb-1.5">Jenis CCTV</label><select className="w-full p-3 border rounded-xl text-sm" value={formData.Jenis} onChange={e => setFormData({...formData, Jenis: e.target.value})}>{jenisOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}</select></div>
                            <div><label className="block text-xs font-bold text-gray-700 mb-1.5">Link / Embed URL *</label><input type="url" className="w-full p-3 border rounded-xl text-sm" placeholder="https://..." value={formData.LinkEmbed} onChange={e => setFormData({...formData, LinkEmbed: e.target.value})} required /></div>
                            <div><label className="block text-xs font-bold text-gray-700 mb-1.5">Status</label><select className="w-full p-3 border rounded-xl text-sm" value={formData.Status} onChange={e => setFormData({...formData, Status: e.target.value})}><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select></div>
                            <div><label className="block text-xs font-bold text-gray-700 mb-1.5">Keterangan (Opsional)</label><textarea className="w-full p-3 border rounded-xl text-sm h-20" placeholder="Informasi tambahan..." value={formData.Keterangan} onChange={e => setFormData({...formData, Keterangan: e.target.value})} /></div>
                            <button type="submit" disabled={submitting} className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl">{submitting ? 'Menyimpan...' : 'Simpan CCTV'}</button>
                        </form>
                    </BottomSheet>
                )}
            </div>
        );
    };

    // ==========================================
    // PANIC BUTTON VIEW
    // ==========================================
    // ==========================================
// PANIC BUTTON VIEW (DENGAN WHATSAPP GREEN API)
// ==========================================
const PanicButtonView = ({ user }) => {
    const [loading, setLoading] = useState(false);
    const [showForm, setShowForm] = useState(false);
    const [lokasi, setLokasi] = useState('');
    const [jenisDarurat, setJenisDarurat] = useState('');
    const [detailKejadian, setDetailKejadian] = useState('');
    const [isLoadingLocation, setIsLoadingLocation] = useState(false);
    let audioContext = null;
    let alarmInterval = null;

    // Fungsi untuk memutar suara alarm
    const playAlarmSound = () => {
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = 880;
            gainNode.gain.value = 0.3;
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
            oscillator.stop(audioContext.currentTime + 0.5);
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        } catch(e) {
            console.log('Audio error:', e);
        }
    };

    // Fungsi untuk memutar suara sirine
    const playSirenSound = () => {
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const now = audioContext.currentTime;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            gainNode.gain.value = 0.4;
            oscillator.frequency.setValueAtTime(600, now);
            oscillator.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
            oscillator.frequency.exponentialRampToValueAtTime(600, now + 1);
            oscillator.frequency.exponentialRampToValueAtTime(1200, now + 1.5);
            oscillator.frequency.exponentialRampToValueAtTime(600, now + 2);
            oscillator.start();
            oscillator.stop(now + 2.5);
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        } catch(e) {
            console.log('Siren error:', e);
        }
    };

    // Dapatkan lokasi otomatis
    const getCurrentLocation = () => {
        setIsLoadingLocation(true);
        if (!navigator.geolocation) {
            Swal.fire('Error', 'Browser tidak mendukung geolokasi', 'error');
            setIsLoadingLocation(false);
            return;
        }
        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const { latitude, longitude } = position.coords;
                setLokasi(`https://maps.google.com/?q=${latitude},${longitude}`);
                setIsLoadingLocation(false);
            },
            (error) => {
                console.error('Error getting location:', error);
                setIsLoadingLocation(false);
                Swal.fire('Info', 'Gagal mendapatkan lokasi otomatis. Silakan masukkan lokasi manual.', 'info');
            }
        );
    };

    // Kirim sinyal darurat
    const sendPanicSignal = async () => {
        setLoading(true);
        playAlarmSound();
        
        const panicData = {
            Pelapor: user.nama || user.username,
            NoHP: user.noHP || '-',
            Waktu: new Date().toLocaleString('id-ID', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }),
            Lokasi: lokasi || 'Tidak diketahui',
            JenisDarurat: jenisDarurat,
            DetailKejadian: detailKejadian || '-',
            Status: 'AKTIF'
        };
        
        const res = await callAPI('create', { sheetName: 'Panic', data: panicData });
        
        setLoading(false);
        setShowForm(false);
        
        if (res.status === 'success') {
            playSirenSound();
            setLokasi('');
            setJenisDarurat('');
            setDetailKejadian('');
            
            Swal.fire({
                icon: 'success',
                title: '🚨 SINYAL DARURAT TERKIRIM! 🚨',
                html: `
                    <div class="text-left">
                        <div class="bg-red-50 p-3 rounded-lg mb-3">
                            <p class="font-bold text-red-600">📋 Detail Laporan:</p>
                            <p class="text-sm mt-1"><strong>Jenis:</strong> ${jenisDaruratOptions.find(o => o.value === jenisDarurat)?.label || jenisDarurat}</p>
                            <p class="text-sm"><strong>Lokasi:</strong> ${lokasi || 'Tidak diketahui'}</p>
                            ${detailKejadian ? `<p class="text-sm"><strong>Detail:</strong> ${detailKejadian.substring(0, 100)}</p>` : ''}
                        </div>
                        <div class="bg-green-50 p-3 rounded-lg mt-2">
                            <p class="font-bold text-green-600">✅ Notifikasi Telah Dikirim ke:</p>
                            <ul class="text-sm text-gray-700 mt-1 list-disc list-inside">
                                <li>📱 WhatsApp Pengurus RT</li>
                                <li>🔔 Notifikasi Aplikasi</li>
                            </ul>
                        </div>
                        <p class="text-sm text-gray-600 mt-3">⚠️ Tim keamanan akan segera merespon!</p>
                        <p class="text-xs text-gray-500 mt-2">⏰ Waktu: ${panicData.Waktu}</p>
                    </div>
                `,
                confirmButtonText: 'OK, Saya Mengerti',
                confirmButtonColor: '#dc2626'
            });
            
            setTimeout(() => {
                if (alarmInterval) {
                    clearInterval(alarmInterval);
                    alarmInterval = null;
                }
            }, 8000);
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Gagal Mengirim Sinyal',
                text: res.message + '\n\nSegera hubungi Ketua RT secara langsung!',
                confirmButtonText: 'OK'
            });
        }
    };

    // Jenis darurat options
    const jenisDaruratOptions = [
        { value: 'kebakaran', label: '🔥 Kebakaran', icon: 'fa-fire', color: 'bg-red-500' },
        { value: 'kriminal', label: '🔫 Kejahatan / Pencurian', icon: 'fa-shield-alt', color: 'bg-red-600' },
        { value: 'kecelakaan', label: '🚑 Kecelakaan / Medis', icon: 'fa-ambulance', color: 'bg-orange-500' },
        { value: 'bencana', label: '🌊 Bencana Alam', icon: 'fa-water', color: 'bg-blue-600' },
        { value: 'keamanan', label: '👮 Gangguan Keamanan', icon: 'fa-users', color: 'bg-yellow-600' },
        { value: 'lainnya', label: '📢 Lainnya', icon: 'fa-ellipsis-h', color: 'bg-gray-500' }
    ];

    useEffect(() => {
        return () => {
            if (alarmInterval) clearInterval(alarmInterval);
            if (audioContext) audioContext.close();
        };
    }, []);

    return (
        <div className="p-4 pb-10">
            {/* Tombol Darurat Utama */}
            <div className="text-center bg-white p-6 rounded-2xl shadow-sm border">
                <div className="bg-red-50 rounded-full w-24 h-24 flex items-center justify-center mx-auto mb-4">
                    <i className="fas fa-exclamation-triangle text-5xl text-red-600 animate-pulse"></i>
                </div>
                <h2 className="text-2xl font-black mb-2 text-red-600">SOS Darurat RT 06</h2>
                <p className="text-xs text-gray-500 mb-6">
                    <i className="fas fa-info-circle mr-1"></i>
                    Gunakan hanya untuk kondisi darurat! Setiap sinyal akan mengirim pesan WhatsApp ke pengurus RT.
                </p>
                
                <button 
                    onClick={() => setShowForm(true)}
                    disabled={loading}
                    className={`
                        w-56 h-56 mx-auto rounded-full shadow-2xl flex items-center justify-center 
                        transition-all duration-300 relative overflow-hidden
                        ${loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700 animate-pulse'}
                        border-8 border-red-200 hover:scale-105
                    `}
                >
                    {loading ? (
                        <div className="text-white flex flex-col items-center">
                            <i className="fas fa-spinner fa-spin text-5xl mb-2"></i>
                            <span className="font-black text-xl">MENGIRIM...</span>
                        </div>
                    ) : (
                        <div className="text-white flex flex-col items-center">
                            <i className="fas fa-exclamation-triangle text-6xl mb-3"></i>
                            <span className="font-black text-2xl">PANIC</span>
                            <span className="text-[10px] mt-2 opacity-80">Tekan untuk Darurat</span>
                        </div>
                    )}
                    
                    {!loading && (
                        <>
                            <span className="absolute inset-0 rounded-full bg-red-500 animate-ping opacity-30"></span>
                            <span className="absolute inset-0 rounded-full bg-red-500 animate-pulse opacity-20"></span>
                        </>
                    )}
                </button>
                
                <div className="mt-6 p-3 bg-blue-50 rounded-lg">
                    <p className="text-xs text-blue-700">
                        <i className="fab fa-whatsapp mr-1 text-green-500"></i>
                        Notifikasi akan dikirim ke WhatsApp Pengurus RT
                    </p>
                </div>
            </div>

            {/* Modal Form Detail Darurat */}
            {showForm && (
                <div className="fixed inset-0 bg-black bg-opacity-50 z-[200] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto animate-slide-up">
                        <div className="sticky top-0 bg-white p-4 border-b flex justify-between items-center">
                            <h3 className="font-bold text-lg text-red-600">
                                <i className="fas fa-info-circle mr-2"></i>
                                Detail Kejadian Darurat
                            </h3>
                            <button onClick={() => setShowForm(false)} className="text-gray-400 hover:text-gray-600">
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        
                        <div className="p-4 space-y-4">
                            <div className="bg-red-50 p-3 rounded-lg border border-red-200">
                                <p className="text-xs text-red-700 font-medium">
                                    <i className="fas fa-exclamation-triangle mr-1"></i>
                                    Informasi ini akan dikirim ke WhatsApp seluruh pengurus RT!
                                </p>
                            </div>
                            
                            {/* Jenis Darurat */}
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">
                                    <i className="fas fa-tag mr-1 text-red-500"></i>
                                    Jenis Darurat <span className="text-red-500">*</span>
                                </label>
                                <div className="grid grid-cols-2 gap-2">
                                    {jenisDaruratOptions.map(option => (
                                        <button
                                            key={option.value}
                                            type="button"
                                            onClick={() => setJenisDarurat(option.value)}
                                            className={`
                                                p-3 rounded-xl border-2 text-left transition-all
                                                ${jenisDarurat === option.value 
                                                    ? `${option.color} text-white border-transparent` 
                                                    : 'bg-gray-50 border-gray-200 text-gray-700 hover:bg-gray-100'}
                                            `}
                                        >
                                            <i className={`fas ${option.icon} mr-2 ${jenisDarurat === option.value ? 'text-white' : ''}`}></i>
                                            <span className="text-xs font-medium">{option.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Lokasi */}
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">
                                    <i className="fas fa-map-marker-alt mr-1 text-red-500"></i>
                                    Lokasi Kejadian <span className="text-red-500">*</span>
                                </label>
                                <div className="flex gap-2">
                                    <div className="flex-1 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i className="fas fa-location-dot text-gray-400"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            className="w-full pl-10 pr-3 py-2 border rounded-xl text-sm" 
                                            placeholder="Contoh: Jl. Mawar No. 10, RT 06"
                                            value={lokasi}
                                            onChange={e => setLokasi(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <button
                                        type="button"
                                        onClick={getCurrentLocation}
                                        disabled={isLoadingLocation}
                                        className="px-3 py-2 bg-blue-500 text-white rounded-xl text-sm hover:bg-blue-600 transition"
                                    >
                                        {isLoadingLocation ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-crosshairs"></i>}
                                    </button>
                                </div>
                                <p className="text-[10px] text-gray-400 mt-1">
                                    <i className="fas fa-info-circle mr-1"></i>
                                    Klik ikon target untuk menggunakan lokasi saat ini
                                </p>
                            </div>
                            
                            {/* Detail Kejadian */}
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">
                                    <i className="fas fa-pen mr-1 text-red-500"></i>
                                    Detail Kejadian
                                </label>
                                <textarea 
                                    className="w-full p-3 border rounded-xl text-sm h-24"
                                    placeholder="Contoh: Ada asap tebal dari lantai 2, api sudah mulai membesar..."
                                    value={detailKejadian}
                                    onChange={e => setDetailKejadian(e.target.value)}
                                ></textarea>
                            </div>
                            
                            {/* Informasi Pengirim */}
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-xs text-gray-500">
                                    <i className="fas fa-user mr-1"></i>
                                    Dilaporkan oleh: <strong>{user.nama || user.username}</strong>
                                </p>
                                {user.noHP && (
                                    <p className="text-xs text-gray-500 mt-1">
                                        <i className="fas fa-phone mr-1"></i>
                                        Kontak: {user.noHP}
                                    </p>
                                )}
                            </div>
                            
                            {/* Informasi WhatsApp */}
                            <div className="bg-green-50 p-3 rounded-lg">
                                <p className="text-xs text-green-700 font-medium">
                                    <i className="fab fa-whatsapp mr-1"></i>
                                    Pesan WhatsApp akan dikirim ke:
                                </p>
                                <ul className="text-xs text-green-600 mt-1 list-disc list-inside">
                                    <li>Ketua RT</li>
                                    <li>Sekretaris RT</li>
                                    <li>Bendahara RT</li>
                                    <li>Seluruh Pengurus RT</li>
                                </ul>
                            </div>
                            
                            {/* Tombol Aksi */}
                            <div className="flex gap-3 pt-2">
                                <button onClick={() => setShowForm(false)} className="flex-1 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold text-sm">Batal</button>
                                <button
                                    onClick={() => {
                                        if (!jenisDarurat) {
                                            Swal.fire('Peringatan', 'Pilih jenis darurat terlebih dahulu!', 'warning');
                                            return;
                                        }
                                        if (!lokasi) {
                                            Swal.fire('Peringatan', 'Masukkan lokasi kejadian!', 'warning');
                                            return;
                                        }
                                        
                                        Swal.fire({
                                            title: '⚠️ KONFIRMASI DARURAT ⚠️',
                                            html: `
                                                <div class="text-left">
                                                    <p class="font-bold text-red-600 mb-3">Anda yakin akan mengirim sinyal darurat?</p>
                                                    <div class="bg-red-50 p-3 rounded-lg">
                                                        <p class="text-sm"><strong>📋 Jenis:</strong> ${jenisDaruratOptions.find(o => o.value === jenisDarurat)?.label}</p>
                                                        <p class="text-sm mt-1"><strong>📍 Lokasi:</strong> ${lokasi}</p>
                                                        ${detailKejadian ? `<p class="text-sm mt-1"><strong>📝 Detail:</strong> ${detailKejadian.substring(0, 100)}</p>` : ''}
                                                    </div>
                                                    <div class="bg-green-50 p-3 rounded-lg mt-3">
                                                        <p class="text-sm font-bold text-green-700">📱 Pesan WhatsApp akan dikirim ke pengurus RT</p>
                                                    </div>
                                                    <p class="text-xs text-gray-500 mt-3">⚠️ Peringatan akan dikirim ke seluruh pengurus RT!</p>
                                                </div>
                                            `,
                                            icon: 'warning',
                                            showCancelButton: true,
                                            confirmButtonText: '🚨 KIRIM DARURAT! 🚨',
                                            cancelButtonText: 'Batal',
                                            confirmButtonColor: '#dc2626'
                                        }).then((result) => {
                                            if (result.isConfirmed) {
                                                sendPanicSignal();
                                            }
                                        });
                                    }}
                                    disabled={!jenisDarurat || !lokasi}
                                    className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold text-sm hover:bg-red-700 transition"
                                >
                                    <i className="fas fa-paper-plane mr-2"></i>
                                    Kirim Darurat
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            
            {/* Informasi Penggunaan */}
            <div className="mt-4 bg-blue-50 rounded-xl p-4 border border-blue-200">
                <h3 className="font-bold text-blue-800 text-sm mb-2">
                    <i className="fas fa-info-circle mr-1"></i> Informasi Penting
                </h3>
                <ul className="text-xs text-blue-700 space-y-1 list-disc list-inside">
                    <li>Isi jenis darurat dan lokasi untuk respons yang lebih cepat</li>
                    <li>Anda bisa menggunakan lokasi otomatis dengan mengklik ikon target</li>
                    <li>Setiap sinyal akan mengirimkan notifikasi ke semua pengurus RT via WhatsApp</li>
                    <li>Alarm akan berbunyi di perangkat admin secara otomatis</li>
                    <li>Pesan WhatsApp akan berisi link lokasi Google Maps</li>
                    <li>Jangan gunakan untuk hal-hal yang tidak darurat</li>
                </ul>
            </div>
        </div>
    );
};

    // ==========================================
    // NOTIFIKASI VIEW
    // ==========================================
    const NotificationView = ({ notifs, loadNotifs, user }) => {
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedNotif, setSelectedNotif] = useState(null);
        const [isDetailOpen, setIsDetailOpen] = useState(false);

        const filteredNotifs = notifs.filter(n => {
            const pesan = n.Pesan || '';
            const judul = n.Judul || '';
            const searchLower = searchTerm.toLowerCase();
            return pesan.toLowerCase().includes(searchLower) || judul.toLowerCase().includes(searchLower);
        });

        const isNotifUnread = (status) => {
            const statusStr = String(status || '');
            const username = user?.username || '';
            return !statusStr.includes(username);
        };

        const handleMarkAllRead = async () => { await callAPI('markAllReadNotif', { username: user.username }); await loadNotifs(); };
        const openDetail = async (notif) => { setSelectedNotif(notif); setIsDetailOpen(true); if (isNotifUnread(notif.Status)) { await callAPI('markSingleReadNotif', { id: notif.id, username: user.username }); loadNotifs(); } };
        const getIconAndColor = (kategori, pesan) => {
            const text = String(kategori || pesan || '').toLowerCase();
            if (text.includes('darurat')) return { icon: 'fa-exclamation-triangle', color: 'bg-red-100 text-red-600', border: 'border-red-100' };
            if (text.includes('uang') || text.includes('iuran') || text.includes('keuangan')) return { icon: 'fa-wallet', color: 'bg-emerald-100 text-emerald-600', border: 'border-emerald-100' };
            if (text.includes('lapor') || text.includes('laporan')) return { icon: 'fa-bullhorn', color: 'bg-orange-100 text-orange-600', border: 'border-orange-100' };
            return { icon: 'fa-info-circle', color: 'bg-blue-100 text-blue-600', border: 'border-blue-100' };
        };
        const hasUnread = notifs.some(n => isNotifUnread(n.Status));

        return (
            <div className="p-4 pb-10">
                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold">Notifikasi</h2>{hasUnread && <button onClick={handleMarkAllRead} className="text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-2 rounded-lg"><i className="fas fa-check-double mr-1"></i> Tandai Dibaca</button>}</div>
                <SearchBar searchTerm={searchTerm} setSearchTerm={setSearchTerm} placeholder="Cari notifikasi..." />
                <div className="space-y-3 mt-4">
                    {filteredNotifs.length === 0 ? <div className="text-center text-gray-400 py-8"><i className="fas fa-bell-slash text-4xl mb-2 opacity-50 block"></i>Tidak ada notifikasi</div> : filteredNotifs.map((n, idx) => { const style = getIconAndColor(n.Kategori, n.Pesan); const isUnread = isNotifUnread(n.Status); return (<div key={idx} onClick={() => openDetail(n)} className={`p-4 rounded-2xl border cursor-pointer flex gap-4 transition ${isUnread ? `bg-white ${style.border} ring-1 ring-blue-50 shadow-sm` : 'bg-gray-50 border-transparent'}`}><div className={`rounded-full w-12 h-12 flex items-center justify-center shrink-0 ${isUnread ? style.color : 'bg-gray-200 text-gray-400'}`}><i className={`fas ${style.icon} text-lg`}></i></div><div className="flex-1 min-w-0"><div className="flex justify-between items-start mb-1"><h3 className={`text-sm truncate pr-2 ${isUnread ? 'font-bold text-gray-800' : 'font-medium text-gray-600'}`}>{n.Judul || 'Notifikasi'}</h3>{isUnread && <span className="w-2.5 h-2.5 bg-blue-500 rounded-full shrink-0 mt-1"></span>}</div><p className={`text-xs line-clamp-2 ${isUnread ? 'text-gray-600' : 'text-gray-500'}`}>{n.Pesan || '-'}</p><p className="text-[10px] text-gray-400 mt-2"><i className="fas fa-clock mr-1"></i> {n.Tanggal || '-'}</p></div></div>); })}
                </div>
                <BottomSheet isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title="Detail Notifikasi">
                    {selectedNotif && (<div className="text-center py-4 px-2"><div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 ${getIconAndColor(selectedNotif.Kategori, selectedNotif.Pesan).color}`}><i className={`fas ${getIconAndColor(selectedNotif.Kategori, selectedNotif.Pesan).icon} text-3xl`}></i></div><h3 className="text-xl font-black text-gray-800 mb-2">{selectedNotif.Judul || 'Notifikasi'}</h3><div className="inline-flex items-center text-[10px] bg-gray-100 px-3 py-1 rounded-full mb-6"><i className="fas fa-calendar-alt mr-1.5"></i> {selectedNotif.Tanggal || '-'}</div><div className="bg-gray-50 border border-gray-100 p-5 rounded-2xl text-left"><p className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{selectedNotif.Pesan || '-'}</p></div>{selectedNotif.Kategori === 'LAPOR_RT' && selectedNotif.Pelapor && <div className="mt-4 text-[10px] text-gray-400"><i className="fas fa-user mr-1"></i> Dilaporkan oleh: {selectedNotif.Pelapor}</div>}</div>)}
                </BottomSheet>
            </div>
        );
    };

    // ==========================================
    // PENGATURAN VIEW
    // ==========================================
    const PengaturanView = ({ user, onLogout }) => {
        const [isPwdOpen, setIsPwdOpen] = useState(false);
        const [pwdData, setPwdData] = useState({ old: '', new: '', confirm: '' });

        const handlePasswordSubmit = async (e) => {
            e.preventDefault();
            if (pwdData.new !== pwdData.confirm) { Swal.fire({ icon: 'error', text: 'Password baru tidak cocok!' }); return; }
            if (pwdData.new.length < 4) { Swal.fire({ icon: 'warning', text: 'Minimal 4 karakter.' }); return; }
            const res = await callAPI('changePassword', { username: user.username, oldPassword: pwdData.old, newPassword: pwdData.new });
            if (res.status === 'success') { setIsPwdOpen(false); setPwdData({ old: '', new: '', confirm: '' }); Swal.fire({ icon: 'success', title: 'Berhasil', timer: 1500, showConfirmButton: false }); }
            else { Swal.fire({ icon: 'error', text: res.message }); }
        };

        return (
            <div className="p-4 pb-10 space-y-4">
                <div className="bg-white rounded-2xl shadow-sm border p-5">
                    <div className="flex items-center space-x-4 mb-6"><div className="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center text-3xl"><i className="fas fa-user"></i></div><div><h3 className="font-bold text-gray-800 text-xl">{user.nama || user.username}</h3><span className="bg-blue-50 text-blue-600 border border-blue-200 text-[10px] font-bold px-2.5 py-1 rounded-full mt-1.5 inline-block">{user.role}</span></div></div>
                    <div className="space-y-1"><div onClick={() => setIsPwdOpen(true)} className="flex justify-between items-center py-3.5 border-b border-gray-50 cursor-pointer hover:bg-gray-50 rounded-lg px-2"><span className="text-sm font-medium"><i className="fas fa-lock w-6 text-gray-400 mr-2"></i> Ganti Password</span><i className="fas fa-chevron-right text-gray-300 text-xs"></i></div></div>
                    <button onClick={onLogout} className="w-full mt-6 bg-red-50 text-red-600 font-bold py-3.5 rounded-xl border border-red-100 hover:bg-red-100"><i className="fas fa-sign-out-alt mr-2"></i> Keluar Aplikasi</button>
                </div>
                <BottomSheet isOpen={isPwdOpen} onClose={() => setIsPwdOpen(false)} title="Ganti Password">
                    <form onSubmit={handlePasswordSubmit} className="space-y-4">
                        <input type="password" placeholder="Password saat ini" className="w-full p-3 border rounded-xl text-sm" value={pwdData.old} onChange={e=>setPwdData({...pwdData, old:e.target.value})} required />
                        <input type="password" placeholder="Password baru" className="w-full p-3 border border-blue-200 bg-blue-50 rounded-xl text-sm" value={pwdData.new} onChange={e=>setPwdData({...pwdData, new:e.target.value})} required />
                        <input type="password" placeholder="Ketik ulang password baru" className="w-full p-3 border border-blue-200 bg-blue-50 rounded-xl text-sm" value={pwdData.confirm} onChange={e=>setPwdData({...pwdData, confirm:e.target.value})} required />
                        <button type="submit" className="w-full bg-blue-600 text-white font-bold p-3.5 rounded-xl mt-2">Perbarui Password</button>
                    </form>
                </BottomSheet>
            </div>
        );
    };

   // ==========================================
// BANSOS VIEW (BANTUAN SOSIAL)
// ==========================================
const BansosView = ({ user }) => {
    const [data, setData] = useState([]);
    const [allData, setAllData] = useState([]);
    const [loading, setLoading] = useState(true);
    const [isFormOpen, setIsFormOpen] = useState(false);
    const [isDetailOpen, setIsDetailOpen] = useState(false);
    const [formData, setFormData] = useState({
        Nama: '',
        NoKTP: '',
        Foto: '',
        JenisBansos: '',
        Nominal: '',
        TanggalPenerimaan: new Date().toISOString().split('T')[0],
        Keterangan: '',
        Status: 'Disalurkan'
    });
    const [detailData, setDetailData] = useState(null);
    const [editId, setEditId] = useState(null);
    const [submitting, setSubmitting] = useState(false);
    const [searchTerm, setSearchTerm] = useState('');
    const [imagePreview, setImagePreview] = useState(null);
    const [showWargaDropdown, setShowWargaDropdown] = useState(false);
    const [filteredWarga, setFilteredWarga] = useState([]);
    const [wargaList, setWargaList] = useState([]);

    const isAdmin = user && user.role === 'Pengurus';
    const canAdd = isAdmin;
    const canDelete = isAdmin;

    // Jenis Bansos Options
    const jenisBansosOptions = [
        'PKH (Program Keluarga Harapan)',
        'BPNT / Sembako',
        'BLT (Bantuan Langsung Tunai)',
        'Bedah Rumah',
        'Bantuan Pendidikan',
        'Bantuan Kesehatan',
        'Bantuan Usaha Mikro',
        'Bantuan Korban Bencana',
        'Bantuan Duka / Kematian',
        'Bantuan Perlengkapan Ibadah',
        'Bantuan Disabilitas',
        'Lainnya'
    ];

    const statusOptions = ['Disalurkan', 'Proses Verifikasi', 'Tunggu Jadwal', 'Tidak Layak'];

    // Load data warga untuk auto-complete No KTP
    useEffect(() => {
        const loadWarga = async () => {
            const res = await callAPI('read', { sheetName: 'Warga' });
            if (res.status === 'success') {
                setWargaList(res.data);
            }
        };
        loadWarga();
    }, []);

    useEffect(() => { loadData(); }, []);
    
    const loadData = async () => { 
        setLoading(true); 
        const res = await callAPI('read', { sheetName: 'Bansos' }); 
        if(res.status === 'success') {
            const sortedData = res.data.sort((a, b) => b.id.localeCompare(a.id));
            setAllData(sortedData);
            setData(sortedData);
        }
        setLoading(false); 
    };

    const getPhotoUrl = (url) => {
        if (url && typeof url === 'string') {
            if (url.startsWith('http://') || url.startsWith('https://')) {
                if (url.includes('drive.google.com')) {
                    const match = url.match(/(?:\/d\/|id=)([-\w]{25,})/);
                    if (match && match[1]) return `https://drive.google.com/thumbnail?sz=w800&id=${match[1]}`;
                }
                return url;
            }
        }
        return null;
    };

    const handleSearch = (term) => {
        setSearchTerm(term);
        if (!term.trim()) {
            setData(allData);
            return;
        }
        const searchLower = term.toLowerCase();
        const filtered = allData.filter(row => 
            (row.Nama || '').toLowerCase().includes(searchLower) ||
            (row.NoKTP || '').toLowerCase().includes(searchLower) ||
            (row.JenisBansos || '').toLowerCase().includes(searchLower)
        );
        setData(filtered);
    };

    // Handle No KTP change (auto-fill nama)
    const handleNoKTPChange = (value) => {
        setFormData({ ...formData, NoKTP: value, Nama: '' });
        
        if (value.length >= 4) {
            const filtered = wargaList.filter(w => 
                w.NoKTP && w.NoKTP.toLowerCase().includes(value.toLowerCase())
            );
            setFilteredWarga(filtered);
            setShowWargaDropdown(true);
            
            if (value.length === 16) {
                const warga = wargaList.find(w => w.NoKTP === value);
                if (warga) {
                    setFormData(prev => ({
                        ...prev,
                        NoKTP: warga.NoKTP,
                        Nama: warga.Nama
                    }));
                    setShowWargaDropdown(false);
                }
            }
        } else {
            setFilteredWarga([]);
            setShowWargaDropdown(false);
        }
    };

    const selectWarga = (warga) => {
        setFormData({
            ...formData,
            NoKTP: warga.NoKTP,
            Nama: warga.Nama
        });
        setShowWargaDropdown(false);
    };

    const handleOpenForm = (row = null) => { 
        setImagePreview(null);
        if (row && row.id) {
            setFormData({
                Nama: row.Nama || '',
                NoKTP: row.NoKTP || '',
                Foto: row.Foto || '',
                JenisBansos: row.JenisBansos || '',
                Nominal: row.Nominal || '',
                TanggalPenerimaan: row.TanggalPenerimaan || new Date().toISOString().split('T')[0],
                Keterangan: row.Keterangan || '',
                Status: row.Status || 'Disalurkan'
            });
            setEditId(row.id);
            if (row.Foto && row.Foto.startsWith('http')) setImagePreview(row.Foto);
        } else {
            setFormData({
                Nama: '',
                NoKTP: '',
                Foto: '',
                JenisBansos: '',
                Nominal: '',
                TanggalPenerimaan: new Date().toISOString().split('T')[0],
                Keterangan: '',
                Status: 'Disalurkan'
            });
            setEditId(null);
        }
        setIsFormOpen(true); 
    };

    const handleDetail = (row) => { 
        setDetailData(row); 
        setIsDetailOpen(true); 
    };

    const handleFileChange = (field, file) => {
        if (file) {
            if (file.size > 2 * 1024 * 1024) {
                Swal.fire({ icon: 'warning', title: 'Ukuran file terlalu besar', text: 'Maksimal ukuran file adalah 2MB!' });
                return;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    const maxSize = 800;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = (height * maxSize) / width;
                            width = maxSize;
                        } else {
                            width = (width * maxSize) / height;
                            height = maxSize;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    setFormData({...formData, [field]: compressedDataUrl});
                    setImagePreview(compressedDataUrl);
                    Swal.fire({ icon: 'success', title: 'Foto berhasil diupload', timer: 1500, showConfirmButton: false });
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }
    };

    const handleSubmit = async (e) => {
        e.preventDefault();
        
        if (!formData.Nama) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Nama penerima bansos wajib diisi!' });
            return;
        }
        if (!formData.JenisBansos) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Jenis bansos wajib diisi!' });
            return;
        }
        
        setSubmitting(true);
        
        const dataToSend = {
            ...formData,
            Nominal: Number(formData.Nominal) || 0,
            InputBy: user.nama || user.username,
            TanggalInput: new Date().toLocaleDateString('id-ID')
        };
        
        let res;
        if (editId) { 
            res = await callAPI('update', { sheetName: 'Bansos', id: editId, data: dataToSend });
        } else { 
            res = await callAPI('create', { sheetName: 'Bansos', data: dataToSend });
            
            // Kirim notifikasi ke warga penerima
            if (res.status === 'success' && formData.NoKTP) {
                await callAPI('create', {
                    sheetName: 'Notifikasi',
                    data: {
                        Judul: `📦 Bantuan Sosial: ${formData.JenisBansos}`,
                        Pesan: `Kepada Yth. ${formData.Nama}, bantuan ${formData.JenisBansos} sebesar ${formatRp(formData.Nominal)} telah disalurkan. Terima kasih.`,
                        Kategori: 'BANSOS',
                        Tanggal: new Date().toLocaleString(),
                        Target: formData.NoKTP,
                        Pelapor: user.username
                    }
                });
            }
        }
        setSubmitting(false);
        
        if(res.status === 'success') { 
            setIsFormOpen(false); 
            setEditId(null); 
            setImagePreview(null);
            Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false }); 
            loadData(); 
        } else { 
            Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); 
        }
    };

    const handleDelete = (id) => {
        Swal.fire({ title: 'Hapus Data Bansos?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya' }).then(async (result) => {
            if (result.isConfirmed) { 
                Swal.fire({title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); 
                await callAPI('delete', { sheetName: 'Bansos', id: id }); 
                loadData(); 
                Swal.close(); 
            }
        });
    };

    // Hitung statistik
    const totalPenerima = data.length;
    const totalNominal = data.reduce((sum, d) => sum + (Number(d.Nominal) || 0), 0);
    const bansosByType = {};
    data.forEach(d => {
        const jenis = d.JenisBansos || 'Lainnya';
        bansosByType[jenis] = (bansosByType[jenis] || 0) + 1;
    });

    return (
        <div className="p-4 pb-10">
            <div className="flex justify-between items-center mb-4">
                <h2 className="text-xl font-bold text-gray-800">
                    <i className="fas fa-hand-holding-heart mr-2 text-red-500"></i> Bantuan Sosial (BANSOS)
                </h2>
                {canAdd && (
                    <button onClick={() => handleOpenForm()} className="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">
                        <i className="fas fa-plus mr-1"></i> Tambah Bansos
                    </button>
                )}
            </div>
            
            {/* Statistik Ringkasan */}
            <div className="grid grid-cols-3 gap-2 mb-4">
                <div className="bg-red-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-red-600">{totalPenerima}</div>
                    <div className="text-[10px] text-gray-500">Total Penerima</div>
                </div>
                <div className="bg-green-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-green-600">{formatRp(totalNominal)}</div>
                    <div className="text-[10px] text-gray-500">Total Bantuan</div>
                </div>
                <div className="bg-blue-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-blue-600">{Object.keys(bansosByType).length}</div>
                    <div className="text-[10px] text-gray-500">Jenis Bantuan</div>
                </div>
            </div>
            
            <SearchBar searchTerm={searchTerm} setSearchTerm={setSearchTerm} placeholder="Cari berdasarkan Nama, No KTP, atau Jenis Bansos..." />
            
            {loading ? <Loader /> : (
                <div className="space-y-4 mt-2">
                    {data.length === 0 ? (
                        <div className="text-center py-8 text-gray-400 bg-white rounded-2xl shadow-sm border border-gray-100">
                            <i className="fas fa-hand-holding-heart text-4xl mb-2 opacity-50 block"></i>
                            Belum ada data bantuan sosial
                        </div>
                    ) : (
                        data.map((row, idx) => {
                            const fotoUrl = getPhotoUrl(row.Foto);
                            return (
                                <div key={row.id || idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                                    <div className="flex gap-4 items-start">
                                        {/* Foto Penerima */}
                                        <div className="w-16 h-16 rounded-full overflow-hidden shrink-0 bg-gray-100 border border-gray-200 flex items-center justify-center">
                                            {fotoUrl ? (
                                                <img src={fotoUrl} className="w-full h-full object-cover" alt="Foto" />
                                            ) : (
                                                <i className="fas fa-user text-2xl text-gray-400"></i>
                                            )}
                                        </div>
                                        
                                        <div className="flex-1 min-w-0">
                                            <div className="flex justify-between items-start flex-wrap gap-1">
                                                <h3 className="font-bold text-base text-gray-800">{row.Nama}</h3>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                                    row.Status === 'Disalurkan' ? 'bg-green-100 text-green-700' : 
                                                    row.Status === 'Proses Verifikasi' ? 'bg-yellow-100 text-yellow-700' :
                                                    row.Status === 'Tunggu Jadwal' ? 'bg-blue-100 text-blue-700' :
                                                    'bg-red-100 text-red-700'
                                                }`}>
                                                    {row.Status}
                                                </span>
                                            </div>
                                            <p className="text-[10px] text-gray-400 mt-0.5">
                                                <i className="fas fa-id-card mr-1"></i> No KTP: {row.NoKTP ? row.NoKTP.substring(0,4) + '****' + row.NoKTP.substring(12) : '-'}
                                            </p>
                                            <div className="flex flex-wrap gap-3 mt-1 text-[10px] text-gray-500">
                                                <span className="bg-red-50 px-2 py-0.5 rounded-full">
                                                    <i className="fas fa-gift mr-1 text-red-500"></i> {row.JenisBansos}
                                                </span>
                                                <span>
                                                    <i className="fas fa-money-bill-wave mr-1 text-green-600"></i> {formatRp(row.Nominal)}
                                                </span>
                                                <span>
                                                    <i className="fas fa-calendar mr-1"></i> {row.TanggalPenerimaan}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-2 border-t border-gray-50 pt-3 mt-3">
                                        <button onClick={() => handleDetail(row)} className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg font-bold transition">
                                            <i className="fas fa-eye"></i> Detail
                                        </button>
                                        {canAdd && (
                                            <button onClick={() => handleOpenForm(row)} className="text-xs bg-yellow-50 hover:bg-yellow-100 text-yellow-600 px-3 py-1.5 rounded-lg font-bold transition">
                                                <i className="fas fa-edit"></i> Edit
                                            </button>
                                        )}
                                        {canDelete && (
                                            <button onClick={() => handleDelete(row.id)} className="text-xs bg-red-50 hover:bg-red-100 text-red-500 px-3 py-1.5 rounded-lg font-bold transition">
                                                <i className="fas fa-trash"></i> Hapus
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })
                    )}
                </div>
            )}
            
            {/* MODAL DETAIL */}
            <BottomSheet isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title="Detail Bantuan Sosial">
                {detailData && (
                    <div className="space-y-4">
                        {getPhotoUrl(detailData.Foto) && (
                            <div className="w-full bg-gray-100 rounded-xl overflow-hidden">
                                <img src={getPhotoUrl(detailData.Foto)} className="w-full h-64 object-contain bg-white" alt="Foto Penerima" />
                            </div>
                        )}
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-gray-50 p-3 rounded-lg col-span-2">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Nama Penerima</p>
                                <p className="text-sm font-medium">{detailData.Nama || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">No KTP</p>
                                <p className="text-sm font-medium font-mono">{detailData.NoKTP || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Jenis Bansos</p>
                                <p className="text-sm font-medium">{detailData.JenisBansos || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Nominal</p>
                                <p className="text-sm font-medium text-green-600">{formatRp(detailData.Nominal)}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Tanggal Penerimaan</p>
                                <p className="text-sm font-medium">{detailData.TanggalPenerimaan || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Status</p>
                                <p className="text-sm font-medium">{detailData.Status || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg col-span-2">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Keterangan</p>
                                <p className="text-sm font-medium">{detailData.Keterangan || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg col-span-2">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Diinput Oleh</p>
                                <p className="text-sm font-medium">{detailData.InputBy || '-'}</p>
                            </div>
                        </div>
                        {canAdd && (
                            <button onClick={() => { setIsDetailOpen(false); handleOpenForm(detailData); }} 
                                    className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl mt-4 flex justify-center items-center gap-2 shadow-md">
                                <i className="fas fa-edit"></i> Edit Data Ini
                            </button>
                        )}
                    </div>
                )}
            </BottomSheet>

            {/* MODAL FORM TAMBAH/EDIT BANSOS */}
            {canAdd && (
                <BottomSheet isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={`${editId ? 'Edit' : 'Tambah'} Bantuan Sosial`}>
                    <form onSubmit={handleSubmit} className="space-y-4 max-h-[70vh] overflow-y-auto pr-2">
                        {/* Foto Penerima */}
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-2">
                                <i className="fas fa-user mr-2 text-blue-500"></i> Foto Penerima
                            </label>
                            <div className="flex flex-col items-center gap-3 p-4 border-2 border-dashed border-blue-300 rounded-xl bg-blue-50">
                                {imagePreview ? (
                                    <div className="relative">
                                        <div className="w-28 h-28 rounded-full overflow-hidden border-2 border-white shadow-md bg-white">
                                            <img src={imagePreview} className="w-full h-full object-cover" alt="Preview" />
                                        </div>
                                        <button 
                                            type="button" 
                                            onClick={() => { setFormData({...formData, Foto: ''}); setImagePreview(null); }} 
                                            className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-xs"
                                        >
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <label className="cursor-pointer text-center w-full">
                                        <div className="w-28 h-28 rounded-full bg-gray-200 flex items-center justify-center mx-auto mb-2 hover:bg-gray-300 transition">
                                            <i className="fas fa-camera text-3xl text-gray-500"></i>
                                        </div>
                                        <span className="text-sm text-blue-600 font-medium">Upload Foto</span>
                                        <p className="text-[10px] text-gray-400 mt-1">Format: JPG, PNG. Maks 2MB</p>
                                        <input 
                                            type="file" 
                                            accept="image/jpeg,image/png,image/jpg" 
                                            className="hidden" 
                                            onChange={e => { const file = e.target.files[0]; if(file) handleFileChange('Foto', file); }} 
                                        />
                                    </label>
                                )}
                            </div>
                        </div>
                        
                        {/* No KTP dengan Auto Complete */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">
                                No KTP <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-id-card text-gray-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    placeholder="16 digit No KTP"
                                    value={formData.NoKTP}
                                    onChange={e => handleNoKTPChange(e.target.value)}
                                    maxLength="16"
                                    required
                                />
                            </div>
                            {showWargaDropdown && filteredWarga.length > 0 && (
                                <div className="absolute z-10 w-full mt-1 bg-white border rounded-xl shadow-lg max-h-48 overflow-y-auto">
                                    {filteredWarga.map((w, idx) => (
                                        <div 
                                            key={idx} 
                                            className="px-4 py-2 hover:bg-blue-50 cursor-pointer border-b last:border-b-0"
                                            onClick={() => selectWarga(w)}
                                        >
                                            <p className="text-sm font-medium">{w.Nama}</p>
                                            <p className="text-[10px] text-gray-400">No KTP: {w.NoKTP}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <p className="text-[10px] text-blue-500 mt-1">Ketik No KTP untuk otomatis mengisi nama</p>
                        </div>
                        
                        {/* Nama Penerima */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">
                                Nama Penerima <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-user text-gray-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    placeholder="Nama lengkap penerima"
                                    value={formData.Nama}
                                    onChange={e => setFormData({...formData, Nama: e.target.value})}
                                    required
                                />
                            </div>
                        </div>
                        
                        {/* Jenis Bansos */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">
                                Jenis Bansos <span className="text-red-500">*</span>
                            </label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-gift text-gray-400"></i>
                                </div>
                                <select 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    value={formData.JenisBansos}
                                    onChange={e => setFormData({...formData, JenisBansos: e.target.value})}
                                    required
                                >
                                    <option value="">Pilih Jenis Bansos</option>
                                    {jenisBansosOptions.map(opt => (
                                        <option key={opt} value={opt}>{opt}</option>
                                    ))}
                                </select>
                            </div>
                        </div>
                        
                        {/* Nominal dan Tanggal */}
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Nominal (Rp)</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i className="fas fa-money-bill-wave text-gray-400"></i>
                                    </div>
                                    <input 
                                        type="number" 
                                        className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                        placeholder="Contoh: 500000"
                                        value={formData.Nominal}
                                        onChange={e => setFormData({...formData, Nominal: e.target.value})}
                                    />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Tanggal Penerimaan</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i className="fas fa-calendar-alt text-gray-400"></i>
                                    </div>
                                    <input 
                                        type="date" 
                                        className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                        value={formData.TanggalPenerimaan}
                                        onChange={e => setFormData({...formData, TanggalPenerimaan: e.target.value})}
                                        required
                                    />
                                </div>
                            </div>
                        </div>
                        
                        {/* Status */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Status</label>
                            <div className="relative">
