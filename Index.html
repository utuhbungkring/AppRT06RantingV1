                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-chart-line text-gray-400"></i>
                                </div>
                                <select 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    value={formData.Status}
                                    onChange={e => setFormData({...formData, Status: e.target.value})}
                                >
                                    {statusOptions.map(opt => (
                                        <option key={opt} value={opt}>{opt}</option>
                                    ))}
                                </select>
                            </div>
                        </div>
                        
                        {/* Keterangan */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Keterangan</label>
                            <div className="relative">
                                <div className="absolute top-3 left-3 pointer-events-none">
                                    <i className="fas fa-pen text-gray-400"></i>
                                </div>
                                <textarea 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm h-20"
                                    placeholder="Informasi tambahan..."
                                    value={formData.Keterangan}
                                    onChange={e => setFormData({...formData, Keterangan: e.target.value})}
                                />
                            </div>
                        </div>
                        
                        <button 
                            type="submit" 
                            disabled={submitting} 
                            className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl mt-2 transition shadow-md"
                        >
                            {submitting ? <><i className="fas fa-spinner fa-spin mr-2"></i> Menyimpan...</> : 'Simpan Data Bansos'}
                        </button>
                    </form>
                </BottomSheet>
            )}
        </div>
    );
};
    // ==========================================
// INVENTARIS VIEW (DENGAN JUMLAH BARANG)
// ==========================================
const InventarisView = ({ user }) => {
    const [data, setData] = useState([]);
    const [loading, setLoading] = useState(true);
    const [isFormOpen, setIsFormOpen] = useState(false);
    const [isDetailOpen, setIsDetailOpen] = useState(false);
    const [formData, setFormData] = useState({ 
        NoInventaris: '', 
        NamaBarang: '', 
        JenisBarang: '', 
        Jumlah: '1',  // TAMBAHKAN FIELD JUMLAH
        Satuan: 'Unit', // TAMBAHKAN FIELD SATUAN
        TahunPerolehan: new Date().getFullYear(), 
        HargaPembelian: '', 
        KeteranganAsal: 'Pembelian', 
        Foto: '', 
        Kondisi: 'Baik', 
        Lokasi: '' 
    });
    const [detailData, setDetailData] = useState(null);
    const [editId, setEditId] = useState(null);
    const [submitting, setSubmitting] = useState(false);
    const [searchTerm, setSearchTerm] = useState('');
    const [imagePreview, setImagePreview] = useState(null);
    const isAdmin = user && user.role === 'Pengurus';
    const canAdd = isAdmin;
    const canDelete = isAdmin;

    // Opsi satuan
    const satuanOptions = ['Unit', 'Buah', 'Set', 'Pasang', 'Lembar', 'Kg', 'Meter', 'Liter', 'Paket', 'Lainnya'];

    const getPhotoUrl = (url) => {
        if (url && typeof url === 'string') {
            if (url.startsWith('http://') || url.startsWith('https://')) {
                if (url.includes('drive.google.com')) {
                    const match = url.match(/(?:\/d\/|id=)([-\w]{25,})/);
                    if (match && match[1]) return `https://drive.google.com/thumbnail?sz=w800&id=${match[1]}`;
                }
                return url;
            }
        }
        return null;
    };

    const jenisBarangOptions = ['Elektronik', 'Perabotan', 'Kendaraan', 'Alat Tulis Kantor', 'Perlengkapan Acara', 'Bangunan', 'Lainnya'];
    const keteranganAsalOptions = ['Pembelian', 'Sumbangan', 'Hibah', 'Wakaf', 'Donasi', 'Bantuan Pemerintah'];
    const kondisiOptions = ['Baik', 'Rusak Ringan', 'Rusak Berat', 'Perlu Perbaikan', 'Dihapuskan'];

    useEffect(() => { loadData(); }, []);
    
    const loadData = async () => { 
        setLoading(true); 
        const res = await callAPI('read', { sheetName: 'Inventaris' }); 
        if(res.status === 'success') { 
            const sortedData = res.data.sort((a, b) => b.id.localeCompare(a.id)); 
            setData(sortedData); 
        } 
        setLoading(false); 
    };

    const handleOpenForm = (row = null) => { 
        setImagePreview(null);
        if (row && row.id) {
            setFormData({ 
                NoInventaris: row.NoInventaris || '', 
                NamaBarang: row.NamaBarang || '', 
                JenisBarang: row.JenisBarang || '', 
                Jumlah: row.Jumlah || '1',
                Satuan: row.Satuan || 'Unit',
                TahunPerolehan: row.TahunPerolehan || new Date().getFullYear(), 
                HargaPembelian: row.HargaPembelian || '', 
                KeteranganAsal: row.KeteranganAsal || 'Pembelian', 
                Foto: row.Foto || '', 
                Kondisi: row.Kondisi || 'Baik', 
                Lokasi: row.Lokasi || '' 
            });
            setEditId(row.id);
            if (row.Foto && row.Foto.startsWith('http')) setImagePreview(row.Foto);
        } else { 
            const tahun = new Date().getFullYear();
            const nextNumber = String(data.length + 1).padStart(4, '0');
            setFormData({ 
                NoInventaris: `INV/${tahun}/${nextNumber}`, 
                NamaBarang: '', 
                JenisBarang: '', 
                Jumlah: '1',
                Satuan: 'Unit',
                TahunPerolehan: new Date().getFullYear(), 
                HargaPembelian: '', 
                KeteranganAsal: 'Pembelian', 
                Foto: '', 
                Kondisi: 'Baik', 
                Lokasi: '' 
            });
            setEditId(null);
        }
        setIsFormOpen(true); 
    };

    const handleDetail = (row) => { setDetailData(row); setIsDetailOpen(true); };
    
    const handleFileChange = (file) => { 
        if (file) { 
            if (file.size > 2 * 1024 * 1024) {
                Swal.fire({ icon: 'warning', title: 'Ukuran file terlalu besar', text: 'Maksimal ukuran file adalah 2MB!' });
                return;
            }
            const reader = new FileReader(); 
            reader.onloadend = () => { 
                const img = new Image(); 
                img.onload = () => { 
                    let width = img.width, height = img.height; 
                    const maxSize = 800; 
                    if (width > maxSize || height > maxSize) { 
                        if (width > height) { 
                            height = (height * maxSize) / width; 
                            width = maxSize; 
                        } else { 
                            width = (width * maxSize) / height; 
                            height = maxSize; 
                        } 
                    } 
                    const canvas = document.createElement('canvas'); 
                    canvas.width = width; 
                    canvas.height = height; 
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(img, 0, 0, width, height); 
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7); 
                    setFormData({...formData, Foto: compressedDataUrl}); 
                    setImagePreview(compressedDataUrl); 
                }; 
                img.src = reader.result; 
            }; 
            reader.readAsDataURL(file); 
        } 
    };

    const handleSubmit = async (e) => { 
        e.preventDefault(); 
        
        // Validasi Jumlah
        if (formData.Jumlah && (parseInt(formData.Jumlah) <= 0 || isNaN(parseInt(formData.Jumlah)))) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Jumlah barang harus lebih dari 0!' });
            return;
        }
        
        setSubmitting(true); 
        const dataToSend = { 
            ...formData, 
            TanggalInput: editId ? formData.TanggalInput : new Date().toLocaleDateString('id-ID'),
            HargaPembelian: Number(formData.HargaPembelian) || 0,
            Jumlah: Number(formData.Jumlah) || 1
        }; 
        let res; 
        if (editId) res = await callAPI('update', { sheetName: 'Inventaris', id: editId, data: dataToSend }); 
        else res = await callAPI('create', { sheetName: 'Inventaris', data: dataToSend }); 
        setSubmitting(false); 
        if(res.status === 'success') { 
            setIsFormOpen(false); 
            setEditId(null); 
            setImagePreview(null); 
            Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false }); 
            loadData(); 
        } else { 
            Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); 
        } 
    };

    const handleDelete = (id) => { 
        Swal.fire({ title: 'Hapus Inventaris?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya' }).then(async (result) => { 
            if (result.isConfirmed) { 
                Swal.fire({title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); 
                await callAPI('delete', { sheetName: 'Inventaris', id: id }); 
                loadData(); 
                Swal.close(); 
            } 
        }); 
    };

    const filteredData = data.filter(row => { 
        if (!searchTerm) return true; 
        const searchLower = searchTerm.toLowerCase(); 
        return (row.NoInventaris || '').toLowerCase().includes(searchLower) || 
               (row.NamaBarang || '').toLowerCase().includes(searchLower) || 
               (row.JenisBarang || '').toLowerCase().includes(searchLower) || 
               (row.Lokasi || '').toLowerCase().includes(searchLower); 
    });

    const getKondisiBadge = (kondisi) => { 
        switch(kondisi) { 
            case 'Baik': return 'bg-green-100 text-green-700'; 
            case 'Rusak Ringan': return 'bg-yellow-100 text-yellow-700'; 
            case 'Rusak Berat': return 'bg-red-100 text-red-700'; 
            case 'Perlu Perbaikan': return 'bg-orange-100 text-orange-700'; 
            default: return 'bg-gray-100 text-gray-700'; 
        } 
    };

    // Hitung total nilai inventaris (Harga x Jumlah)
    const totalNilai = data.reduce((sum, d) => sum + ((Number(d.HargaPembelian) || 0) * (Number(d.Jumlah) || 1)), 0);
    const totalBarang = data.reduce((sum, d) => sum + (Number(d.Jumlah) || 1), 0);

    return (
        <div className="p-4 pb-10">
            <div className="flex justify-between items-center mb-4">
                <h2 className="text-xl font-bold text-gray-800">
                    <i className="fas fa-boxes mr-2 text-blue-500"></i> Inventaris RT
                </h2>
                {canAdd && (
                    <button onClick={() => handleOpenForm()} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">
                        <i className="fas fa-plus mr-1"></i> Tambah Barang
                    </button>
                )}
            </div>
            
            {/* Statistik Ringkasan dengan Total Barang */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-4">
                <div className="bg-blue-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-blue-600">{data.length}</div>
                    <div className="text-[10px] text-gray-500">Jenis Barang</div>
                </div>
                <div className="bg-indigo-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-indigo-600">{totalBarang}</div>
                    <div className="text-[10px] text-gray-500">Total Barang</div>
                </div>
                <div className="bg-green-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-green-600">

            <SearchBar searchTerm={searchTerm} setSearchTerm={setSearchTerm} placeholder="Cari berdasarkan No Inventaris, Nama Barang, atau Lokasi..." />
            
            {loading ? <Loader /> : (
                <div className="space-y-4 mt-2">

            {/* MODAL DETAIL - Tambahkan Jumlah dan Satuan */}

                                        className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                        placeholder="Contoh: 2024"
                                        value={formData.TahunPerolehan}
                                        onChange={e => setFormData({...formData, TahunPerolehan: e.target.value})}

                                    </div>
                                    <input 
                                        type="number" 
                                        className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                        placeholder="Contoh: 5000000"

                                {formData.Jumlah && formData.HargaPembelian && (

                        {/* Keterangan Asal */}

                                    required

                        {/* Kondisi */}

                                    <i className="fas fa-clipboard-list text-gray-400"></i>

                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    value={formData.Kondisi}

                                    {kondisiOptions.map(opt => (
                                        <option key={opt} value={opt}>{opt}</option>

                        </div>
                        
                        {/* Lokasi */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Lokasi Penyimpanan</label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-map-marker-alt text-gray-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    placeholder="Contoh: Gudang RT, Ruang Serbaguna, dll"
                                    value={formData.Lokasi}
                                    onChange={e => setFormData({...formData, Lokasi: e.target.value})}
                                />
                            </div>
                        </div>
                        
                        {/* Upload Foto */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Foto Barang (Opsional)</label>
                            <div className="flex flex-col gap-3 p-4 border-2 border-dashed rounded-xl bg-gray-50 items-center justify-center">
                                {imagePreview ? (
                                    <div className="relative">
                                        <img src={imagePreview} className="w-32 h-32 object-cover rounded-xl border-2 border-white shadow-md" alt="Preview" />
                                        <button 
                                            type="button" 
                                            onClick={() => { setFormData({...formData, Foto: ''}); setImagePreview(null); }} 
                                            className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-xs"
                                        >

                                        <span className="text-sm text-gray-500">Klik untuk upload foto</span>
                                        <p className="text-[10px] text-gray-400 mt-1">Format: JPG, PNG. Maks 2MB</p>
                                        <input 
                                            type="file" 
                                            accept="image/jpeg,image/png,image/jpg"

                                            onChange={e => { const file = e.target.files[0]; if(file) { handleFileChange(file); } }} 
                                        />
                                    </label>
                                )}
                            </div>
                        </div>
                        
                        <button 
                            type="submit" 
                            disabled={submitting} 
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl mt-2 transition shadow-md"
                        >
                            {submitting ? <><i className="fas fa-spinner fa-spin mr-2"></i> Menyimpan...</> : 'Simpan Inventaris'}
                        </button>
                    </form>
                </BottomSheet>
            )}
        </div>
    );
};

// ==========================================
// DATA WARGA VIEW (TANPA NO KTP, ALAMAT, NO HP DI LIST)
// HANYA MENAMPILKAN 10 DATA TERBARU
// ==========================================
const DataWargaView = ({ user }) => {
    const [data, setData] = useState([]);
    const [allData, setAllData] = useState([]);
    const [loading, setLoading] = useState(true);
    const [isFormOpen, setIsFormOpen] = useState(false);
    const [isDetailOpen, setIsDetailOpen] = useState(false);
    const [formData, setFormData] = useState({
        NoKK: '',
        Nama: '',
        NoKTP: '',
        Alamat: '',
        NoHP: '',
        Foto: '',
        FotoRumah: ''
    });
    const [detailData, setDetailData] = useState(null);
    const [editId, setEditId] = useState(null);
    const [submitting, setSubmitting] = useState(false);
    const [searchTerm, setSearchTerm] = useState('');
    const [searchType, setSearchType] = useState('nama');
    const [previewFoto, setPreviewFoto] = useState(null);
    const [previewFotoRumah, setPreviewFotoRumah] = useState(null);
    const [familyMembers, setFamilyMembers] = useState([]);
    const [showFamilyModal, setShowFamilyModal] = useState(false);
    const [selectedKK, setSelectedKK] = useState('');

    const isAdmin = user && user.role === 'Pengurus';
    const canAdd = isAdmin;
    const canDelete = isAdmin;

    const getPhotoUrl = (url) => {
        if (url && typeof url === 'string') {
            if (url.startsWith('http://') || url.startsWith('https://')) {
                if (url.includes('drive.google.com')) {
                    const match = url.match(/(?:\/d\/|id=)([-\w]{25,})/);
                    if (match && match[1]) return `https://drive.google.com/thumbnail?sz=w800&id=${match[1]}`;
                }
                return url;
            }
        }
        return null;
    };

    useEffect(() => { loadData(); }, []);

    const loadData = async () => { 
        setLoading(true); 
        const res = await callAPI('read', { sheetName: 'Warga' }); 
        if(res.status === 'success') {
            const sorted = res.data.sort((a, b) => b.id.localeCompare(a.id));
            setAllData(sorted);
            setData(sorted.slice(0, 10)); // HANYA 10 DATA TERBARU
        }
        setLoading(false); 
    };

    const handleSearch = (term) => {
        setSearchTerm(term);
        if (!term.trim()) {
            setData(allData.slice(0, 10));
            setFamilyMembers([]);
            setShowFamilyModal(false);
            return;
        }
        
        const searchLower = term.toLowerCase();
        let filtered = [];
        
        if (searchType === 'nokk') {
            filtered = allData.filter(row => 
                row.NoKK && row.NoKK.toLowerCase().includes(searchLower)
            );
            if (filtered.length > 0 && filtered[0].NoKK) {
                const kkNumber = filtered[0].NoKK;
                const allFamily = allData.filter(w => w.NoKK === kkNumber);
                setFamilyMembers(allFamily);
                setSelectedKK(kkNumber);
                setShowFamilyModal(true);
                setData(allFamily);
                return;
            }
        } else if (searchType === 'noktp') {
            filtered = allData.filter(row => 
                row.NoKTP && row.NoKTP.toLowerCase().includes(searchLower)
            );
        } else {
            filtered = allData.filter(row => 
                (row.Nama && row.Nama.toLowerCase().includes(searchLower)) ||
                (row.NoKK && row.NoKK.toLowerCase().includes(searchLower)) ||
                (row.NoKTP && row.NoKTP.toLowerCase().includes(searchLower))
            );
        }
        
        setData(filtered);
        setFamilyMembers([]);
        setShowFamilyModal(false);
    };

    const handleOpenForm = (row = null) => { 
        setPreviewFoto(null);
        setPreviewFotoRumah(null);
        if (row && row.id) {
            setFormData({
                NoKK: row.NoKK || '',
                Nama: row.Nama || '',
                NoKTP: row.NoKTP || '',
                Alamat: row.Alamat || '',
                NoHP: row.NoHP || '',
                Foto: row.Foto || '',
                FotoRumah: row.FotoRumah || ''
            });
            setEditId(row.id);
            if (row.Foto && row.Foto.startsWith('http')) setPreviewFoto(row.Foto);
            if (row.FotoRumah && row.FotoRumah.startsWith('http')) setPreviewFotoRumah(row.FotoRumah);
        } else {
            setFormData({
                NoKK: '',
                Nama: '',
                NoKTP: '',
                Alamat: '',
                NoHP: '',
                Foto: '',
                FotoRumah: ''
            });
            setEditId(null);
        }
        setIsFormOpen(true); 
    };

    const handleDetail = (row) => { 
        if (row.NoKK) {
            const family = allData.filter(w => w.NoKK === row.NoKK && w.id !== row.id);
            setFamilyMembers(family);
        } else {
            setFamilyMembers([]);
        }
        setDetailData(row); 
        setIsDetailOpen(true); 
    };

    const handleFileChange = (field, file) => {
        if (file) {
            if (file.size > 2 * 1024 * 1024) {
                Swal.fire({ icon: 'warning', title: 'Ukuran file terlalu besar', text: 'Maksimal ukuran file adalah 2MB!' });
                return;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    let width = img.width, height = img.height;
                    const maxSize = 800;
                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = (height * maxSize) / width;
                            width = maxSize;
                        } else {
                            width = (width * maxSize) / height;
                            height = maxSize;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    setFormData({...formData, [field]: compressedDataUrl});
                    if (field === 'Foto') setPreviewFoto(compressedDataUrl);
                    if (field === 'FotoRumah') setPreviewFotoRumah(compressedDataUrl);
                    Swal.fire({ icon: 'success', title: 'Foto berhasil diupload', timer: 1500, showConfirmButton: false });
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }
    };

    const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.Nama) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Nama wajib diisi!' });
            return;
        }
        setSubmitting(true);
        let res;
        if (editId) { 
            res = await callAPI('update', { sheetName: 'Warga', id: editId, data: formData });
        } else { 
            res = await callAPI('create', { sheetName: 'Warga', data: formData });
        }
        setSubmitting(false);
        if(res.status === 'success') { 
            setIsFormOpen(false); 
            setEditId(null); 
            setPreviewFoto(null);
            setPreviewFotoRumah(null);
            Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false }); 
            loadData(); 
        } else { 
            Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); 
        }
    };

    const handleDelete = (id) => {
        Swal.fire({ title: 'Hapus Data Warga?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya' }).then(async (result) => {
            if (result.isConfirmed) { 
                Swal.fire({title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading()}); 
                await callAPI('delete', { sheetName: 'Warga', id: id }); 
                loadData(); 
                Swal.close(); 
            }
        });
    };

    const formatNoKTP = (noKTP) => {
        if (!noKTP) return '-';
        if (noKTP.length === 16) {
            return noKTP.substring(0, 4) + ' **** **** ' + noKTP.substring(noKTP.length - 4);
        }
        return noKTP;
    };

    return (
        <div className="p-4 pb-10">
            {/* Header */}
            <div className="flex justify-between items-center mb-4">
                <h2 className="text-xl font-bold text-gray-800">
                    <i className="fas fa-users mr-2 text-green-500"></i> Data Warga
                </h2>
                {canAdd && (
                    <button onClick={() => handleOpenForm()} className="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">
                        <i className="fas fa-plus mr-1"></i> Tambah Warga
                    </button>
                )}
            </div>
            
            {/* Info Limit - 10 data terbaru */}
            {!searchTerm && (
                <div className="mb-3 px-3 py-2 bg-blue-50 rounded-lg text-xs text-blue-600">
                    <i className="fas fa-info-circle mr-1"></i>
                    Menampilkan 10 data warga terbaru. Gunakan pencarian untuk melihat semua data.
                </div>
            )}
            
            {/* Search Bar */}
            <div className="mb-4">
                <div className="flex gap-2 mb-2">
                    <button onClick={() => setSearchType('nama')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${searchType === 'nama' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`}>
                        <i className="fas fa-user mr-1"></i> Nama
                    </button>
                    <button onClick={() => setSearchType('noktp')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${searchType === 'noktp' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`}>
                        <i className="fas fa-id-card mr-1"></i> No KTP
                    </button>
                    <button onClick={() => setSearchType('nokk')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${searchType === 'nokk' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`}>
                        <i className="fas fa-address-card mr-1"></i> No KK
                    </button>
                </div>
                <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i className="fas fa-search text-gray-400"></i>
                    </div>
                    <input 
                        type="text" 
                        className="block w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 sm:text-sm shadow-sm" 
                        placeholder={searchType === 'nama' ? "Cari berdasarkan Nama..." : searchType === 'noktp' ? "Cari berdasarkan No KTP..." : "Cari berdasarkan No KK..."}
                        value={searchTerm} 
                        onChange={(e) => handleSearch(e.target.value)} 
                    />
                    {searchTerm && (
                        <button onClick={() => handleSearch('')} className="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i className="fas fa-times-circle text-gray-400 hover:text-gray-600"></i>
                        </button>
                    )}
                </div>
            </div>
            
            {/* LIST DATA - TANPA NO KTP, ALAMAT, NO HP */}
            {loading ? <Loader /> : (
                <div className="space-y-4 mt-2">
                    {data.length === 0 ? (
                        <div className="text-center py-8 text-gray-400 bg-white rounded-2xl shadow-sm border border-gray-100">
                            <i className="fas fa-users-slash text-4xl mb-2 opacity-50 block"></i>
                            {searchTerm ? 'Data tidak ditemukan' : 'Belum ada data warga'}
                        </div>
                    ) : (
                        data.map((row, idx) => (
                            <div key={row.id || idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                                <div>
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="font-bold text-base text-gray-800">{row.Nama}</h3>
                                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-100 text-blue-600">
                                            {row.NoKK ? 'KK: ' + row.NoKK.substring(0, 4) + '****' + row.NoKK.substring(row.NoKK.length - 4) : 'No KK'}
                                        </span>
                                    </div>
                                    {/* No KTP, Alamat, No HP TIDAK DITAMPILKAN DI LIST */}
                                </div>
                                <div className="flex justify-end gap-2 border-t border-gray-50 pt-3 mt-3">
                                    <button onClick={() => handleDetail(row)} className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg font-bold transition">
                                        <i className="fas fa-eye"></i> Detail
                                    </button>
                                    {canAdd && (
                                        <button onClick={() => handleOpenForm(row)} className="text-xs bg-yellow-50 hover:bg-yellow-100 text-yellow-600 px-3 py-1.5 rounded-lg font-bold transition">
                                            <i className="fas fa-edit"></i> Edit
                                        </button>
                                    )}
                                    {canDelete && (
                                        <button onClick={() => handleDelete(row.id)} className="text-xs bg-red-50 hover:bg-red-100 text-red-500 px-3 py-1.5 rounded-lg font-bold transition">
                                            <i className="fas fa-trash"></i> Hapus
                                        </button>
                                    )}
                                </div>
                            </div>
                        ))
                    )}
                    {searchTerm && allData.length > 0 && (
                        <div className="text-center text-xs text-gray-400 py-2">
                            Menampilkan {data.length} dari {allData.length} data
                            <button onClick={() => handleSearch('')} className="ml-2 text-green-500 hover:underline">Reset</button>
                        </div>
                    )}
                </div>
            )}
            
            {/* MODAL DETAIL (tetap menampilkan semua info) */}
            <BottomSheet isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title="Detail Data Warga">
                {detailData && (
                    <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
                            <div className="text-center">
                                <p className="text-[10px] font-bold text-blue-600 mb-2">Foto Profil</p>
                                <div className="w-32 h-32 rounded-full overflow-hidden mx-auto bg-gray-100 border-2 border-blue-200 flex items-center justify-center">
                                    {getPhotoUrl(detailData.Foto) ? <img src={getPhotoUrl(detailData.Foto)} className="w-full h-full object-cover" alt="Foto Profil" /> : <i className="fas fa-user text-5xl text-gray-400"></i>}
                                </div>
                            </div>
                            <div className="text-center">
                                <p className="text-[10px] font-bold text-green-600 mb-2">Foto Rumah</p>
                                <div className="w-32 h-32 rounded-xl overflow-hidden mx-auto bg-gray-100 border-2 border-green-200 flex items-center justify-center">
                                    {getPhotoUrl(detailData.FotoRumah) ? <img src={getPhotoUrl(detailData.FotoRumah)} className="w-full h-full object-cover" alt="Foto Rumah" /> : <i className="fas fa-home text-5xl text-gray-400"></i>}
                                </div>
                            </div>
                        </div>
                        <div className="space-y-3">
                            <div className="bg-blue-50 p-3 rounded-lg">
                                <p className="text-[10px] text-blue-600 font-bold uppercase">No Kartu Keluarga</p>
                                <p className="text-sm text-gray-800 font-medium font-mono">{detailData.NoKK || '-'}</p>
                            </div>
                            <div className="bg-blue-50 p-3 rounded-lg">
                                <p className="text-[10px] text-blue-600 font-bold uppercase">NAMA LENGKAP</p>
                                <p className="text-sm text-gray-800 font-medium">{detailData.Nama || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-500 font-bold uppercase">NO KTP</p>
                                <p className="text-sm text-gray-800 font-medium font-mono">{detailData.NoKTP || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-500 font-bold uppercase">ALAMAT</p>
                                <p className="text-sm text-gray-800 font-medium">{detailData.Alamat || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-500 font-bold uppercase">NO HP / WHATSAPP</p>
                                <p className="text-sm text-gray-800 font-medium">{detailData.NoHP || '-'}</p>
                            </div>
                        </div>
                        {familyMembers.length > 0 && (
                            <div className="mt-4">
                                <div className="bg-orange-50 p-3 rounded-lg mb-3">
                                    <p className="text-[10px] font-bold text-orange-600 uppercase">Anggota Keluarga Lainnya (KK: {detailData.NoKK})</p>
                                </div>
                                <div className="space-y-2">
                                    {familyMembers.map((member, idx) => (
                                        <div key={idx} className="bg-gray-50 p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                                            <div>
                                                <p className="text-sm font-medium text-gray-800">{member.Nama}</p>
                                                <p className="text-[10px] text-gray-500">No KTP: {formatNoKTP(member.NoKTP)}</p>
                                            </div>
                                            <button onClick={() => { setDetailData(member); setFamilyMembers(allData.filter(w => w.NoKK === member.NoKK && w.id !== member.id)); }} className="text-xs bg-blue-500 text-white px-2 py-1 rounded">Lihat</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {canAdd && (
                            <button onClick={() => { setIsDetailOpen(false); handleOpenForm(detailData); }} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl mt-4 flex justify-center items-center gap-2 shadow-md">
                                <i className="fas fa-edit"></i> Edit Data Warga
                            </button>
                        )}
                    </div>
                )}
            </BottomSheet>

            {/* Modal Anggota Keluarga */}
            <BottomSheet isOpen={showFamilyModal} onClose={() => { setShowFamilyModal(false); setFamilyMembers([]); handleSearch(''); }} title={`Anggota Keluarga - KK: ${selectedKK}`}>
                <div className="space-y-3">
                    <div className="bg-green-50 p-3 rounded-lg mb-2">
                        <p className="text-xs text-green-700"><i className="fas fa-info-circle mr-1"></i> Berikut adalah semua anggota keluarga dengan Kartu Keluarga yang sama:</p>
                    </div>
                    {familyMembers.map((member, idx) => (
                        <div key={idx} className="bg-white p-3 rounded-lg border border-gray-200 hover:shadow-md transition">
                            <p className="font-bold text-gray-800">{member.Nama}</p>
                            <p className="text-[10px] text-gray-500 mt-1"><i className="fas fa-id-card mr-1"></i> No KTP: {formatNoKTP(member.NoKTP)}</p>
                            <p className="text-[10px] text-gray-500"><i className="fas fa-map-marker-alt mr-1"></i> {member.Alamat || '-'}</p>
                            <button onClick={() => { setShowFamilyModal(false); handleDetail(member); }} className="mt-2 text-xs bg-blue-500 text-white px-3 py-1 rounded-lg">Lihat Detail</button>
                        </div>
                    ))}
                </div>
            </BottomSheet>

            {/* MODAL FORM TAMBAH/EDIT WARGA (sama seperti sebelumnya) */}
            {canAdd && (
                <BottomSheet isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={`${editId ? 'Edit' : 'Tambah'} Data Warga`}>
                    <form onSubmit={handleSubmit} className="space-y-4 max-h-[70vh] overflow-y-auto pr-2">
                        <div><label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">No Kartu Keluarga <span className="text-red-500">*</span></label><input type="text" className="w-full p-3 border rounded-xl text-sm" placeholder="16 digit No Kartu Keluarga" value={formData.NoKK} onChange={e => setFormData({...formData, NoKK: e.target.value.substring(0, 16)})} maxLength="16" required /><p className="text-[10px] text-blue-500 mt-1">Masukkan No KK untuk mengelompokkan anggota keluarga</p></div>
                        <div><label className="block text-sm font-bold text-gray-700 mb-2">Foto Profil</label><div className="flex flex-col items-center gap-3 p-4 border-2 border-dashed border-blue-300 rounded-xl bg-blue-50">{previewFoto ? (<div className="relative"><div className="w-28 h-28 rounded-full overflow-hidden border-2 border-white shadow-md bg-white"><img src={previewFoto} className="w-full h-full object-cover" alt="Preview Profil" /></div><button type="button" onClick={() => { setFormData({...formData, Foto: ''}); setPreviewFoto(null); }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-xs"><i className="fas fa-times"></i></button></div>) : (<label className="cursor-pointer text-center w-full"><div className="w-28 h-28 rounded-full bg-gray-200 flex items-center justify-center mx-auto mb-2"><i className="fas fa-camera text-3xl text-gray-500"></i></div><span className="text-sm text-blue-600 font-medium">Klik untuk upload foto</span><p className="text-[10px] text-gray-400 mt-1">Format: JPG, PNG. Maks 2MB</p><input type="file" accept="image/jpeg,image/png,image/jpg" className="hidden" onChange={e => { const file = e.target.files[0]; if(file) handleFileChange('Foto', file); }} /></label>)}</div></div>
                        <div><label className="block text-sm font-bold text-gray-700 mb-2">Foto Rumah</label><div className="flex flex-col items-center gap-3 p-4 border-2 border-dashed border-green-300 rounded-xl bg-green-50">{previewFotoRumah ? (<div className="relative"><img src={previewFotoRumah} className="w-32 h-32 object-cover rounded-xl border-2 border-white shadow-md" alt="Preview Rumah" /><button type="button" onClick={() => { setFormData({...formData, FotoRumah: ''}); setPreviewFotoRumah(null); }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-xs"><i className="fas fa-times"></i></button></div>) : (<label className="cursor-pointer text-center w-full"><div className="w-28 h-28 rounded-xl bg-gray-200 flex items-center justify-center mx-auto mb-2"><i className="fas fa-camera text-3xl text-gray-500"></i></div><span className="text-sm text-green-600 font-medium">Klik untuk upload foto</span><p className="text-[10px] text-gray-400 mt-1">Format: JPG, PNG. Maks 2MB</p><input type="file" accept="image/jpeg,image/png,image/jpg" className="hidden" onChange={e => { const file = e.target.files[0]; if(file) handleFileChange('FotoRumah', file); }} /></label>)}</div></div>
                        <div><label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Nama Lengkap <span className="text-red-500">*</span></label><input type="text" className="w-full p-3 border rounded-xl text-sm" placeholder="Masukkan nama lengkap" value={formData.Nama} onChange={e => setFormData({...formData, Nama: e.target.value})} required /></div>
                        <div><label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">No KTP <span className="text-red-500">*</span></label><input type="text" className="w-full p-3 border rounded-xl text-sm bg-blue-50" placeholder="16 digit No KTP" value={formData.NoKTP} onChange={e => setFormData({...formData, NoKTP: e.target.value.substring(0, 16)})} maxLength="16" required /><p className="text-[10px] text-blue-500 mt-1">No KTP (16 digit) akan menjadi Username login</p></div>
                        <div><label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Alamat</label><textarea className="w-full p-3 border rounded-xl text-sm h-20" placeholder="Masukkan alamat lengkap" value={formData.Alamat} onChange={e => setFormData({...formData, Alamat: e.target.value})} /></div>
                        <div><label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">No HP / WhatsApp</label><input type="tel" className="w-full p-3 border rounded-xl text-sm" placeholder="Contoh: 081234567890" value={formData.NoHP} onChange={e => setFormData({...formData, NoHP: e.target.value})} /></div>
                        <button type="submit" disabled={submitting} className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl mt-2 transition shadow-md">{submitting ? 'Menyimpan...' : 'Simpan Data Warga'}</button>
                    </form>
                </BottomSheet>
            )}
        </div>
    );
};

    // ==========================================
    // USER MANAGEMENT VIEW
    // ==========================================
    const UserManagementView = ({ user }) => {
        const [data, setData] = useState([]);
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [isDetailOpen, setIsDetailOpen] = useState(false);
        const [isResetOpen, setIsResetOpen] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [detailData, setDetailData] = useState(null);
        const [editId, setEditId] = useState(null);
        const [resetTarget, setResetTarget] = useState(null);
        const [resetPasswordValue, setResetPasswordValue] = useState('');
        const [resetType, setResetType] = useState('manual');
        const initialForm = { Username: '', Password: '', Nama: '', Role: 'Warga', NoKTP: '', Alamat: '', NoHP: '' };
        const [formData, setFormData] = useState(initialForm);
        const isAdmin = user && user.role === 'Pengurus';

        useEffect(() => { loadData(); }, []);
        const loadData = async () => { const res = await callAPI('read', { sheetName: 'Users' }); if (res.status === 'success') setData(res.data); };
        const handleOpenForm = (row = null) => { if (row) { const rowData = {...row}; delete rowData.PasswordHash; rowData.Password = ''; setFormData(rowData); setEditId(row.id); } else { setFormData(initialForm); setEditId(null); } setIsFormOpen(true); };
        const handleDetail = (row) => { setDetailData(row); setIsDetailOpen(true); };
        const handleResetPassword = (row) => { setResetTarget(row); setResetPasswordValue(''); setResetType('manual'); setIsResetOpen(true); };
        const handleResetToDefault = async (row) => { const defaultPassword = row.NoKTP?.slice(-6) || '???'; Swal.fire({ title: 'Reset ke Password Default', html: `<div><p>Reset password untuk ${row.Nama}</p><p class="mt-2"><strong>Password baru:</strong> ${defaultPassword}</p></div>`, icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Reset' }).then(async (result) => { if (result.isConfirmed) { Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading() }); const res = await callAPI('adminResetToDefault', { username: row.Username }); Swal.close(); if (res.status === 'success') Swal.fire({ icon: 'success', title: 'Berhasil', text: `Password direset ke ${res.defaultPassword || defaultPassword}` }); else Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); loadData(); } }); };
        const handleSubmitManualReset = async () => { if (!resetPasswordValue || resetPasswordValue.length < 4) { Swal.fire({ icon: 'error', text: 'Password minimal 4 karakter!' }); return; } Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading() }); const res = await callAPI('adminResetPassword', { username: resetTarget.Username, newPassword: resetPasswordValue }); Swal.close(); if (res.status === 'success') { Swal.fire({ icon: 'success', title: 'Berhasil', text: `Password direset menjadi ${resetPasswordValue}` }); setIsResetOpen(false); setResetPasswordValue(''); loadData(); } else { Swal.fire({ icon: 'error', title: 'Gagal', text: res.message }); } };
        const handleSubmit = async (e) => { e.preventDefault(); const dataToSend = { ...formData }; if (editId && !dataToSend.Password) delete dataToSend.Password; Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading() }); if (editId) await callAPI('update', { sheetName: 'Users', id: editId, data: dataToSend }); else await callAPI('create', { sheetName: 'Users', data: dataToSend }); Swal.close(); setIsFormOpen(false); loadData(); Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false }); };
        const handleDelete = (id) => { Swal.fire({ title: 'Hapus Akun?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya' }).then(async (r) => { if (r.isConfirmed) { Swal.fire({ title: 'Menghapus...', didOpen: () => Swal.showLoading() }); await callAPI('delete', { sheetName: 'Users', id }); loadData(); Swal.close(); Swal.fire({ icon: 'success', title: 'Terhapus!', timer: 1500, showConfirmButton: false }); } }); };
        const filteredData = data.filter(r => (r.Nama || '').toLowerCase().includes(searchTerm.toLowerCase()) || (r.Username || '').toLowerCase().includes(searchTerm.toLowerCase()));
        if (!isAdmin) return (<div className="p-4 text-center"><div className="bg-red-50 border border-red-200 rounded-xl p-6"><i className="fas fa-lock text-4xl text-red-500 mb-3 block"></i><h3 className="font-bold text-red-600">Akses Ditolak</h3><p className="text-sm text-gray-500 mt-2">Hanya admin yang dapat mengakses halaman ini.</p></div></div>);
        return (<div className="p-4 pb-10"><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-gray-800"><i className="fas fa-user-shield mr-2 text-slate-700"></i> Manajemen Akun</h2><button onClick={() => handleOpenForm()} className="bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md"><i className="fas fa-user-plus mr-1"></i> Akun Baru</button></div><div className="mb-4 p-3 bg-blue-50 rounded-xl"><p className="text-xs text-blue-700"><i className="fas fa-info-circle mr-1"></i> Username = No KTP (16 digit), Password default = 6 digit terakhir KTP</p></div><SearchBar searchTerm={searchTerm} setSearchTerm={setSearchTerm} placeholder="Cari nama, username..." /><div className="space-y-3 mt-2">{filteredData.map((row, idx) => (<div key={idx} className="bg-white p-4 rounded-xl border shadow-sm"><div className="flex items-center gap-4"><div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${row.Role === 'Pengurus' ? 'bg-slate-100 text-slate-700' : 'bg-blue-50 text-blue-500'}`}><i className={`fas ${row.Role === 'Pengurus' ? 'fa-user-shield' : 'fa-user'} text-xl`}></i></div><div className="flex-1"><h3 className="font-bold text-sm">{row.Nama}</h3><div className="mt-1 flex flex-wrap gap-2"><span className="text-[10px] font-bold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-md">@{row.Username}</span><span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${row.Role === 'Pengurus' ? 'bg-slate-100 text-slate-600' : 'bg-blue-50 text-blue-600'}`}>{row.Role}</span></div>{row.NoKTP && <p className="text-[10px] text-gray-400 mt-1"><i className="fas fa-id-card mr-1"></i> KTP: {row.NoKTP.substring(0,4)}****{row.NoKTP.substring(12)}</p>}</div></div><div className="flex justify-end gap-2 border-t pt-3 mt-3 flex-wrap"><button onClick={() => handleDetail(row)} className="text-[10px] bg-blue-50 text-blue-600 px-3 py-1.5 rounded-md font-bold"><i className="fas fa-eye"></i> Detail</button><button onClick={() => handleOpenForm(row)} className="text-[10px] bg-yellow-50 text-yellow-600 px-3 py-1.5 rounded-md font-bold"><i className="fas fa-edit"></i> Edit</button><button onClick={() => handleResetPassword(row)} className="text-[10px] bg-orange-50 text-orange-600 px-3 py-1.5 rounded-md font-bold"><i className="fas fa-key"></i> Reset Pwd</button><button onClick={() => handleResetToDefault(row)} className="text-[10px] bg-purple-50 text-purple-600 px-3 py-1.5 rounded-md font-bold"><i className="fas fa-undo-alt"></i> Reset ke Default</button>{row.Username !== user.username && <button onClick={() => handleDelete(row.id)} className="text-[10px] bg-red-50 text-red-500 px-3 py-1.5 rounded-md font-bold"><i className="fas fa-trash"></i> Hapus</button>}</div></div>))}</div><BottomSheet isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title="Detail Akun">{detailData && (<div className="space-y-4"><div className="grid grid-cols-2 gap-3"><div className="bg-gray-50 p-3 rounded-lg col-span-2"><p className="text-[10px] text-gray-400 font-bold uppercase">Nama Lengkap</p><p className="text-sm font-medium">{detailData.Nama || '-'}</p></div><div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Username</p><p className="text-sm font-medium">{detailData.Username || '-'}</p></div><div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Role</p><p className="text-sm font-medium">{detailData.Role || '-'}</p></div><div className="bg-gray-50 p-3 rounded-lg col-span-2"><p className="text-[10px] text-gray-400 font-bold uppercase">No KTP</p><p className="text-sm font-medium">{detailData.NoKTP || '-'}</p></div><div className="bg-gray-50 p-3 rounded-lg col-span-2"><p className="text-[10px] text-gray-400 font-bold uppercase">Alamat</p><p className="text-sm font-medium">{detailData.Alamat || '-'}</p></div><div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">No HP</p><p className="text-sm font-medium">{detailData.NoHP || '-'}</p></div><div className="bg-gray-50 p-3 rounded-lg"><p className="text-[10px] text-gray-400 font-bold uppercase">Password Default</p><p className="text-sm font-medium text-blue-600">{detailData.NoKTP ? detailData.NoKTP.slice(-6) : '-'}</p></div></div></div>)}</BottomSheet><BottomSheet isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={`${editId ? 'Edit' : 'Buat'} Akun`}><form onSubmit={handleSubmit} className="space-y-4"><input type="text" placeholder="Nama Lengkap" className="w-full p-3 border rounded-xl text-sm" value={formData.Nama} onChange={e=>setFormData({...formData, Nama:e.target.value})} required /><input type="text" placeholder="No KTP (16 digit)" className="w-full p-3 border rounded-xl text-sm" value={formData.NoKTP || ''} onChange={e=>setFormData({...formData, NoKTP:e.target.value.substring(0,16)})} required={!editId} /><input type="text" placeholder="Alamat" className="w-full p-3 border rounded-xl text-sm" value={formData.Alamat || ''} onChange={e=>setFormData({...formData, Alamat:e.target.value})} /><input type="text" placeholder="No HP" className="w-full p-3 border rounded-xl text-sm" value={formData.NoHP || ''} onChange={e=>setFormData({...formData, NoHP:e.target.value})} /><input type="text" placeholder="Username" className="w-full p-3 border rounded-xl text-sm lowercase bg-gray-50" value={formData.Username || ''} onChange={e=>setFormData({...formData, Username:e.target.value.replace(/\s+/g, '').toLowerCase()})} required /><input type="password" placeholder={editId ? "Isi untuk mengubah password baru" : "Password Login"} className="w-full p-3 border rounded-xl text-sm" value={formData.Password || ''} onChange={e=>setFormData({...formData, Password:e.target.value})} required={!editId} /><div className="bg-blue-50 p-3 rounded-lg"><p className="text-[10px] text-blue-600">{editId ? 'Kosongkan password jika tidak ingin mengubah' : 'Password default adalah 6 digit terakhir KTP'}</p></div><select className="w-full p-3 border rounded-xl text-sm" value={formData.Role} onChange={e=>setFormData({...formData, Role:e.target.value})} required><option value="Warga">Warga</option><option value="Pengurus">Pengurus (Admin)</option></select><button type="submit" className="w-full bg-slate-700 text-white font-bold p-3.5 rounded-xl mt-2">Simpan Akun</button></form></BottomSheet><BottomSheet isOpen={isResetOpen && resetType === 'manual'} onClose={() => setIsResetOpen(false)} title="Reset Password Manual"><div className="space-y-4"><div className="bg-orange-50 p-4 rounded-xl"><p className="text-sm font-medium text-gray-800">User: <strong>{resetTarget?.Nama}</strong></p><p className="text-xs text-gray-500 mt-1">Username: {resetTarget?.Username}</p></div><div><label className="block text-xs font-bold text-gray-700 mb-2">Password Baru</label><input type="text" placeholder="Masukkan password baru" className="w-full p-3 border rounded-xl text-sm" value={resetPasswordValue} onChange={e => setResetPasswordValue(e.target.value)} /><p className="text-[10px] text-gray-400 mt-1">Minimal 4 karakter</p></div><div className="flex gap-3"><button onClick={() => setIsResetOpen(false)} className="flex-1 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold text-sm">Batal</button><button onClick={handleSubmitManualReset} className="flex-1 py-3 bg-orange-500 text-white rounded-xl font-bold text-sm">Reset Password</button></div></div></BottomSheet></div>);
    };

    // ==========================================
    // APP UTAMA
    // ==========================================
    const App = () => {
        const [user, setUser] = useState(null);
        const [currentView, setCurrentView] = useState('dashboard');
        const [notifs, setNotifs] = useState([]);
        const [unreadCount, setUnreadCount] = useState(0);

        useEffect(() => {
            const savedUser = localStorage.getItem('rt04_user_online');
            if (savedUser) setUser(JSON.parse(savedUser));
            // Hapus loading screen
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.remove(), 500);
            }
        }, []);

        useEffect(() => { if (user) loadNotifs(); }, [user, currentView]);

        const loadNotifs = async () => {
            const res = await callAPI('read', { sheetName: 'Notifikasi' });
            if (res.status === 'success') {
                let sortedData = res.data.reverse();
                if (user) {
                    const isAdmin = user.role === 'Pengurus';
                    sortedData = sortedData.filter(n => {
                        const target = n.Target || '';
                        const kategori = n.Kategori || '';
                        const pelapor = n.Pelapor || '';
                        if (!target || target === '' || target === 'All') return true;
                        if (target === 'ADMIN_ONLY' && isAdmin) return true;
                        if (target === user.username) return true;
                        if (kategori === 'LAPOR_RT') {
                            if (isAdmin) return true;
                            if (pelapor === user.username) return true;
                            return false;
                        }
                        return false;
                    });
                    setNotifs(sortedData);
                    const unread = sortedData.filter(n => { const status = n.Status ? String(n.Status) : ''; return !status.includes(user.username); }).length;
                    setUnreadCount(unread);
                }
            }
        };

        const handleLogin = (userData) => { setUser(userData); localStorage.setItem('rt04_user_online', JSON.stringify(userData)); setCurrentView('dashboard'); };
        const handleLogout = () => { setUser(null); localStorage.removeItem('rt04_user_online'); };
        if (!user) return <LoginView onLogin={handleLogin} />;

        const renderView = () => {
            switch (currentView) {
                case 'dashboard': return <DashboardView user={user} setCurrentView={setCurrentView} />;
                case 'warga'    : return <DataWargaView user={user} />;
                case 'kontrakan': return <GenericCrudView sheetName="Kontrakan" title="Data Kontrakan" columns={['Foto', 'Nama', 'NIK', 'AsalDaerah', 'PemilikKontrakan', 'TglMasuk', 'NoHP']} user={user} />;
                case 'pengumuman': return <GenericCrudView sheetName="Pengumuman" title="Info & Pengumuman" columns={['Tanggal', 'Kategori', 'Judul', 'Isi', 'Pembuat']} user={user} />;
                case 'yatim': return <GenericCrudView sheetName="Yatim" title="Data Yatim & Piatu" columns={['Foto', 'Nama', 'TanggalLahir', 'Alamat', 'NamaOrangTua', 'Kategori']} user={user} />;
                case 'bansos': return <BansosView user={user} />;
                case 'tamu': return <GenericCrudView sheetName="Tamu" title="Buku Tamu" columns={['Foto', 'Nama', 'Hubungan Dengan Warga', 'Tujuan', 'Tanggal Datang']} user={user} wargaCanAdd={true} />;
                case 'keuangan': return <KeuanganView user={user} />;
                case 'laporankeuangan': return <LaporanKeuanganWargaView user={user} />;
                case 'inventaris': return <InventarisView user={user} />;
                case 'umkm': return <GenericCrudView sheetName="UMKM" title="UMKM Warga" columns={['Foto', 'NamaUsaha', 'Pemilik', 'Kategori', 'Kontak']} user={user} wargaCanAdd={true} />;
                case 'lapor': return <LaporanWargaView user={user} />;
                case 'surat': return <SuratView user={user} />;
                case 'cctv': return <CctvView user={user} />;
                case 'panic': return <PanicButtonView user={user} />;
                case 'users': return <UserManagementView user={user} />;
                case 'notifikasi': return <NotificationView notifs={notifs} loadNotifs={loadNotifs} user={user} />;
                case 'pengaturan': return <PengaturanView user={user} onLogout={handleLogout} />;
                default: return <DashboardView user={user} setCurrentView={setCurrentView} />;
            }
        };

        const titleBar = currentView === 'dashboard' ? "RT 06 RANTAU KEMINTING" : currentView.charAt(0).toUpperCase() + currentView.slice(1);
        return (<div className="app-container"><Topbar title={titleBar} user={user} unreadCount={unreadCount} onBellClick={() => setCurrentView('notifikasi')} /><div className="animate-fade-in">{renderView()}</div><BottomNav currentView={currentView} setCurrentView={setCurrentView} /></div>);
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
