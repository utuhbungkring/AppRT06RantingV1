                            <div className="relative"><div className="absolute top-3 left-3 pointer-events-none"><i className="fas fa-align-left text-gray-400"></i></div><textarea placeholder="Deskripsi detail masalah..." className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm h-28" value={formData.Deskripsi} onChange={e => setFormData({...formData, Deskripsi: e.target.value})} required></textarea></div>
                            <div><label className="block text-xs font-bold text-gray-700 mb-2 uppercase"><i className="fas fa-camera mr-1"></i> Foto / Bukti (Opsional)</label><div className="flex flex-col gap-3 p-4 border-2 border-dashed rounded-xl bg-gray-50 items-center justify-center">{imagePreview ? (<div className="relative"><img src={imagePreview} className="w-32 h-32 object-cover rounded-xl border-2 border-white shadow-md" alt="Preview" /><button type="button" onClick={() => { setFormData({...formData, Foto: ''}); setImagePreview(null); }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-xs"><i className="fas fa-times"></i></button></div>) : (<label className="cursor-pointer text-center"><i className="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2 block"></i><span className="text-sm text-gray-500">Klik untuk upload foto</span><p className="text-[10px] text-gray-400 mt-1">Format: JPG, PNG. Maks 2MB</p><input type="file" accept="image/jpeg,image/png,image/jpg" className="hidden" onChange={e => { const file = e.target.files[0]; if(file) handleFileChange(file); }} /></label>)}</div></div>
                            {isAdmin && editId && (<div><label className="block text-xs font-bold text-gray-700 mb-2 uppercase">Status</label><select className="w-full p-3 border rounded-xl text-sm font-bold" value={formData.Status} onChange={e => setFormData({...formData, Status: e.target.value})}><option value="Menunggu">Menunggu</option><option value="Diproses">Diproses</option><option value="Selesai">Selesai</option></select></div>)}
                            <button type="submit" disabled={submitting} className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl mt-2 transition shadow-md">{submitting ? <><i className="fas fa-spinner fa-spin mr-2"></i> Mengirim...</> : 'Kirim Laporan'}</button>
                        </form>
                    </BottomSheet>
                )}
            </div>
        );
    };

    // ==========================================
    // LAPORAN KEUANGAN WARGA VIEW
    // ==========================================
    const LaporanKeuanganWargaView = ({ user }) => {
        const [transaksi, setTransaksi] = useState([]);
        const [allTransaksi, setAllTransaksi] = useState([]);
        const [iuran, setIuran] = useState([]);
        const [loading, setLoading] = useState(true);
        const [filterTanggal, setFilterTanggal] = useState('');
        const [filterBulan, setFilterBulan] = useState('');
        const [filterTahun, setFilterTahun] = useState(new Date().getFullYear());
        const [filterJenis, setFilterJenis] = useState('semua');
        const [activeTab, setActiveTab] = useState('kas');

        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const years = [2023, 2024, 2025, 2026];

        const loadData = async () => {
            setLoading(true);
            const [resKeu, resIur] = await Promise.all([callAPI('read', { sheetName: 'Keuangan' }), callAPI('read', { sheetName: 'Iuran' })]);
            if (resKeu.status === 'success') { const sorted = resKeu.data.sort((a, b) => b.id.localeCompare(a.id)); setAllTransaksi(sorted); setTransaksi(sorted.slice(0, 10)); }
            if (resIur.status === 'success') { const myIuran = resIur.data.filter(i => i.NamaWarga === (user.nama || user.username)); setIuran(myIuran.sort((a, b) => b.id.localeCompare(a.id))); }
            setLoading(false);
        };

        useEffect(() => { loadData(); }, []);

        const applyFilter = () => {
            let filtered = [...allTransaksi];
            if (filterTanggal) filtered = filtered.filter(t => t.Tanggal === filterTanggal);
            if (filterBulan && filterTahun) {
                filtered = filtered.filter(t => { const [day, month, year] = t.Tanggal.split('/'); const bulanNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des']; const monthNum = bulanNames.indexOf(month) + 1; return monthNum === parseInt(filterBulan) && parseInt(year) === filterTahun; });
            }
            if (filterJenis === 'pemasukan') filtered = filtered.filter(t => t.Tipe === 'Pemasukan');
            else if (filterJenis === 'pengeluaran') filtered = filtered.filter(t => t.Tipe === 'Pengeluaran');
            setTransaksi(filtered);
        };

        const resetFilter = () => { setFilterTanggal(''); setFilterBulan(''); setFilterTahun(new Date().getFullYear()); setFilterJenis('semua'); setTransaksi(allTransaksi.slice(0, 10)); };

        const totalMasuk = allTransaksi.filter(t => t.Tipe === 'Pemasukan').reduce((sum, t) => sum + Number(t.Nominal || 0), 0);
        const totalKeluar = allTransaksi.filter(t => t.Tipe === 'Pengeluaran').reduce((sum, t) => sum + Number(t.Nominal || 0), 0);
        const saldoAkhir = totalMasuk - totalKeluar;
        const totalIuranSaya = iuran.filter(i => i.Status === 'LUNAS').reduce((sum, i) => sum + Number(i.Nominal || 0), 0);
        const filteredMasuk = transaksi.filter(t => t.Tipe === 'Pemasukan').reduce((sum, t) => sum + Number(t.Nominal || 0), 0);
        const filteredKeluar = transaksi.filter(t => t.Tipe === 'Pengeluaran').reduce((sum, t) => sum + Number(t.Nominal || 0), 0);
        const filteredSaldo = filteredMasuk - filteredKeluar;

        return (
            <div className="p-4 pb-10">
                <div className="bg-gradient-to-r from-blue-500 to-blue-700 rounded-2xl p-4 mb-4 text-white"><p className="text-xs opacity-80">Laporan Keuangan untuk:</p><h3 className="font-bold text-lg">{user.nama || user.username}</h3><p className="text-xs opacity-80 mt-1">Status: {user.role || 'Warga'}</p></div>
                <div className="grid grid-cols-3 gap-2 mb-4"><div className="bg-green-50 border border-green-200 p-3 rounded-xl text-green-800"><div className="text-[10px] font-medium">Total Kas Masuk</div><div className="text-sm font-bold">{formatRp(totalMasuk)}</div></div><div className="bg-red-50 border border-red-200 p-3 rounded-xl text-red-800"><div className="text-[10px] font-medium">Total Kas Keluar</div><div className="text-sm font-bold">{formatRp(totalKeluar)}</div></div><div className="bg-blue-600 p-3 rounded-xl text-white"><div className="text-[10px] font-medium">Saldo Kas RT</div><div className="text-sm font-bold">{formatRp(saldoAkhir)}</div></div></div>
                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 mb-4"><div className="flex justify-between items-center"><div><div className="text-[10px] font-medium text-emerald-700">Total Iuran yang Telah Dibayar</div><div className="text-lg font-bold text-emerald-800">{formatRp(totalIuranSaya)}</div></div><div className="bg-emerald-100 px-3 py-1 rounded-full"><span className="text-[10px] font-bold text-emerald-700">{iuran.filter(i => i.Status === 'LUNAS').length} x Bayar</span></div></div></div>
                <div className="flex gap-2 mb-4 border-b"><button onClick={() => setActiveTab('kas')} className={`px-4 py-2 font-bold text-sm transition ${activeTab === 'kas' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-400'}`}><i className="fas fa-money-bill-wave mr-1"></i> Laporan Kas RT</button><button onClick={() => setActiveTab('iuran')} className={`px-4 py-2 font-bold text-sm transition ${activeTab === 'iuran' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-400'}`}><i className="fas fa-receipt mr-1"></i> Riwayat Iuran Saya</button></div>
                {activeTab === 'kas' && (<div className="bg-white rounded-2xl shadow-sm border p-4"><div className="flex justify-between items-center mb-3 flex-wrap gap-2"><h3 className="font-bold text-gray-700 text-sm"><i className="fas fa-history mr-1 text-blue-500"></i> Riwayat Kas RT</h3><div className="text-[10px] text-gray-400"><i className="fas fa-info-circle mr-1"></i> Menampilkan transaksi terbaru</div></div>{(filterJenis !== 'semua' || filterTanggal || filterBulan) && (<div className="mb-3 p-2 bg-blue-50 rounded-lg"><p className="text-[10px] font-bold text-blue-700 mb-1">Hasil Filter:</p><div className="flex gap-3 text-[10px]"><span className="text-green-600">Pemasukan: {formatRp(filteredMasuk)}</span><span className="text-red-500">Pengeluaran: {formatRp(filteredKeluar)}</span><span className="text-blue-600">Saldo: {formatRp(filteredSaldo)}</span></div></div>)}<div className="mb-4 p-3 bg-gray-50 rounded-lg"><p className="text-xs font-bold text-gray-600 mb-2"><i className="fas fa-filter mr-1"></i> Filter Transaksi</p><div className="flex flex-wrap gap-2 mb-3"><div className="flex gap-2"><button onClick={() => setFilterJenis('semua')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${filterJenis === 'semua' ? 'bg-gray-600 text-white' : 'bg-gray-200 text-gray-700'}`}>Semua</button><button onClick={() => setFilterJenis('pemasukan')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${filterJenis === 'pemasukan' ? 'bg-green-600 text-white' : 'bg-green-100 text-green-700'}`}><i className="fas fa-arrow-down mr-1"></i> Pemasukan</button><button onClick={() => setFilterJenis('pengeluaran')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${filterJenis === 'pengeluaran' ? 'bg-red-600 text-white' : 'bg-red-100 text-red-700'}`}><i className="fas fa-arrow-up mr-1"></i> Pengeluaran</button></div></div><div className="flex flex-wrap gap-2"><input type="date" className="border rounded-lg px-3 py-1.5 text-xs flex-1" value={filterTanggal} onChange={(e) => { setFilterTanggal(e.target.value); setFilterBulan(''); }} /><select className="border rounded-lg px-3 py-1.5 text-xs" value={filterBulan} onChange={(e) => setFilterBulan(e.target.value)}><option value="">Pilih Bulan</option>{months.map((m, idx) => <option key={idx} value={idx + 1}>{m}</option>)}</select><select className="border rounded-lg px-3 py-1.5 text-xs" value={filterTahun} onChange={(e) => setFilterTahun(parseInt(e.target.value))}>{years.map(y => <option key={y} value={y}>{y}</option>)}</select><button onClick={applyFilter} className="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i className="fas fa-search mr-1"></i> Filter</button><button onClick={resetFilter} className="bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold"><i className="fas fa-undo mr-1"></i> Reset</button></div></div>{loading ? <Loader /> : transaksi.length === 0 ? <div className="text-center py-8 text-gray-400 text-xs">Belum ada transaksi kas</div> : <div className="space-y-2 max-h-[450px] overflow-y-auto">{transaksi.map((t, idx) => (<div key={idx} className={`flex justify-between items-center p-3 border rounded-lg transition ${t.Tipe === 'Pemasukan' ? 'hover:bg-green-50' : 'hover:bg-red-50'}`}><div className="flex-1"><div className="flex items-center gap-2 mb-1"><span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${t.Tipe === 'Pemasukan' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{t.Tipe === 'Pemasukan' ? '✓ PEMASUKAN' : '✗ PENGELUARAN'}</span></div><div className="text-xs font-bold text-gray-800">{t.Keterangan}</div><div className="text-[10px] text-gray-400 mt-1"><i className="fas fa-calendar-alt mr-1"></i> {t.Tanggal}</div>{t.Operator && <div className="text-[9px] text-gray-400 mt-0.5"><i className="fas fa-user mr-1"></i> Dicatat oleh: {t.Operator}</div>}</div><div className={`text-sm font-bold ${t.Tipe === 'Pemasukan' ? 'text-green-600' : 'text-red-500'}`}>{t.Tipe === 'Pemasukan' ? '+' : '-'} {formatRp(t.Nominal)}</div></div>))}</div>}{allTransaksi.length > 0 && (<div className="text-center text-[10px] text-gray-400 mt-3 pt-2 border-t">{filterJenis !== 'semua' || filterTanggal || filterBulan ? `Menampilkan ${transaksi.length} dari ${allTransaksi.length} transaksi` : `Total ${allTransaksi.length} transaksi kas`}</div>)}</div>)}
                {activeTab === 'iuran' && (<div className="bg-white rounded-2xl shadow-sm border p-4"><div className="flex justify-between items-center mb-3"><h3 className="font-bold text-gray-700 text-sm"><i className="fas fa-receipt mr-1 text-emerald-500"></i> Riwayat Pembayaran Iuran</h3><div className="text-[10px] text-gray-400">Total: {formatRp(totalIuranSaya)}</div></div>{loading ? <Loader /> : iuran.length === 0 ? <div className="text-center py-8 text-gray-400 text-xs"><i className="fas fa-inbox text-3xl mb-2 block opacity-50"></i>Belum ada riwayat pembayaran iuran</div> : <div className="space-y-3 max-h-[450px] overflow-y-auto">{iuran.map((i, idx) => (<div key={idx} className="border rounded-xl p-3 hover:shadow-md transition"><div className="flex justify-between items-start"><div><div className="flex items-center gap-2 mb-1"><span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${i.Status === 'LUNAS' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{i.Status === 'LUNAS' ? '✓ LUNAS' : '⏳ PENDING'}</span><span className="text-[10px] text-gray-400">{i.Bulan} {i.Tahun}</span></div><p className="text-xs text-gray-600 mt-1"><i className="fas fa-user mr-1"></i> {i.NamaWarga}</p></div><div className="text-right"><div className="text-sm font-bold text-emerald-600">{formatRp(i.Nominal)}</div>{i.Bukti && <button onClick={() => { Swal.fire({ title: 'Bukti Pembayaran', imageUrl: i.Bukti, imageWidth: 300, imageAlt: 'Bukti Transfer', confirmButtonText: 'Tutup' }); }} className="text-[9px] text-blue-500 mt-1 hover:underline"><i className="fas fa-image mr-1"></i> Lihat Bukti</button>}</div></div></div>))}</div>}<div className="mt-4 p-3 bg-blue-50 rounded-lg"><p className="text-[10px] text-blue-700"><i className="fas fa-info-circle mr-1"></i> Iuran dibayarkan setiap bulan. Hubungi bendahara untuk informasi lebih lanjut.</p></div></div>)}
            </div>
        );
    };
    // ==========================================
// SURAT MASUK & KELUAR VIEW
// ==========================================
const SuratView = ({ user }) => {
    const [activeTab, setActiveTab] = useState('keluar'); // 'keluar' atau 'masuk'
    const [dataKeluar, setDataKeluar] = useState([]);
    const [dataMasuk, setDataMasuk] = useState([]);
    const [allDataKeluar, setAllDataKeluar] = useState([]);
    const [allDataMasuk, setAllDataMasuk] = useState([]);
    const [loading, setLoading] = useState(true);
    const [isFormOpen, setIsFormOpen] = useState(false);
    const [isDetailOpen, setIsDetailOpen] = useState(false);
    const [formData, setFormData] = useState({});
    const [detailData, setDetailData] = useState(null);
    const [editId, setEditId] = useState(null);
    const [submitting, setSubmitting] = useState(false);
    const [searchTerm, setSearchTerm] = useState('');
    const [filterTanggal, setFilterTanggal] = useState('');
    const [filterBulan, setFilterBulan] = useState('');
    const [filterTahun, setFilterTahun] = useState(new Date().getFullYear());

    const isAdmin = user && user.role === 'Pengurus';
    const canAdd = isAdmin;
    const canDelete = isAdmin;

    const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const years = [2023, 2024, 2025, 2026, 2027];

    // Generate nomor surat otomatis untuk surat keluar
    const generateNomorSurat = () => {
        const now = new Date();
        const bulan = (now.getMonth() + 1).toString().padStart(2, '0');
        const tahun = now.getFullYear();
        const bulanRomawi = getRomanMonth(now.getMonth() + 1);
        
        // Hitung jumlah surat keluar di bulan ini
        const bulanIni = dataKeluar.filter(s => {
            const tgl = new Date(s.Tanggal);
            return tgl.getMonth() === now.getMonth() && tgl.getFullYear() === now.getFullYear();
        }).length;
        
        const nomorUrut = (bulanIni + 1).toString().padStart(3, '0');
        return `${nomorUrut}/${bulanRomawi}/RT06/RANTING/${tahun}`;
    };

    const getRomanMonth = (month) => {
        const roman = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
        return roman[month];
    };

    useEffect(() => { loadData(); }, []);

    const loadData = async () => {
        setLoading(true);
        const res = await callAPI('read', { sheetName: 'Surat' });
        if (res.status === 'success') {
            const keluar = res.data.filter(s => s.Jenis === 'keluar').sort((a, b) => b.id.localeCompare(a.id));
            const masuk = res.data.filter(s => s.Jenis === 'masuk').sort((a, b) => b.id.localeCompare(a.id));
            setAllDataKeluar(keluar);
            setAllDataMasuk(masuk);
            setDataKeluar(keluar.slice(0, 10));
            setDataMasuk(masuk.slice(0, 10));
        }
        setLoading(false);
    };

    const applyFilter = (jenis) => {
        let filtered = jenis === 'keluar' ? [...allDataKeluar] : [...allDataMasuk];
        
        if (filterTanggal) {
            filtered = filtered.filter(s => s.Tanggal === filterTanggal);
        }
        if (filterBulan && filterTahun) {
            filtered = filtered.filter(s => {
                const tgl = new Date(s.Tanggal);
                return tgl.getMonth() + 1 === parseInt(filterBulan) && tgl.getFullYear() === filterTahun;
            });
        }
        
        if (jenis === 'keluar') {
            setDataKeluar(filtered);
        } else {
            setDataMasuk(filtered);
        }
    };

    const resetFilter = (jenis) => {
    setFilterTanggal('');
    setFilterBulan('');
    setFilterTahun(new Date().getFullYear());
    setSearchTerm(''); // Tambahkan ini
    if (jenis === 'keluar') {
        setDataKeluar(allDataKeluar.slice(0, 10));
    } else {
        setDataMasuk(allDataMasuk.slice(0, 10));
    }
};

    const handleOpenForm = (jenis, row = null) => {
        setImagePreview(null);
        if (row && row.id) {
            setFormData({ ...row });
            setEditId(row.id);
            if (row.FileUrl && row.FileUrl.startsWith('http')) setImagePreview(row.FileUrl);
        } else {
            if (jenis === 'keluar') {
                setFormData({
                    Jenis: 'keluar',
                    NomorSurat: generateNomorSurat(),
                    Tanggal: new Date().toISOString().split('T')[0],
                    Perihal: '',
                    Tujuan: '',
                    Keterangan: '',
                    FileUrl: '',
                    Status: 'Dikirim'
                });
            } else {
                setFormData({
                    Jenis: 'masuk',
                    NomorSurat: '',
                    Tanggal: new Date().toISOString().split('T')[0],
                    Perihal: '',
                    Pengirim: '',
                    Keterangan: '',
                    FileUrl: '',
                    Status: 'Diterima'
                });
            }
            setEditId(null);
        }
        setIsFormOpen(true);
    };

    const handleDetail = (row) => {
        setDetailData(row);
        setIsDetailOpen(true);
    };

    const [imagePreview, setImagePreview] = useState(null);

    const handleFileChange = (file) => {
        if (file) {
            if (file.size > 2 * 1024 * 1024) {
                Swal.fire({ icon: 'warning', title: 'Ukuran file terlalu besar', text: 'Maksimal ukuran file adalah 2MB!' });
                return;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
                setFormData({ ...formData, FileUrl: reader.result });
                setImagePreview(reader.result);
                Swal.fire({ icon: 'success', title: 'File berhasil diupload', timer: 1500, showConfirmButton: false });
            };
            reader.readAsDataURL(file);
        }
    };

    const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);

        const dataToSend = {
            ...formData,
            Pembuat: user.nama || user.username,
            TanggalInput: new Date().toLocaleDateString('id-ID')
        };

        let res;
        if (editId) {
            res = await callAPI('update', { sheetName: 'Surat', id: editId, data: dataToSend });
        } else {
            res = await callAPI('create', { sheetName: 'Surat', data: dataToSend });
            
            // Kirim notifikasi
            if (res.status === 'success') {
                await callAPI('create', {
                    sheetName: 'Notifikasi',
                    data: {
                        Judul: `📄 Surat ${dataToSend.Jenis === 'keluar' ? 'Keluar' : 'Masuk'}: ${dataToSend.Perihal}`,
                        Pesan: `${dataToSend.Jenis === 'keluar' ? 'Surat keluar' : 'Surat masuk'} dengan perihal "${dataToSend.Perihal}" telah ditambahkan.`,
                        Kategori: 'SURAT',
                        Tanggal: new Date().toLocaleString(),
                        Target: 'ADMIN_ONLY',
                        Pelapor: user.username
                    }
                });
            }
        }
        setSubmitting(false);
        setIsFormOpen(false);
        setImagePreview(null);

        if (res.status === 'success') {
            Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false });
            loadData();
        } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: res.message });
        }
    };

    const handleDelete = (id) => {
        Swal.fire({ title: 'Hapus Data Surat?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya' }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                await callAPI('delete', { sheetName: 'Surat', id: id });
                loadData();
                Swal.close();
            }
        });
    };

    const handleSearch = (term, jenis) => {
        setSearchTerm(term);
        if (!term.trim()) {
            if (jenis === 'keluar') {
                setDataKeluar(allDataKeluar.slice(0, 10));
            } else {
                setDataMasuk(allDataMasuk.slice(0, 10));
            }
            return;
        }
        const searchLower = term.toLowerCase();
        if (jenis === 'keluar') {
            const filtered = allDataKeluar.filter(row =>
                (row.NomorSurat || '').toLowerCase().includes(searchLower) ||
                (row.Perihal || '').toLowerCase().includes(searchLower) ||
                (row.Tujuan || '').toLowerCase().includes(searchLower)
            );
            setDataKeluar(filtered);
        } else {
            const filtered = allDataMasuk.filter(row =>
                (row.NomorSurat || '').toLowerCase().includes(searchLower) ||
                (row.Perihal || '').toLowerCase().includes(searchLower) ||
                (row.Pengirim || '').toLowerCase().includes(searchLower)
            );
            setDataMasuk(filtered);
        }
    };

    const totalKeluar = allDataKeluar.length;
    const totalMasuk = allDataMasuk.length;
    const totalSurat = totalKeluar + totalMasuk;

    return (
        <div className="p-4 pb-10">
            {/* Header dengan statistik */}
            <div className="flex justify-between items-center mb-4">
                <h2 className="text-xl font-bold text-gray-800">
                    <i className="fas fa-envelope mr-2 text-blue-500"></i> Administrasi Surat
                </h2>
                {canAdd && (
                    <div className="flex gap-2">
                        <button onClick={() => handleOpenForm('keluar')} className="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-md">
                            <i className="fas fa-paper-plane mr-1"></i> Surat Keluar
                        </button>
                        <button onClick={() => handleOpenForm('masuk')} className="bg-green-600 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-md">
                            <i className="fas fa-inbox mr-1"></i> Surat Masuk
                        </button>
                    </div>
                )}
            </div>

            {/* Statistik Ringkasan */}
            <div className="grid grid-cols-3 gap-2 mb-4">
                <div className="bg-blue-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-blue-600">{totalKeluar}</div>
                    <div className="text-[10px] text-gray-500">Surat Keluar</div>
                </div>
                <div className="bg-green-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-green-600">{totalMasuk}</div>
                    <div className="text-[10px] text-gray-500">Surat Masuk</div>
                </div>
                <div className="bg-purple-50 p-3 rounded-xl text-center">
                    <div className="text-lg font-bold text-purple-600">{totalSurat}</div>
                    <div className="text-[10px] text-gray-500">Total Surat</div>
                </div>
            </div>

            {/* Tab Navigation */}
            <div className="flex gap-2 mb-4 border-b">
                <button onClick={() => { setActiveTab('keluar'); setSearchTerm(''); }} className={`px-4 py-2 font-bold text-sm transition ${activeTab === 'keluar' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-400'}`}>
                    <i className="fas fa-paper-plane mr-1"></i> Surat Keluar
                </button>
                <button onClick={() => { setActiveTab('masuk'); setSearchTerm(''); }} className={`px-4 py-2 font-bold text-sm transition ${activeTab === 'masuk' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-400'}`}>
                    <i className="fas fa-inbox mr-1"></i> Surat Masuk
                </button>
            </div>

            {/* Filter */}
            <div className="mb-4 p-3 bg-gray-50 rounded-lg">
                <p className="text-xs font-bold text-gray-600 mb-2"><i className="fas fa-filter mr-1"></i> Filter Data</p>
                <div className="flex flex-wrap gap-2">
                    <input type="date" className="border rounded-lg px-3 py-1.5 text-xs flex-1" value={filterTanggal} onChange={(e) => { setFilterTanggal(e.target.value); }} />
                    <select className="border rounded-lg px-3 py-1.5 text-xs" value={filterBulan} onChange={(e) => setFilterBulan(e.target.value)}>
                        <option value="">Pilih Bulan</option>
                        {months.map((m, idx) => <option key={idx} value={idx + 1}>{m}</option>)}
                    </select>
                    <select className="border rounded-lg px-3 py-1.5 text-xs" value={filterTahun} onChange={(e) => setFilterTahun(parseInt(e.target.value))}>
                        {years.map(y => <option key={y} value={y}>{y}</option>)}
                    </select>
                    <button onClick={() => applyFilter(activeTab)} className="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">
                        <i className="fas fa-search mr-1"></i> Filter
                    </button>
                    <button onClick={() => resetFilter(activeTab)} className="bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold">
                        <i className="fas fa-undo mr-1"></i> Reset
                    </button>
                </div>
            </div>

            {/* Search Bar */}
            <SearchBar searchTerm={searchTerm} setSearchTerm={(term) => handleSearch(term, activeTab)} placeholder={`Cari ${activeTab === 'keluar' ? 'nomor surat, perihal, atau tujuan' : 'nomor surat, perihal, atau pengirim'}...`} />

            {loading ? <Loader /> : (
                <div className="space-y-4 mt-2">
                    {activeTab === 'keluar' && (
                        <>
                            {dataKeluar.length === 0 ? (
                                <div className="text-center py-8 text-gray-400 bg-white rounded-2xl shadow-sm border">
                                    <i className="fas fa-envelope-open-text text-4xl mb-2 opacity-50 block"></i>
                                    {searchTerm || filterTanggal || filterBulan ? 'Data tidak ditemukan' : 'Belum ada surat keluar'}
                                </div>
                            ) : (
                                dataKeluar.map((row, idx) => (
                                    <div key={row.id || idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-bold text-sm text-gray-800">{row.NomorSurat}</h3>
                                            <span className="text-[10px] px-2 py-0.5 rounded-full bg-green-100 text-green-700">
                                                {row.Status || 'Dikirim'}
                                            </span>
                                        </div>
                                        <p className="text-xs text-gray-600 font-medium mb-1">{row.Perihal}</p>
                                        <p className="text-[10px] text-gray-500 mb-1">
                                            <i className="fas fa-location-dot mr-1"></i> Tujuan: {row.Tujuan || '-'}
                                        </p>
                                        <div className="flex justify-between items-center text-[10px] text-gray-400 border-t border-gray-50 pt-2 mt-2">
                                            <span><i className="fas fa-calendar mr-1"></i> {row.Tanggal}</span>
                                            <span><i className="fas fa-user mr-1"></i> {row.Pembuat || '-'}</span>
                                        </div>
                                        <div className="flex justify-end gap-2 mt-2">
                                            <button onClick={() => handleDetail(row)} className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg font-bold transition">
                                                <i className="fas fa-eye"></i> Detail
                                            </button>
                                            {canAdd && (
                                                <button onClick={() => handleOpenForm('keluar', row)} className="text-xs bg-yellow-50 hover:bg-yellow-100 text-yellow-600 px-3 py-1.5 rounded-lg font-bold transition">
                                                    <i className="fas fa-edit"></i> Edit
                                                </button>
                                            )}
                                            {canDelete && (
                                                <button onClick={() => handleDelete(row.id)} className="text-xs bg-red-50 hover:bg-red-100 text-red-500 px-3 py-1.5 rounded-lg font-bold transition">
                                                    <i className="fas fa-trash"></i> Hapus
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                            {searchTerm && allDataKeluar.length > 0 && (
                                <div className="text-center text-xs text-gray-400 py-2">Menampilkan {dataKeluar.length} dari {allDataKeluar.length} data <button onClick={() => { setSearchTerm(''); handleSearch('', 'keluar'); }} className="ml-2 text-blue-500 hover:underline">Reset</button></div>
                            )}
                        </>
                    )}

                    {activeTab === 'masuk' && (
                        <>
                            {dataMasuk.length === 0 ? (
                                <div className="text-center py-8 text-gray-400 bg-white rounded-2xl shadow-sm border">
                                    <i className="fas fa-envelope-open-text text-4xl mb-2 opacity-50 block"></i>
                                    {searchTerm || filterTanggal || filterBulan ? 'Data tidak ditemukan' : 'Belum ada surat masuk'}
                                </div>
                            ) : (
                                dataMasuk.map((row, idx) => (
                                    <div key={row.id || idx} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-bold text-sm text-gray-800">{row.NomorSurat || '-'}</h3>
                                            <span className="text-[10px] px-2 py-0.5 rounded-full bg-green-100 text-green-700">
                                                {row.Status || 'Diterima'}
                                            </span>
                                        </div>
                                        <p className="text-xs text-gray-600 font-medium mb-1">{row.Perihal}</p>
                                        <p className="text-[10px] text-gray-500 mb-1">
                                            <i className="fas fa-user mr-1"></i> Pengirim: {row.Pengirim || '-'}
                                        </p>
                                        <div className="flex justify-between items-center text-[10px] text-gray-400 border-t border-gray-50 pt-2 mt-2">
                                            <span><i className="fas fa-calendar mr-1"></i> {row.Tanggal}</span>
                                            <span><i className="fas fa-user mr-1"></i> {row.Pembuat || '-'}</span>
                                        </div>
                                        <div className="flex justify-end gap-2 mt-2">
                                            <button onClick={() => handleDetail(row)} className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg font-bold transition">
                                                <i className="fas fa-eye"></i> Detail
                                            </button>
                                            {canAdd && (
                                                <button onClick={() => handleOpenForm('masuk', row)} className="text-xs bg-yellow-50 hover:bg-yellow-100 text-yellow-600 px-3 py-1.5 rounded-lg font-bold transition">
                                                    <i className="fas fa-edit"></i> Edit
                                                </button>
                                            )}
                                            {canDelete && (
                                                <button onClick={() => handleDelete(row.id)} className="text-xs bg-red-50 hover:bg-red-100 text-red-500 px-3 py-1.5 rounded-lg font-bold transition">
                                                    <i className="fas fa-trash"></i> Hapus
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                            {searchTerm && allDataMasuk.length > 0 && (
                                <div className="text-center text-xs text-gray-400 py-2">Menampilkan {dataMasuk.length} dari {allDataMasuk.length} data <button onClick={() => { setSearchTerm(''); handleSearch('', 'masuk'); }} className="ml-2 text-blue-500 hover:underline">Reset</button></div>
                            )}
                        </>
                    )}
                </div>
            )}

            {/* MODAL DETAIL */}
            <BottomSheet isOpen={isDetailOpen} onClose={() => setIsDetailOpen(false)} title={`Detail Surat ${detailData?.Jenis === 'keluar' ? 'Keluar' : 'Masuk'}`}>
                {detailData && (
                    <div className="space-y-4">
                        {detailData.FileUrl && (
    <div className="bg-gray-100 rounded-xl overflow-hidden">
        {detailData.FileUrl.startsWith('data:image') || detailData.FileUrl.match(/\.(jpg|jpeg|png|gif)/i) ? (
            <img src={detailData.FileUrl} className="w-full h-64 object-contain bg-white" alt="Lampiran" />
        ) : (
            <div className="p-4 text-center">
                <i className="fas fa-file-pdf text-5xl text-red-500 mb-2 block"></i>
                <a href={detailData.FileUrl} target="_blank" className="text-blue-500 underline text-sm">Download File</a>
            </div>
        )}
    </div>
)}
                        <div className="space-y-3">
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Nomor Surat</p>
                                <p className="text-sm font-medium">{detailData.NomorSurat || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Tanggal</p>
                                <p className="text-sm font-medium">{detailData.Tanggal || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Perihal</p>
                                <p className="text-sm font-medium">{detailData.Perihal || '-'}</p>
                            </div>
                            {detailData.Jenis === 'keluar' ? (
                                <div className="bg-gray-50 p-3 rounded-lg">
                                    <p className="text-[10px] text-gray-400 font-bold uppercase">Tujuan Surat</p>
                                    <p className="text-sm font-medium">{detailData.Tujuan || '-'}</p>
                                </div>
                            ) : (
                                <div className="bg-gray-50 p-3 rounded-lg">
                                    <p className="text-[10px] text-gray-400 font-bold uppercase">Pengirim Surat</p>
                                    <p className="text-sm font-medium">{detailData.Pengirim || '-'}</p>
                                </div>
                            )}
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Keterangan</p>
                                <p className="text-sm font-medium">{detailData.Keterangan || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Pembuat</p>
                                <p className="text-sm font-medium">{detailData.Pembuat || '-'}</p>
                            </div>
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <p className="text-[10px] text-gray-400 font-bold uppercase">Status</p>
                                <p className="text-sm font-medium">{detailData.Status || '-'}</p>
                            </div>
                        </div>
                        {canAdd && (
                            <button onClick={() => { setIsDetailOpen(false); handleOpenForm(detailData.Jenis, detailData); }} 
                                    className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl mt-4 flex justify-center items-center gap-2 shadow-md">
                                <i className="fas fa-edit"></i> Edit Data Ini
                            </button>
                        )}
                    </div>
                )}
            </BottomSheet>

            {/* MODAL FORM TAMBAH/EDIT SURAT */}
            {canAdd && (
                <BottomSheet isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} title={`${editId ? 'Edit' : 'Tambah'} Surat ${formData.Jenis === 'keluar' ? 'Keluar' : 'Masuk'}`}>
                    <form onSubmit={handleSubmit} className="space-y-4 max-h-[70vh] overflow-y-auto pr-2">
                        {/* Nomor Surat */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">
                                Nomor Surat {formData.Jenis === 'keluar' && <span className="text-red-500">*</span>}
                            </label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-hashtag text-gray-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    placeholder={formData.Jenis === 'keluar' ? "Contoh: 001/I/RT06/RANTING/2025" : "Opsional"}
                                    value={formData.NomorSurat || ''}
                                    onChange={e => setFormData({...formData, NomorSurat: e.target.value})}
                                    required={formData.Jenis === 'keluar'}
                                />
                                {formData.Jenis === 'keluar' && (
                                    <p className="text-[10px] text-blue-500 mt-1">
                                        <i className="fas fa-info-circle mr-1"></i>
                                        Format: NO/BULAN/RT06/RANTING/TAHUN (Bulan dalam Romawi)
                                    </p>
                                )}
                            </div>
                        </div>

                        {/* Tanggal */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Tanggal Surat</label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-calendar-alt text-gray-400"></i>
                                </div>
                                <input 
                                    type="date" 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    value={formData.Tanggal || ''}
                                    onChange={e => setFormData({...formData, Tanggal: e.target.value})}
                                    required
                                />
                            </div>
                        </div>

                        {/* Perihal */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Perihal</label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-tag text-gray-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                    placeholder="Contoh: Undangan Rapat, Permohonan Bantuan, dll"
                                    value={formData.Perihal || ''}
                                    onChange={e => setFormData({...formData, Perihal: e.target.value})}
                                    required
                                />
                            </div>
                        </div>

                        {/* Tujuan (Surat Keluar) atau Pengirim (Surat Masuk) */}
                        {formData.Jenis === 'keluar' ? (
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Tujuan Surat</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i className="fas fa-location-dot text-gray-400"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                        placeholder="Contoh: Kepala Desa, Camat, Dinas Sosial"
                                        value={formData.Tujuan || ''}
                                        onChange={e => setFormData({...formData, Tujuan: e.target.value})}
                                        required
                                    />
                                </div>
                            </div>
                        ) : (
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Pengirim Surat</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i className="fas fa-user text-gray-400"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                        placeholder="Contoh: Dinas Sosial, Polsek, Kantor Desa"
                                        value={formData.Pengirim || ''}
                                        onChange={e => setFormData({...formData, Pengirim: e.target.value})}
                                        required
                                    />
                                </div>
                            </div>
                        )}

                        {/* Keterangan */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Keterangan</label>
                            <div className="relative">
                                <div className="absolute top-3 left-3 pointer-events-none">
                                    <i className="fas fa-pen text-gray-400"></i>
                                </div>
                                <textarea 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm h-20"
                                    placeholder="Informasi tambahan tentang surat ini..."
                                    value={formData.Keterangan || ''}
                                    onChange={e => setFormData({...formData, Keterangan: e.target.value})}
                                />
                            </div>
                        </div>

                        {/* Upload File */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">
                                <i className="fas fa-paperclip mr-1"></i> Lampiran File (Opsional)
                            </label>
                            <div className="flex flex-col gap-3 p-4 border-2 border-dashed rounded-xl bg-gray-50 items-center justify-center">
                                {imagePreview ? (
                                    <div className="relative">
                                        {imagePreview.startsWith('data:image') ? (
                                            <img src={imagePreview} className="w-32 h-32 object-cover rounded-lg border-2 border-white shadow-md" alt="Preview" />
                                        ) : (
                                            <iframe src={imagePreview} className="w-64 h-32 rounded-lg border-2 border-white shadow-md" title="File Preview" />
                                        )}
                                        <button 
                                            type="button" 
                                            onClick={() => { setFormData({...formData, FileUrl: ''}); setImagePreview(null); }} 
                                            className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg text-xs"
                                        >
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <label className="cursor-pointer text-center">
                                        <i className="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2 block"></i>
                                        <span className="text-sm text-gray-500">Klik untuk upload file</span>
                                        <p className="text-[10px] text-gray-400 mt-1">Format: PDF, JPG, PNG, DOC. Maks 2MB</p>
                                        <input 
                                            type="file" 
                                            accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" 
                                            className="hidden" 
                                            onChange
                                                                                        onChange={(e) => {
                                                const file = e.target.files[0];
                                                if (file) handleFileChange(file);
                                            }}
                                        />
                                    </label>
                                )}
                            </div>
                        </div>

                        {/* Status */}
                        <div>
                            <label className="block text-xs font-bold text-gray-700 mb-1.5 uppercase">Status Surat</label>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i className="fas fa-flag-checkered text-gray-400"></i>
                                </div>
                                <select 
                                    className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm appearance-none bg-white"
                                    value={formData.Status || (formData.Jenis === 'keluar' ? 'Dikirim' : 'Diterima')}
                                    onChange={e => setFormData({...formData, Status: e.target.value})}
                                >
                                    <option value={formData.Jenis === 'keluar' ? 'Dikirim' : 'Diterima'}>
                                        {formData.Jenis === 'keluar' ? 'Dikirim' : 'Diterima'}
                                    </option>
                                    <option value={formData.Jenis === 'keluar' ? 'Diproses' : 'Menunggu'}>
                                        {formData.Jenis === 'keluar' ? 'Diproses' : 'Menunggu'}
                                    </option>
                                    <option value={formData.Jenis === 'keluar' ? 'Selesai' : 'Arsip'}>
                                        {formData.Jenis === 'keluar' ? 'Selesai' : 'Arsip'}
                                    </option>
                                </select>
                            </div>
                        </div>

                        {/* Tombol Submit */}
                        <div className="flex gap-3 pt-4 sticky bottom-0 bg-white pb-4">
                            <button 
                                type="button" 
                                onClick={() => {
                                    setIsFormOpen(false);
                                    setImagePreview(null);
                                }} 
                                className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3.5 rounded-xl transition"
                            >
                                Batal
                            </button>
                            <button 
                                type="submit" 
                                disabled={submitting} 
                                className="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-md disabled:opacity-50"
                            >
                                {submitting ? (
                                    <div className="flex items-center justify-center gap-2">
                                        <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                        <span>Menyimpan...</span>
                                    </div>
                                ) : (
                                    <span><i className="fas fa-save mr-2"></i> Simpan</span>
                                )}
                            </button>
                        </div>
                    </form>
                </BottomSheet>
            )}
        </div>
    );
};

// ==========================================
// LAPORAN KEUANGAN VIEW
// ==========================================
const LaporanKeuanganView = ({ user }) => {
    const [loading, setLoading] = useState(true);
    const [kasData, setKasData] = useState([]);
    const [filterBulan, setFilterBulan] = useState(new Date().getMonth() + 1);
    const [filterTahun, setFilterTahun] = useState(new Date().getFullYear());
    const [showDetailModal, setShowDetailModal] = useState(false);
    const [selectedTransaksi, setSelectedTransaksi] = useState(null);
    
    const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const years = [2023, 2024, 2025, 2026, 2027];
    
    const isAdmin = user && user.role === 'Pengurus';
    const isBendahara = user && (user.role === 'Pengurus' || user.role === 'Bendahara');
    const canAdd = isBendahara;
    const canDelete = isAdmin;

    useEffect(() => { loadKasData(); }, []);

    const loadKasData = async () => {
        setLoading(true);
        const res = await callAPI('read', { sheetName: 'Kas' });
        if (res.status === 'success') {
            setKasData(res.data.sort((a, b) => b.id.localeCompare(a.id)));
        }
        setLoading(false);
    };

    // Hitung saldo
    const calculateSaldo = () => {
        let pemasukan = 0;
        let pengeluaran = 0;
        
        kasData.forEach(item => {
            if (item.Tipe === 'Pemasukan') {
                pemasukan += parseFloat(item.Jumlah) || 0;
            } else {
                pengeluaran += parseFloat(item.Jumlah) || 0;
            }
        });
        
        return { pemasukan, pengeluaran, saldo: pemasukan - pengeluaran };
    };

    // Filter data berdasarkan bulan dan tahun
    const getFilteredData = () => {
        return kasData.filter(item => {
            if (!item.Tanggal) return false;
            const date = new Date(item.Tanggal);
            return date.getMonth() + 1 === filterBulan && date.getFullYear() === filterTahun;
        });
    };

    const getMonthlyStats = () => {
        const filtered = getFilteredData();
        let pemasukan = 0;
        let pengeluaran = 0;
        
        filtered.forEach(item => {
            if (item.Tipe === 'Pemasukan') {
                pemasukan += parseFloat(item.Jumlah) || 0;
            } else {
                pengeluaran += parseFloat(item.Jumlah) || 0;
            }
        });
        
        return { pemasukan, pengeluaran, saldo: pemasukan - pengeluaran, total: filtered.length };
    };

    const handleDelete = (id) => {
        if (!canDelete) {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Hanya admin yang dapat menghapus data!' });
            return;
        }
        
        Swal.fire({
            title: 'Hapus Transaksi?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Ya, Hapus!'
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                await callAPI('delete', { sheetName: 'Kas', id: id });
                loadKasData();
                Swal.close();
                Swal.fire({ icon: 'success', title: 'Terhapus!', timer: 1500, showConfirmButton: false });
            }
        });
    };

    const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
    };

    const { pemasukan: totalPemasukan, pengeluaran: totalPengeluaran, saldo: totalSaldo } = calculateSaldo();
    const monthlyStats = getMonthlyStats();
    const filteredData = getFilteredData();

    return (
        <div className="p-4 pb-10">
            {/* Header */}
            <div className="mb-4">
                <h2 className="text-xl font-bold text-gray-800">
                    <i className="fas fa-chart-line mr-2 text-green-500"></i> Laporan Keuangan
                </h2>
                <p className="text-xs text-gray-500 mt-1">Rekapitulasi pemasukan dan pengeluaran kas RT</p>
            </div>

            {/* Ringkasan Total */}
            <div className="grid grid-cols-3 gap-3 mb-6">
                <div className="bg-green-50 rounded-xl p-3 text-center">
                    <div className="text-[10px] text-gray-500">Total Pemasukan</div>
                    <div className="text-sm font-bold text-green-600">{formatRupiah(totalPemasukan)}</div>
                </div>
                <div className="bg-red-50 rounded-xl p-3 text-center">
                    <div className="text-[10px] text-gray-500">Total Pengeluaran</div>
                    <div className="text-sm font-bold text-red-600">{formatRupiah(totalPengeluaran)}</div>
                </div>
                <div className={`rounded-xl p-3 text-center ${totalSaldo >= 0 ? 'bg-blue-50' : 'bg-orange-50'}`}>
                    <div className="text-[10px] text-gray-500">Saldo Akhir</div>
                    <div className={`text-sm font-bold ${totalSaldo >= 0 ? 'text-blue-600' : 'text-orange-600'}`}>
                        {formatRupiah(totalSaldo)}
                    </div>
                </div>
            </div>

            {/* Filter Bulanan */}
            <div className="bg-white rounded-xl p-4 shadow-sm border mb-4">
                <p className="text-xs font-bold text-gray-600 mb-3"><i className="fas fa-calendar-alt mr-1"></i> Filter Laporan Bulanan</p>
                <div className="flex gap-2">
                    <select className="flex-1 border rounded-xl px-3 py-2.5 text-sm" value={filterBulan} onChange={(e) => setFilterBulan(parseInt(e.target.value))}>
                        {months.map((m, idx) => <option key={idx} value={idx + 1}>{m}</option>)}
                    </select>
                    <select className="flex-1 border rounded-xl px-3 py-2.5 text-sm" value={filterTahun} onChange={(e) => setFilterTahun(parseInt(e.target.value))}>
                        {years.map(y => <option key={y} value={y}>{y}</option>)}
                    </select>
                </div>
            </div>

            {/* Statistik Bulan Ini */}
            <div className="bg-gradient-to-r from-blue-500 to-blue-600 rounded-xl p-4 mb-4 text-white">
                <div className="text-center mb-3">
                    <div className="text-xs opacity-80">Laporan Bulan</div>
                    <div className="text-lg font-bold">{months[filterBulan - 1]} {filterTahun}</div>
                </div>
                <div className="grid grid-cols-3 gap-2 text-center">
                    <div>
                        <div className="text-[10px] opacity-80">Pemasukan</div>
                        <div className="text-sm font-bold">{formatRupiah(monthlyStats.pemasukan)}</div>
                    </div>
                    <div>
                        <div className="text-[10px] opacity-80">Pengeluaran</div>
                        <div className="text-sm font-bold">{formatRupiah(monthlyStats.pengeluaran)}</div>
                    </div>
                    <div>
                        <div className="text-[10px] opacity-80">Saldo</div>
                        <div className="text-sm font-bold">{formatRupiah(monthlyStats.saldo)}</div>
                    </div>
                </div>
                <div className="text-center mt-2 pt-2 border-t border-white/20">
                    <div className="text-[10px] opacity-80">Total Transaksi</div>
                    <div className="text-lg font-bold">{monthlyStats.total}</div>
                </div>
            </div>

            {/* Daftar Transaksi */}
            <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-gray-700 text-sm">
                    <i className="fas fa-list-ul mr-1"></i> Daftar Transaksi
                </h3>
                {canAdd && (
                    <button 
                        onClick={() => window.dispatchEvent(new CustomEvent('openKasModal'))}
                        className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-md"
                    >
                        <i className="fas fa-plus mr-1"></i> Tambah
                    </button>
                )}
            </div>

            {loading ? (
                <Loader />
            ) : filteredData.length === 0 ? (
                <div className="text-center py-10 text-gray-400 bg-white rounded-xl border">
                    <i className="fas fa-receipt text-4xl mb-2 opacity-50 block"></i>
                    <p className="text-sm">Belum ada transaksi di bulan ini</p>
                </div>
            ) : (
                <div className="space-y-2">
                    {filteredData.map((item, idx) => (
                        <div 
                            key={item.id || idx} 
                            className="bg-white rounded-xl p-3 shadow-sm border flex justify-between items-center hover:shadow-md transition cursor-pointer"
                            onClick={() => {
                                setSelectedTransaksi(item);
                                setShowDetailModal(true);
                            }}
                        >
                            <div className="flex-1">
                                <div className="flex items-center gap-2 mb-1">
                                    <div className={`w-2 h-2 rounded-full ${item.Tipe === 'Pemasukan' ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                    <span className="text-xs font-medium text-gray-800">{item.Keterangan || 'Transaksi'}</span>
                                </div>
                                <div className="text-[10px] text-gray-400 flex gap-3">
                                    <span><i className="fas fa-calendar mr-1"></i> {item.Tanggal || '-'}</span>
                                    <span><i className="fas fa-user mr-1"></i> {item.Pembuat || '-'}</span>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className={`text-sm font-bold ${item.Tipe === 'Pemasukan' ? 'text-green-600' : 'text-red-600'}`}>
                                    {item.Tipe === 'Pemasukan' ? '+' : '-'} {formatRupiah(item.Jumlah)}
                                </div>
                                <div className="text-[9px] text-gray-400 mt-1">{item.Kategori || item.Tipe}</div>
                            </div>
                        </div>
                    ))}
                </div>
            )}

            {/* Modal Detail Transaksi */}
            {showDetailModal && selectedTransaksi && (
                <BottomSheet isOpen={showDetailModal} onClose={() => setShowDetailModal(false)} title="Detail Transaksi">
                    <div className="space-y-4">
                        <div className="bg-gray-50 rounded-xl p-4 text-center">
                            <div className={`text-2xl font-bold ${selectedTransaksi.Tipe === 'Pemasukan' ? 'text-green-600' : 'text-red-600'}`}>
                                {formatRupiah(selectedTransaksi.Jumlah)}
                            </div>
                            <div className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-bold mt-2 ${selectedTransaksi.Tipe === 'Pemasukan' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                {selectedTransaksi.Tipe}
                            </div>
                        </div>
                        
                        <div className="space-y-2">
                            <div className="flex justify-between py-2 border-b">
                                <span className="text-xs text-gray-500">Tanggal</span>
                                <span className="text-xs font-medium">{selectedTransaksi.Tanggal || '-'}</span>
                            </div>
                            <div className="flex justify-between py-2 border-b">
                                <span className="text-xs text-gray-500">Keterangan</span>
                                <span className="text-xs font-medium text-right flex-1 ml-4">{selectedTransaksi.Keterangan || '-'}</span>
                            </div>
                            <div className="flex justify-between py-2 border-b">
                                <span className="text-xs text-gray-500">Kategori</span>
                                <span className="text-xs font-medium">{selectedTransaksi.Kategori || selectedTransaksi.Tipe}</span>
                            </div>
                            <div className="flex justify-between py-2 border-b">
                                <span className="text-xs text-gray-500">Pembuat</span>
                                <span className="text-xs font-medium">{selectedTransaksi.Pembuat || '-'}</span>
                            </div>
                            {selectedTransaksi.BuktiUrl && (
                                <div className="py-2">
                                    <span className="text-xs text-gray-500 block mb-2">Bukti Transaksi</span>
                                    <div className="bg-gray-100 rounded-lg overflow-hidden">
                                        {selectedTransaksi.BuktiUrl.startsWith('data:image') ? (
                                            <img src={selectedTransaksi.BuktiUrl} className="w-full h-48 object-cover" alt="Bukti" />
                                        ) : (
                                            <iframe src={selectedTransaksi.BuktiUrl} className="w-full h-48" title="Bukti" />
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        {canDelete && (
                            <button 
                                onClick={() => {
                                    setShowDetailModal(false);
                                    handleDelete(selectedTransaksi.id);
                                }}
                                className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl mt-2 flex items-center justify-center gap-2"
                            >
                                <i className="fas fa-trash"></i> Hapus Transaksi
                            </button>
                        )}
                    </div>
                </BottomSheet>
            )}
        </div>
    );
};

// ==========================================
// KAS / KEUANGAN MODAL (TAMBAH TRANSAKSI)
// ==========================================
const KasModal = ({ isOpen, onClose, user, onSuccess }) => {
    const [formData, setFormData] = useState({
        Tipe: 'Pemasukan',
        Kategori: '',
        Jumlah: '',
        Tanggal: new Date().toISOString().split('T')[0],
        Keterangan: '',
        BuktiUrl: ''
    });
    const [submitting, setSubmitting] = useState(false);
    const [buktiPreview, setBuktiPreview] = useState(null);

    const handleFileChange = (file) => {
        if (file) {
            if (file.size > 2 * 1024 * 1024) {
                Swal.fire({ icon: 'warning', title: 'Ukuran file terlalu besar', text: 'Maksimal 2MB!' });
                return;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
                setFormData({ ...formData, BuktiUrl: reader.result });
                setBuktiPreview(reader.result);
            };
            reader.readAsDataURL(file);
        }
    };

    const handleSubmit = async (e) => {
        e.preventDefault();
        
        if (!formData.Jumlah || parseFloat(formData.Jumlah) <= 0) {
            Swal.fire({ icon: 'warning', title: 'Jumlah tidak valid', text: 'Masukkan jumlah yang benar!' });
            return;
        }
        
        setSubmitting(true);
        
        const dataToSend = {
            ...formData,
            Jumlah: parseFloat(formData.Jumlah),
            Pembuat: user.nama || user.username,
            TanggalInput: new Date().toLocaleString('id-ID')
        };
        
        const res = await callAPI('create', { sheetName: 'Kas', data: dataToSend });
        
        if (res.status === 'success') {
            // Kirim notifikasi
            await callAPI('create', {
                sheetName: 'Notifikasi',
                data: {
                    Judul: `💰 Transaksi ${dataToSend.Tipe}: ${formatRupiah(dataToSend.Jumlah)}`,
                    Pesan: `Telah terjadi ${dataToSend.Tipe.toLowerCase()} sebesar ${formatRupiah(dataToSend.Jumlah)} dengan keterangan: ${dataToSend.Keterangan}`,
                    Kategori: 'KAS',
                    Tanggal: new Date().toLocaleString(),
                    Target: 'ADMIN_ONLY',
                    Pelapor: user.username
                }
            });
            
            Swal.fire({ icon: 'success', title: 'Tersimpan!', timer: 1500, showConfirmButton: false });
            onSuccess();
            onClose();
            setFormData({
                Tipe: 'Pemasukan',
                Kategori: '',
                Jumlah: '',
                Tanggal: new Date().toISOString().split('T')[0],
                Keterangan: '',
                BuktiUrl: ''
            });
            setBuktiPreview(null);
        } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: res.message });
        }
        
        setSubmitting(false);
    };

    const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
    };

    if (!isOpen) return null;

    return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center" onClick={onClose}>
            <div className="bg-white rounded-t-2xl md:rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="sticky top-0 bg-white p-4 border-b flex justify-between items-center">
                    <h3 className="font-bold text-lg">
                        <i className="fas fa-plus-circle text-blue-500 mr-2"></i>Tambah Transaksi
                    </h3>
                    <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                        <i className="fas fa-times text-gray-500"></i>
                    </button>
                </div>
                
                <form onSubmit={handleSubmit} className="p-4 space-y-4">
                    {/* Tipe Transaksi */}
                    <div>
                        <label className="block text-xs font-bold text-gray-700 mb-2">Tipe Transaksi</label>
                        <div className="flex gap-3">
                            <button 
                                type="button"
                                onClick={() => setFormData({...formData, Tipe: 'Pemasukan', Kategori: ''})}
                                className={`flex-1 py-3 rounded-xl font-bold transition ${formData.Tipe === 'Pemasukan' ? 'bg-green-500 text-white shadow-md' : 'bg-gray-100 text-gray-600'}`}
                            >
                                <i className="fas fa-arrow-down mr-1"></i> Pemasukan
                            </button>
                            <button 
                                type="button"
                                onClick={() => setFormData({...formData, Tipe: 'Pengeluaran', Kategori: ''})}
                                className={`flex-1 py-3 rounded-xl font-bold transition ${formData.Tipe === 'Pengeluaran' ? 'bg-red-500 text-white shadow-md' : 'bg-gray-100 text-gray-600'}`}
                            >
                                <i className="fas fa-arrow-up mr-1"></i> Pengeluaran
                            </button>
                        </div>
                    </div>

                    {/* Kategori */}
                    <div>
                        <label className="block text-xs font-bold text-gray-700 mb-2">Kategori</label>
                        <select 
                            className="w-full border rounded-xl px-3 py-3 text-sm"
                            value={formData.Kategori}
                            onChange={e => setFormData({...formData, Kategori: e.target.value})}
                            required
                        >
                            <option value="">Pilih Kategori</option>
                            {formData.Tipe === 'Pemasukan' ? (
                                <>
                                    <option value="Iuran Wajib">Iuran Wajib Bulanan</option>
                                    <option value="Iuran Sukarela">Iuran Sukarela</option>
                                    <option value="Donasi">Donasi / Sumbangan</option>
                                    <option value="Kas RT">Kas RT</option>
                                    <option value="Lainnya">Lainnya</option>
                                </>
                            ) : (
                                <>
                                    <option value="Kegiatan">Kegiatan RT</option>
                                    <option value="Perawatan">Perawatan Lingkungan</option>
                                    <option value="Administrasi">Administrasi</option>
                                    <option value="Sosial">Kegiatan Sosial</option>
                                    <option value="Lainnya">Lainnya</option>
                                </>
                            )}
                        </select>
                    </div>

                    {/* Jumlah */}
                    <div>
                        <label className="block text-xs font-bold text-gray-700 mb-2">Jumlah (Rp)</label>
                        <div className="relative">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">Rp</div>
                            <input 
                                type="number" 
                                className="w-full pl-10 pr-3 py-3 border rounded-xl text-sm"
                                placeholder="0"
                                value={formData.Jumlah}
                                onChange={e => setFormData({...formData, Jumlah: e.target.value})}
                                required
                            />
                        </div>
                    </div>

                    {/* Tanggal */}
                    <div>
                        <label className="block text-xs font-bold text-gray-700 mb-2">Tanggal Transaksi</label>
                        <input 
                            type="date" 
                            className="w-full border rounded-xl px-3 py-3 text-sm"
                            value={formData.Tanggal}
                            onChange={e => setFormData({...formData, Tanggal: e.target.value})}
                            required
                        />
                    </div>

                    {/* Keterangan */}
                    <div>
                        <label className="block text-xs font-bold text-gray-700 mb-2">Keterangan</label>
                        <textarea 
                            className="w-full border rounded-xl px-3 py-3 text-sm h-20"
                            placeholder="Deskripsi transaksi..."
                            value={formData.Keterangan}
                            onChange={e => setFormData({...formData, Keterangan: e.target.value})}
                            required
                        />
                    </div>
